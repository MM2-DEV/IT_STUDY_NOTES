<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-label="Client-server architectures">
<title>Client-server architectures</title>
<rect width="820" height="330" fill="#ffffff"/>
<text x="130" y="20" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Two-tier</text><rect x="60" y="40" width="140" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="130" y="57.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><text x="130" y="72.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(UI + application)</text><rect x="60" y="160" width="140" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="130" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Database server</text><path d="M130,90 L130,158" fill="none" stroke="#17292d" stroke-width="2"/><path d="M130,158 L125.7,149.0 L134.3,149.0 Z" fill="#17292d"/><text x="190" y="124" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">SQL via ODBC/JDBC</text><path d="M110,158 L110,92" fill="none" stroke="#17292d" stroke-width="2"/><path d="M110,92 L114.3,101.0 L105.7,101.0 Z" fill="#17292d"/><line x1="330" y1="20" x2="330" y2="300" stroke="#4b6166" stroke-width="2" stroke-dasharray="6 6"/><text x="560" y="20" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Three-tier</text><rect x="490" y="40" width="140" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="560" y="57.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><text x="560" y="72.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(presentation tier)</text><rect x="490" y="140" width="140" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="560" y="157.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Application server</text><text x="560" y="172.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(business logic)</text><rect x="490" y="240" width="140" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="560" y="257.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Database server</text><text x="560" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(data tier)</text><path d="M560,90 L560,138" fill="none" stroke="#17292d" stroke-width="2"/><path d="M560,138 L555.7,129.0 L564.3,129.0 Z" fill="#17292d"/><path d="M560,190 L560,238" fill="none" stroke="#17292d" stroke-width="2"/><path d="M560,238 L555.7,229.0 L564.3,229.0 Z" fill="#17292d"/><text x="570" y="114" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">HTTP / forms</text><text x="570" y="214" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">SQL</text><text x="410" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Two-tier and three-tier client-server architectures</text>
</svg>
