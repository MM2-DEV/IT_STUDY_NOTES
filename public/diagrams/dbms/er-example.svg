ont-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">N</text><line x1="130" y1="200" x2="130" y2="233" stroke="#17292d" stroke-width="2"/><line x1="127" y1="287" x2="127" y2="330" stroke="#17292d" stroke-width="2"/><line x1="133" y1="287" x2="133" y2="330" stroke="#17292d" stroke-width="2"/><text x="144" y="215" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><text x="146" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">N</text><ellipse cx="60" cy="60" rx="50" ry="20" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="60" y="61" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Roll_No</text><line x1="35.64" y1="69" x2="84.36" y2="69" stroke="#17292d" stroke-width="1.5"/><line x1="85" y1="80" x2="110" y2="150" stroke="#17292d" stroke-width="2"/><ellipse cx="180" cy="40" rx="44" ry="20" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="41" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Name</text><line x1="170" y1="60" x2="145" y2="150" stroke="#17292d" stroke-width="2"/><ellipse cx="290" cy="90" rx="44" ry="20" fill="#fff" stroke="#17292d" stroke-width="2"/><ellipse cx="290" cy="90" rx="39" ry="15" fill="none" stroke="#17292d" stroke-width="2"/><text x="290" y="91" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Phone</text><line x1="255" y1="100" x2="190" y2="150" stroke="#17292d" stroke-width="2"/><ellipse cx="290" cy="40" rx="40" ry="20" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><text x="290" y="41" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Age</text><line x1="262" y1="52" x2="175" y2="150" stroke="#17292d" stroke-width="2"/><ellipse cx="370" cy="90" rx="40" ry="20" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="370" y="91" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Grade</text><line x1="370" y1="110" x2="370" y2="143" stroke="#17292d" stroke-width="2"/><ellipse cx="560" cy="70" rx="54" ry="20" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="560" y="71" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Course_ID</text><line x1="528.68" y1="79" x2="591.32" y2="79" stroke="#17292d" stroke-width="1.5"/><line x1="580" y1="90" x2="590" y2="150" stroke="#17292d" stroke-width="2"/><ellipse cx="680" cy="70" rx="44" ry="20" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="680" y="71" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Title</text><line x1="670" y1="90" x2="640" y2="150" stroke="#17292d" stroke-width="2"/><ellipse cx="330" cy="355" rx="58" ry="20" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="330" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">G_Name</text><line x1="272" y1="357" x2="200" y2="357" stroke="#17292d" stroke-width="2"/><line x1="308" y1="367" x2="352" y2="367" stroke="#17292d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="380" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">ER diagram: STUDENT enrols in 