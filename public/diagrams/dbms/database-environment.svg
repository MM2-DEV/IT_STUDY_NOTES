rial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Database</text><rect x="600" y="110" width="180" height="50" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="690" y="127.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data and database</text><text x="690" y="142.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">administrators</text><rect x="600" y="320" width="180" height="50" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="690" y="337" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Repository</text><text x="690" y="353" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(metadata)</text><path d="M130,70 L130,108" fill="none" stroke="#17292d" stroke-width="2"/><path d="M130,108 L125.7,99.0 L134.3,99.0 Z" fill="#17292d"/><path d="M130,160 L130,198" fill="none" stroke="#17292d" stroke-width="2"/><path d="M130,198 L125.7,189.0 L134.3,189.0 Z" fill="#17292d"/><path d="M220,228 L318,228" fill="none" stroke="#17292d" stroke-width="2"/><path d="M318,228 L309.0,232.3 L309.0,223.7 Z" fill="#17292d"/><path d="M410,70 L410,108" fill="none" stroke="#17292d" stroke-width="2"/><path d="M410,108 L405.7,99.0 L414.3,99.0 Z" fill="#17292d"/><path d="M320,145 L222,215" fill="none" stroke="#17292d" stroke-width="2"/><path d="M222,215 L226.8,206.2 L231.9,213.3 Z" fill="#17292d"/><path d="M500,145 L640,318" fill="none" stroke="#17292d" stroke-width="2" stroke-dasharray="5 4"/><path d="M640,318 L631.0,313.7 L637.7,308.3 Z" fill="#17292d"/><path d="M600,145 L502,215" fill="none" stroke="#17292d" stroke-width="2"/><path