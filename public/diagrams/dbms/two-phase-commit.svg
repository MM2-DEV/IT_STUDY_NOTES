<svg xmlns="http://www.w3.org/2000/svg" width="780" height="350" viewBox="0 0 780 350" role="img" aria-label="Two-phase commit">
<title>Two-phase commit</title>
<rect width="780" height="350" fill="#ffffff"/>
<rect x="60" y="20" width="160" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="140" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Coordinator</text><rect x="560" y="20" width="160" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="640" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Participants (sites)</text><line x1="140" y1="60" x2="140" y2="330" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 5"/><line x1="640" y1="60" x2="640" y2="330" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 5"/><path d="M142,90 L638,90" fill="none" stroke="#17292d" stroke-width="2"/><path d="M638,90 L629.0,94.3 L629.0,85.7 Z" fill="#17292d"/><text x="390" y="82" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Phase 1: &lt;prepare T>  (log &lt;prepare T>)</text><path d="M638,130 L142,130" fill="none" stroke="#17292d" stroke-width="2"/><path d="M142,130 L151.0,125.7 L151.0,134.3 Z" fill="#17292d"/><text x="390" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">&lt;ready T>  (log &lt;ready T>)  or  &lt;abort T></text><text x="390" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">all ready → log &lt;commit T>;  any abort/timeout → log &lt;abort T></text><path d="M142,220 L638,220" fill="none" stroke="#17292d" stroke-width="2"/><path d="M638,220 L629.0,224.3 L629.0,215.7 Z" fill="#17292d"/><text x="390" y="212" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Phase 2: &lt;commit T>  or  &lt;abort T></text><path d="M638,265 L142,265" fill="none" stroke="#17292d" stroke-width="2"/><path d="M142,265 L151.0,260.7 L151.0,269.3 Z" fill="#17292d"/><text x="390" y="257" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">acknowledge (after logging commit/abort)</text><text x="390" y="305" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">coordinator logs &lt;complete T></text><text x="390" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Two-phase commit protocol</text>
</svg>
