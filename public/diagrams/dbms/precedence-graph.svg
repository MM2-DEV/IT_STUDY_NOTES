<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="Precedence graph">
<title>Precedence graph</title>
<rect width="760" height="280" fill="#ffffff"/>
<text x="170" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S1: no cycle → conflict serializable</text><circle cx="80" cy="90" r="26" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="80" y="91" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T1</text><circle cx="260" cy="90" r="26" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="260" y="91" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T3</text><circle cx="170" cy="190" r="26" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="170" y="191" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T2</text><path d="M106,90 L232,90" fill="none" stroke="#17292d" stroke-width="2"/><path d="M232,90 L223.0,94.3 L223.0,85.7 Z" fill="#17292d"/><text x="169" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">x</text><path d="M98,110 L150,170" fill="none" stroke="#17292d" stroke-width="2"/><path d="M150,170 L140.8,166.0 L147.4,160.3 Z" fill="#17292d"/><text x="110" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">x</text><path d="M242,110 L190,170" fill="none" stroke="#17292d" stroke-width="2"/><path d="M190,170 L192.6,160.3 L199.2,166.0 Z" fill="#17292d"/><text x="230" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">x</text><text x="170" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">equivalent serial order: T1 → T3 → T2</text><line x1="370" y1="30" x2="370" y2="250" stroke="#4b6166" stroke-width="2" stroke-dasharray="6 6"/><text x="570" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S2: cycle → not conflict serializable</text><circle cx="480" cy="130" r="26" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="480" y="131" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T1</text><circle cx="660" cy="130" r="26" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="660" y="131" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T2</text><path d="M500,112 Q570,82 640,112" fill="none" stroke="#17292d" stroke-width="2"/><path d="M640,112 L630.0,112.5 L633.4,104.5 Z" fill="#17292d"/><text x="570" y="89" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">A</text><path d="M640,148 Q570,178 500,148" fill="none" stroke="#17292d" stroke-width="2"/><path d="M500,148 L510.0,147.5 L506.6,155.5 Z" fill="#17292d"/><text x="570" y="171" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">B</text><text x="380" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Precedence graphs: S1 = r1(x) r3(y) w1(x) w2(y) r3(x) w2(x); S2 has edges T1 → T2 and T2 → T1</text>
</svg>
