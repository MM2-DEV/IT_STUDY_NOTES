="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">140</text><rect x="146" y="116" width="58" height="22" rx="3" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="4 3"/><text x="140" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">new record: any free space</text><text x="420" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sequential (sorted on key)</text><rect x="310" y="60" width="70" height="86" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="345" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">block 1</text><rect x="316" y="64" width="58" height="22" rx="3" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="345" y="75" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">101</text><rect x="316" y="90" width="58" height="22" rx="3" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="345" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">112</text><rect x="316" y="116" width="58" height="22" rx="3" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="345" y="127" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">125</text><rect x="420" y="60" width="70" height="86" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="455" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">block 2</text><rect x="426" y="64" width="58" height="22" rx="3" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="455" y="75" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">138</text><rect x="426" y="90" width="58" height="22" rx="3" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="455" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">140</text><rect x="426" y="116" width="58" height="22" rx="3" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="4 3"/><text x="420" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">records kept in key order</text><text x="730" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hash: bucket = key mod 7</text><text x="620" y="63" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">bucket 0</text><rect x="630" y="50" width="60" height="26" rx="3" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="660" y="63" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">112</text><path d="M690,63 L728,63" fill="none" stroke="#17292d" stroke-width="2"/><path d="M728,63 L719.0,67.3 L719.0,58.7 Z" fill="#17292d"/><rect x="730" y="50" width="60" height="26" rx="3" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="760" y="63" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">140</text><text x="800" y="63" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="norma