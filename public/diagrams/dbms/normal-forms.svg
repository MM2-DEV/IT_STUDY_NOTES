1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">dependency</text><text x="652" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">→</text><rect x="788" y="58" width="112" height="217" rx="4" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="844" y="78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5NF</text><text x="844" y="104" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">no join</text><text x="844" y="119" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">dependency</text><text x="780" y="68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">→</text><path d="M30,22 L880,22" fill="none" stroke="#08595a" stroke-width="2"/><path d="M880,22 L871.0,26.3 L871.0,17.7 Z" fill="#08595a"/><text x="455" y="12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">stricter normal form, less redundancy, more tables</text><text x="460" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Normal forms: each one includes the previous and removes one more kind of dependency</text>
