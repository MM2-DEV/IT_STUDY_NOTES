<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-label="Wait-for graph">
<title>Wait-for graph</title>
<rect width="820" height="260" fill="#ffffff"/>
<circle cx="120" cy="70" r="26" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="120" y="71" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T1</text><circle cx="340" cy="70" r="26" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="340" y="71" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T2</text><circle cx="230" cy="200" r="26" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="230" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T3</text><path d="M146,70 L312,70" fill="none" stroke="#17292d" stroke-width="2"/><path d="M312,70 L303.0,74.3 L303.0,65.7 Z" fill="#17292d"/><text x="229" y="56" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">waits for B (held by T2)</text><path d="M328,94 L248,178" fill="none" stroke="#17292d" stroke-width="2"/><path d="M248,178 L251.1,168.5 L257.4,174.5 Z" fill="#17292d"/><text x="333" y="136" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">waits for C</text><path d="M210,180 L136,94" fill="none" stroke="#17292d" stroke-width="2"/><path d="M136,94 L145.2,98.0 L138.6,103.7 Z" fill="#17292d"/><text x="128" y="137" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">waits for A</text><text x="560" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Edge Ti → Tj: Ti waits for</text><text x="560" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">a data item held by Tj.</text><text x="560" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">A cycle T1 → T2 → T3 → T1</text><text x="560" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">means a deadlock.</text><text x="410" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Wait-for graph used for deadlock detection</text>
</svg>
