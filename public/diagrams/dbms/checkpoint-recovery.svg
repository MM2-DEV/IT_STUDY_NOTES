<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Checkpoint recovery">
<title>Checkpoint recovery</title>
<rect width="900" height="290" fill="#ffffff"/>
<line x1="80" y1="230" x2="740" y2="230" stroke="#17292d" stroke-width="2"/><text x="760" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">time</text><line x1="330" y1="30" x2="330" y2="240" stroke="#08595a" stroke-width="2" stroke-dasharray="6 4"/><text x="330" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">checkpoint</text><line x1="640" y1="30" x2="640" y2="240" stroke="#c0392b" stroke-width="3"/><text x="640" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">system failure</text><text x="60" y="50" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T1</text><line x1="100" y1="50" x2="260" y2="50" stroke="#08595a" stroke-width="5"/><text x="266" y="41" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">commit</text><text x="660" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="start" dominant-baseline="middle">ignore (committed before checkpoint)</text><text x="60" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T2</text><line x1="180" y1="86" x2="450" y2="86" stroke="#08595a" stroke-width="5"/><text x="456" y="77" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">commit</text><text x="660" y="86" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">redo</text><text x="60" y="122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T3</text><line x1="380" y1="122" x2="560" y2="122" stroke="#08595a" stroke-width="5"/><text x="566" y="113" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">commit</text><text x="660" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">redo</text><text x="60" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T4</text><line x1="240" y1="158" x2="640" y2="158" stroke="#c0392b" stroke-width="5"/><text x="660" y="158" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">undo</text><text x="60" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">T5</text><line x1="470" y1="194" x2="640" y2="194" stroke="#c0392b" stroke-width="5"/><text x="660" y="194" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">undo</text><text x="450" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Recovery with a checkpoint: committed after the checkpoint → redo; not committed → undo</text>
</svg>
