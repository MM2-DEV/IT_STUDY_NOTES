<svg xmlns="http://www.w3.org/2000/svg" width="860" height="325" viewBox="0 0 860 325" role="img" aria-label="Hierarchical and network models">
<title>Hierarchical and network models</title>
<rect width="860" height="325" fill="#ffffff"/>
<text x="200" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hierarchical model (tree)</text><rect x="140" y="40" width="120" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="200" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Department</text><rect x="40" y="130" width="120" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="100" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Teacher</text><rect x="240" y="130" width="120" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="300" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Course</text><rect x="240" y="220" width="120" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="300" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Student</text><path d="M180,80 L110,128" fill="none" stroke="#17292d" stroke-width="2"/><path d="M110,128 L115.0,119.3 L119.9,126.5 Z" fill="#17292d"/><path d="M220,80 L290,128" fill="none" stroke="#17292d" stroke-width="2"/><path d="M290,128 L280.1,126.5 L285.0,119.3 Z" fill="#17292d"/><path d="M300,170 L300,218" fill="none" stroke="#17292d" stroke-width="2"/><path d="M300,218 L295.7,209.0 L304.3,209.0 Z" fill="#17292d"/><text x="200" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">each child has exactly ONE parent (1:N)</text><line x1="420" y1="30" x2="420" y2="300" stroke="#4b6166" stroke-width="2" stroke-dasharray="6 6"/><text x="640" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Network model (graph)</text><rect x="470" y="40" width="120" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="530" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Teacher</text><rect x="690" y="40" width="120" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="750" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Department</text><rect x="470" y="180" width="120" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="530" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Course</text><rect x="690" y="180" width="120" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="750" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Student</text><path d="M530,80 L530,178" fill="none" stroke="#17292d" stroke-width="2"/><path d="M530,178 L525.7,169.0 L534.3,169.0 Z" fill="#17292d"/><path d="M750,80 L750,178" fill="none" stroke="#17292d" stroke-width="2"/><path d="M750,178 L745.7,169.0 L754.3,169.0 Z" fill="#17292d"/><path d="M700,80 L580,178" fill="none" stroke="#17292d" stroke-width="2"/><path d="M580,178 L584.2,168.9 L589.7,175.7 Z" fill="#17292d"/><text x="640" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">a record can have MANY parents (M:N)</text><text x="430" y="313" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Hierarchical (tree) and network (graph) data models</text>
