ght="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">mining</text><path d="M430,90 L453,90" fill="none" stroke="#17292d" stroke-width="2"/><path d="M453,90 L444.0,94.3 L444.0,85.7 Z" fill="#17292d"/><rect x="600" y="60" width="120" height="60" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="660" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Pattern</text><text x="660" y="98" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">evaluation</text><path d="M575,90 L598,90" fill="none" stroke="#17292d" stroke-width="2"/><path d="M598,90 L589.0,94.3 L589.0,85.7 Z" fill="#17292d"/><rect x="745" y="60" width="120" height="60" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="805" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Knowledge</text><text x="805" y="98" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">presentation</text><path d="M720,90 L743,90" fill="none" stroke="#17292d" stroke-width="2"/><path d="M743,90 L734.0,94.3 L734.0,85.7 Z" fill="#17292d"/><line x1="805" y1="120" x2="805" y2="160" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 4"/><line x1="805" y1="160" x2="80" y2="160" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 4"/><path d="M80,160 L80,122" fill="none" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 4"/><path d="M80,122 L84.3,131.0 L75.7,131.0 Z" fill="#4b6166"/><text x="440" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">iterative: results may lead back to earlier steps</text><text x="450" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Steps of knowledge discovery in databases (KDD)</text>
</svg>
