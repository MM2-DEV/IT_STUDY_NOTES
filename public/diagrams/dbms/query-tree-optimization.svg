roke-width="2"/><text x="640" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Teaches</text><rect x="705" y="174" width="110" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="760" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Course</text><line x1="640" y1="70" x2="640" y2="100" stroke="#17292d" stroke-width="2"/><line x1="625" y1="135" x2="575" y2="175" stroke="#17292d" stroke-width="2"/><line x1="655" y1="135" x2="745" y2="174" stroke="#17292d" stroke-width="2"/><line x1="548" y1="206" x2="510" y2="242" stroke="#17292d" stroke-width="2"/><line x1="572" y1="206" x2="628" y2="242" stroke="#17292d" stroke-width="2"/><line x1="500" y1="280" x2="500" y2="314" stroke="#17292d" stroke-width="2"/><line x1="640" y1="280" x2="640" y2="314" stroke="#17292d" stroke-width="2"/><text x="430" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Heuristic optimization: selections are applied before the joins, so the joins work on fewer tuples</text>
