<svg xmlns="http://www.w3.org/2000/svg" width="960" height="285" viewBox="0 0 960 285" role="img" aria-label="File processing vs database approach">
<title>File processing vs database approach</title>
<rect width="960" height="285" fill="#ffffff"/>
<text x="230" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">File processing system</text><rect x="20" y="50" width="130" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="85" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Accounts</text><text x="85" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">program</text><path d="M85,100 L85,148" fill="none" stroke="#17292d" stroke-width="2"/><path d="M85,148 L80.7,139.0 L89.3,139.0 Z" fill="#17292d"/><rect x="20" y="150" width="130" height="56" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="85" y="170.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Accounts file</text><text x="85" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(roll, name, fees)</text><rect x="170" y="50" width="130" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="235" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Library</text><text x="235" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">program</text><path d="M235,100 L235,148" fill="none" stroke="#17292d" stroke-width="2"/><path d="M235,148 L230.7,139.0 L239.3,139.0 Z" fill="#17292d"/><rect x="170" y="150" width="130" height="56" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="235" y="170.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Library file</text><text x="235" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(roll, name, books)</text><rect x="320" y="50" width="130" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="385" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Exam</text><text x="385" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">program</text><path d="M385,100 L385,148" fill="none" stroke="#17292d" stroke-width="2"/><path d="M385,148 L380.7,139.0 L389.3,139.0 Z" fill="#17292d"/><rect x="320" y="150" width="130" height="56" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="385" y="170.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Exam file</text><text x="385" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(roll, name, marks)</text><text x="230" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">separate files; name stored three times (redundancy)</text><text x="720" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Database approach</text><rect x="510" y="50" width="130" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="575" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Accounts</text><text x="575" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">program</text><path d="M575,100 L680,128" fill="none" stroke="#17292d" stroke-width="2"/><path d="M680,128 L670.2,129.9 L672.4,121.5 Z" fill="#17292d"/><rect x="660" y="50" width="130" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="725" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Library</text><text x="725" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">program</text><path d="M725,100 L720,128" fill="none" stroke="#17292d" stroke-width="2"/><path d="M720,128 L717.3,118.4 L725.9,119.9 Z" fill="#17292d"/><rect x="810" y="50" width="130" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="875" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Exam</text><text x="875" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">program</text><path d="M875,100 L760,128" fill="none" stroke="#17292d" stroke-width="2"/><path d="M760,128 L767.7,121.6 L769.8,130.1 Z" fill="#17292d"/><rect x="600" y="130" width="240" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="720" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DBMS</text><path d="M720,170 L720,188" fill="none" stroke="#17292d" stroke-width="2"/><path d="M720,188 L715.7,179.0 L724.3,179.0 Z" fill="#17292d"/><rect x="600" y="190" width="240" height="44" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="720" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">One shared, integrated</text><text x="720" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">database</text><line x1="490" y1="40" x2="490" y2="240" stroke="#4b6166" stroke-width="2" stroke-dasharray="6 6"/><text x="480" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">In file processing each program has its own files; in the database approach all programs share one database through the DBMS</text>
</svg>
