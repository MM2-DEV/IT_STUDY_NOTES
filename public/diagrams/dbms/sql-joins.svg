<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="SQL joins">
<title>SQL joins</title>
<rect width="900" height="200" fill="#ffffff"/>
<defs><clipPath id="cINNERJOIN"><circle cx="90" cy="80" r="46"/></clipPath></defs><circle cx="90" cy="80" r="46" fill="#fff" stroke="none"/><circle cx="150" cy="80" r="46" fill="#fff" stroke="none"/><circle cx="150" cy="80" r="46" fill="#69c6ca" clip-path="url(#cINNERJOIN)"/><circle cx="90" cy="80" r="46" fill="none" stroke="#17292d" stroke-width="2"/><circle cx="150" cy="80" r="46" fill="none" stroke="#17292d" stroke-width="2"/><text x="70" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><text x="170" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><text x="120" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">INNER JOIN</text><text x="120" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">only matching rows</text><defs><clipPath id="cLEFTJOIN"><circle cx="310" cy="80" r="46"/></clipPath></defs><circle cx="310" cy="80" r="46" fill="#69c6ca" stroke="none"/><circle cx="370" cy="80" r="46" fill="#fff" stroke="none"/><circle cx="370" cy="80" r="46" fill="#69c6ca" clip-path="url(#cLEFTJOIN)"/><circle cx="310" cy="80" r="46" fill="none" stroke="#17292d" stroke-width="2"/><circle cx="370" cy="80" r="46" fill="none" stroke="#17292d" stroke-width="2"/><text x="290" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><text x="390" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><text x="340" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">LEFT JOIN</text><text x="340" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">all of A + matches of B</text><defs><clipPath id="cRIGHTJOIN"><circle cx="530" cy="80" r="46"/></clipPath></defs><circle cx="530" cy="80" r="46" fill="#fff" stroke="none"/><circle cx="590" cy="80" r="46" fill="#69c6ca" stroke="none"/><circle cx="590" cy="80" r="46" fill="#69c6ca" clip-path="url(#cRIGHTJOIN)"/><circle cx="530" cy="80" r="46" fill="none" stroke="#17292d" stroke-width="2"/><circle cx="590" cy="80" r="46" fill="none" stroke="#17292d" stroke-width="2"/><text x="510" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><text x="610" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><text x="560" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">RIGHT JOIN</text><text x="560" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">all of B + matches of A</text><defs><clipPath id="cFULLOUTERJOIN"><circle cx="750" cy="80" r="46"/></clipPath></defs><circle cx="750" cy="80" r="46" fill="#69c6ca" stroke="none"/><circle cx="810" cy="80" r="46" fill="#69c6ca" stroke="none"/><circle cx="810" cy="80" r="46" fill="#69c6ca" clip-path="url(#cFULLOUTERJOIN)"/><circle cx="750" cy="80" r="46" fill="none" stroke="#17292d" stroke-width="2"/><circle cx="810" cy="80" r="46" fill="none" stroke="#17292d" stroke-width="2"/><text x="730" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><text x="830" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><text x="780" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">FULL OUTER JOIN</text><text x="780" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">all rows of A and B</text><text x="450" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">SQL joins: the shaded part shows the rows returned (unmatched columns are NULL)</text>
</svg>
