292d" stroke-width="1.2"/><rect x="322" y="74" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="322" y="114" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="322" y="154" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="120" y="90" width="60" height="40" fill="#dbda65" stroke="#17292d" stroke-width="1.2"/><rect x="120" y="130" width="60" height="40" fill="#dbda65" stroke="#17292d" stroke-width="1.2"/><rect x="120" y="170" width="60" height="40" fill="#dbda65" stroke="#17292d" stroke-width="1.2"/><rect x="180" y="90" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="180" y="130" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="180" y="170" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="240" y="90" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="240" y="130" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="240" y="170" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="300" y="90" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="300" y="130" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><rect x="300" y="170" width="60" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="1.2"/><text x="150" y="224" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Q1</text><text x="210" y="224" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Q2</text><text x="270" y="224" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Q3</text><text x="330" y="224" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Q4</text><text x="112" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="end" dominant-baseline="middle">Dhaka</text><text x="112" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="end" dominant-baseline="middle">Khulna</text><text x="112" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="end" dominant-baseline="middle">Sylhet</text><text x="240" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Time (quarter)</text><text x="40" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" transform="rotate(-90 40 150)">Location</text><text x="456" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Item</text><text x="430" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">each cell = a measure (sales)</text><text x="470" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Roll-up: Q1–Q4 → year (summarize)</text><text x="470" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Drill-down: quarter → month (more detail)</text><text x="470" y="230" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Slice: Time = Q1 (one dimension fixed)</text><text x="470" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Dice: Q1–Q2 × Dhaka, Sylhet (sub-cube)</text><text x="470" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Pivot: swap Location and Time axes</text><text x="395" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">A data cube with three dimensions; the shaded face is the slice Time = Q1</text>
