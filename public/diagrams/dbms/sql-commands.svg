<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-label="SQL command categories">
<title>SQL command categories</title>
<rect width="920" height="330" fill="#ffffff"/>
<rect x="390" y="20" width="140" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="460" y="42" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SQL commands</text><rect x="20" y="110" width="160" height="56" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="100" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DDL</text><text x="100" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data Definition</text><line x1="460" y1="64" x2="100" y2="108" stroke="#17292d" stroke-width="2"/><rect x="40" y="182" width="120" height="120" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="100" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">CREATE</text><text x="100" y="221" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ALTER</text><text x="100" y="243" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DROP</text><text x="100" y="265" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">TRUNCATE</text><text x="100" y="287" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">RENAME</text><rect x="200" y="110" width="160" height="56" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="280" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DML</text><text x="280" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data Manipulation</text><line x1="460" y1="64" x2="280" y2="108" stroke="#17292d" stroke-width="2"/><rect x="220" y="182" width="120" height="76" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="280" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">INSERT</text><text x="280" y="221" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">UPDATE</text><text x="280" y="243" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DELETE</text><rect x="380" y="110" width="160" height="56" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="460" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DQL</text><text x="460" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data Query</text><line x1="460" y1="64" x2="460" y2="108" stroke="#17292d" stroke-width="2"/><rect x="400" y="182" width="120" height="32" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="460" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SELECT</text><rect x="560" y="110" width="160" height="56" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="640" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DCL</text><text x="640" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data Control</text><line x1="460" y1="64" x2="640" y2="108" stroke="#17292d" stroke-width="2"/><rect x="580" y="182" width="120" height="54" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="640" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">GRANT</text><text x="640" y="221" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">REVOKE</text><rect x="740" y="110" width="160" height="56" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="820" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">TCL</text><text x="820" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Transaction Control</text><line x1="460" y1="64" x2="820" y2="108" stroke="#17292d" stroke-width="2"/><rect x="760" y="182" width="120" height="76" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="820" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">COMMIT</text><text x="820" y="221" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ROLLBACK</text><text x="820" y="243" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SAVEPOINT</text><text x="460" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Categories of SQL commands</text>
</svg>
