h="2"/><line x1="215" y1="136" x2="290" y2="180" stroke="#17292d" stroke-width="2"/><line x1="110" y1="222" x2="110" y2="258" stroke="#17292d" stroke-width="2"/><text x="480" y="80" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">π name (</text><text x="480" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">   σ cgpa>3.5 (Student)</text><text x="480" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">   ⋈ dept_id Department )</text><text x="480" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">leaves = relations,</text><text x="480" y="188" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">internal nodes = operations;</text><text x="480" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">evaluated from the leaves upward</text><text x="380" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Query tree for: names of students with CGPA above 3.5, with their department</text>
