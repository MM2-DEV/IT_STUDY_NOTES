<svg xmlns="http://www.w3.org/2000/svg" width="670" height="280" viewBox="0 0 670 280" role="img" aria-label="Aggregation">
<title>Aggregation</title>
<rect width="670" height="280" fill="#ffffff"/>
<rect x="30" y="30" width="560" height="110" rx="8" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="7 5"/><rect x="50" y="60" width="140" height="50" rx="0" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="120" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">EMPLOYEE</text><polygon points="310,55 380,85 310,115 240,85" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="310" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">WORKS_ON</text><rect x="430" y="60" width="140" height="50" rx="0" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="500" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">PROJECT</text><line x1="190" y1="85" x2="240" y2="85" stroke="#17292d" stroke-width="2"/><line x1="380" y1="85" x2="430" y2="85" stroke="#17292d" stroke-width="2"/><text x="310" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">aggregated relationship treated as one entity</text><polygon points="310,182 375,210 310,238 245,210" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="310" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">USES</text><line x1="310" y1="140" x2="310" y2="182" stroke="#17292d" stroke-width="2"/><rect x="500" y="185" width="140" height="50" rx="0" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="570" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">MACHINERY</text><line x1="375" y1="210" x2="500" y2="210" stroke="#17292d" stroke-width="2"/><text x="335" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Aggregation: the WORKS_ON relationship (with its entities) takes part in the USES relationship</text>
