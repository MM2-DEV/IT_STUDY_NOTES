<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="Two-phase locking">
<title>Two-phase locking</title>
<rect width="800" height="300" fill="#ffffff"/>
<line x1="60" y1="250" x2="760" y2="250" stroke="#17292d" stroke-width="2"/><line x1="60" y1="250" x2="60" y2="30" stroke="#17292d" stroke-width="2"/><text x="410" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">time →</text><text x="28" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4b6166" text-anchor="middle" transform="rotate(-90 28 140)">number of locks held</text><polyline points="60,250 140,250 140,200 240,200 240,140 340,140 340,80 400,80 470,80 470,140 560,140 560,200 650,200 650,250 720,250" fill="none" stroke="#08595a" stroke-width="3"/><line x1="400" y1="40" x2="400" y2="250" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/><text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">lock point</text><text x="240" y="60" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Growing phase</text><text x="240" y="78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">locks acquired, none released</text><text x="580" y="60" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Shrinking phase</text><text x="580" y="78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">locks released, none acquired</text><text x="400" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Two-phase locking: the number of locks rises in the growing phase and falls in the shrinking phase</text>
</svg>
