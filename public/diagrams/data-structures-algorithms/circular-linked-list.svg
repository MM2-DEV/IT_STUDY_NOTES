<svg xmlns="http://www.w3.org/2000/svg" width="700" height="175" viewBox="0 0 700 175" role="img" aria-label="Circular linked list">
<title>Circular linked list</title>
<rect width="700" height="175" fill="#ffffff"/>
<text x="40" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">head</text><polyline points="62,70 100,70" fill="none" stroke="#17292d" stroke-width="2"/><path d="M100,70 l-9,-5 v10 Z" fill="#17292d"/><rect x="100" y="50" width="60" height="40" rx="4" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><rect x="160" y="50" width="34" height="40" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="130" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">10</text><circle cx="177" cy="70" r="4" fill="#17292d"/><polyline points="177,70 240,70" fill="none" stroke="#17292d" stroke-width="2"/><path d="M240,70 l-9,-5 v10 Z" fill="#17292d"/><rect x="240" y="50" width="60" height="40" rx="4" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><rect x="300" y="50" width="34" height="40" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="270" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">20</text><circle cx="317" cy="70" r="4" fill="#17292d"/><polyline points="317,70 380,70" fill="none" stroke="#17292d" stroke-width="2"/><path d="M380,70 l-9,-5 v10 Z" fill="#17292d"/><rect x="380" y="50" width="60" height="40" rx="4" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><rect x="440" y="50" width="34" height="40" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="410" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">30</text><circle cx="457" cy="70" r="4" fill="#17292d"/><polyline points="457,70 520,70" fill="none" stroke="#17292d" stroke-width="2"/><path d="M520,70 l-9,-5 v10 Z" fill="#17292d"/><rect x="520" y="50" width="60" height="40" rx="4" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><rect x="580" y="50" width="34" height="40" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="550" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">40</text><circle cx="597" cy="70" r="4" fill="#17292d"/><polyline points="597,70 640,70 640,130 80,130 80,84 100,84" fill="none" stroke="#17292d" stroke-width="2"/><path d="M100,84 l-9,-5 v10 Z" fill="#17292d"/><text x="360" y="144" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">the last node points back to the first node</text><text x="350" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Circular (singly) linked list: there is no NULL at the end</text>
</svg>
