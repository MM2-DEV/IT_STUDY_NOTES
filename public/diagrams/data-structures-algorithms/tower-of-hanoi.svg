<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" role="img" aria-label="Tower of Hanoi">
<title>Tower of Hanoi</title>
<rect width="660" height="300" fill="#ffffff"/>
<rect x="40" y="230" width="580" height="14" rx="4" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><rect x="125" y="70" width="10" height="160" rx="3" fill="#9aa9ab" stroke="#7a8a8d" stroke-width="2"/><text x="130" y="264" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A (source)</text><rect x="325" y="70" width="10" height="160" rx="3" fill="#9aa9ab" stroke="#7a8a8d" stroke-width="2"/><text x="330" y="264" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B (auxiliary)</text><rect x="525" y="70" width="10" height="160" rx="3" fill="#9aa9ab" stroke="#7a8a8d" stroke-width="2"/><text x="530" y="264" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C (destination)</text><rect x="55" y="200" width="150" height="26" rx="8" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="130" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">disc 3</text><rect x="75" y="170" width="110" height="26" rx="8" fill="#83749e" stroke="#17292d" stroke-width="2"/><text x="130" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">disc 2</text><rect x="95" y="140" width="70" height="26" rx="8" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="130" y="153" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">disc 1</text><text x="330" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Tower of Hanoi with 3 discs: move all discs from A to C using B</text>
</svg>
