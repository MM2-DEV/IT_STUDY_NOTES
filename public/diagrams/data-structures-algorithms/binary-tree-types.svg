<svg xmlns="http://www.w3.org/2000/svg" width="820" height="255" viewBox="0 0 820 255" role="img" aria-label="Types of binary tree">
<title>Types of binary tree</title>
<rect width="820" height="255" fill="#ffffff"/>
<text x="110" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Full</text><line x1="110" y1="55" x2="65" y2="120" stroke="#17292d" stroke-width="2"/><line x1="110" y1="55" x2="155" y2="120" stroke="#17292d" stroke-width="2"/><line x1="65" y1="120" x2="42.5" y2="185" stroke="#17292d" stroke-width="2"/><line x1="65" y1="120" x2="87.5" y2="185" stroke="#17292d" stroke-width="2"/><circle cx="110" cy="55" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="110" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="65" cy="120" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="65" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="155" cy="120" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="155" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3</text><circle cx="42.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="42.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4</text><circle cx="87.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="87.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5</text><text x="310" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Complete</text><line x1="310" y1="55" x2="265" y2="120" stroke="#17292d" stroke-width="2"/><line x1="310" y1="55" x2="355" y2="120" stroke="#17292d" stroke-width="2"/><line x1="265" y1="120" x2="242.5" y2="185" stroke="#17292d" stroke-width="2"/><line x1="265" y1="120" x2="287.5" y2="185" stroke="#17292d" stroke-width="2"/><line x1="355" y1="120" x2="332.5" y2="185" stroke="#17292d" stroke-width="2"/><circle cx="310" cy="55" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="310" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="265" cy="120" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="265" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="355" cy="120" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="355" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3</text><circle cx="242.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="242.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4</text><circle cx="287.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="287.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5</text><circle cx="332.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="332.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">6</text><text x="510" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Perfect</text><line x1="510" y1="55" x2="465" y2="120" stroke="#17292d" stroke-width="2"/><line x1="510" y1="55" x2="555" y2="120" stroke="#17292d" stroke-width="2"/><line x1="465" y1="120" x2="442.5" y2="185" stroke="#17292d" stroke-width="2"/><line x1="465" y1="120" x2="487.5" y2="185" stroke="#17292d" stroke-width="2"/><line x1="555" y1="120" x2="532.5" y2="185" stroke="#17292d" stroke-width="2"/><line x1="555" y1="120" x2="577.5" y2="185" stroke="#17292d" stroke-width="2"/><circle cx="510" cy="55" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="510" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="465" cy="120" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="465" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="555" cy="120" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="555" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3</text><circle cx="442.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="442.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4</text><circle cx="487.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="487.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5</text><circle cx="532.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="532.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">6</text><circle cx="577.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="577.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">7</text><text x="710" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Right-skewed</text><line x1="710" y1="55" x2="755" y2="120" stroke="#17292d" stroke-width="2"/><line x1="755" y1="120" x2="777.5" y2="185" stroke="#17292d" stroke-width="2"/><circle cx="710" cy="55" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="710" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="755" cy="120" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="755" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="777.5" cy="185" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="777.5" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3</text><text x="110" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">every node has 0 or 2 children</text><text x="110" y="238" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle"></text><text x="310" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">all levels full except the last,</text><text x="310" y="238" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">which is filled from the left</text><text x="510" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">all internal nodes have 2 children</text><text x="510" y="238" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">and all leaves on the same level</text><text x="710" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">each node has at most one child</text><text x="710" y="238" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">(behaves like a linked list)</text>
</svg>
