a, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">20</text><rect x="554" y="140" width="32" height="30" rx="0" fill="#fdfbe6" stroke="#17292d" stroke-width="2"/><text x="570" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">25</text><rect x="586" y="140" width="32" height="30" rx="0" fill="#fdfbe6" stroke="#17292d" stroke-width="2"/><text x="602" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">30</text><rect x="318" y="30" width="32" height="30" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="334" y="45" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">10</text><rect x="350" y="30" width="32" height="30" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="366" y="45" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">20</text><text x="470" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">index (internal) node: keys only</text><text x="350" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">leaf nodes hold all the keys (with data pointers) and are linked in order</text><text x="350" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">B+ tree: searching for 15 follows 10 ≤ 15 &lt; 20 to the middle leaf</text>
