<svg xmlns="http://www.w3.org/2000/svg" width="660" height="390" viewBox="0 0 660 390" role="img" aria-label="Tree terminology">
<title>Tree terminology</title>
<rect width="660" height="390" fill="#ffffff"/>
<line x1="330" y1="50" x2="170" y2="130" stroke="#17292d" stroke-width="2"/><line x1="330" y1="50" x2="330" y2="130" stroke="#17292d" stroke-width="2"/><line x1="330" y1="50" x2="490" y2="130" stroke="#17292d" stroke-width="2"/><line x1="170" y1="130" x2="100" y2="210" stroke="#17292d" stroke-width="2"/><line x1="170" y1="130" x2="240" y2="210" stroke="#17292d" stroke-width="2"/><line x1="490" y1="130" x2="490" y2="210" stroke="#17292d" stroke-width="2"/><line x1="240" y1="210" x2="190" y2="290" stroke="#17292d" stroke-width="2"/><line x1="240" y1="210" x2="290" y2="290" stroke="#17292d" stroke-width="2"/><circle cx="330" cy="50" r="18" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="330" y="51" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="170" cy="130" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="170" y="131" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><circle cx="330" cy="130" r="18" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="330" y="131" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><circle cx="490" cy="130" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="490" y="131" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">D</text><circle cx="100" cy="210" r="18" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="100" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">E</text><circle cx="240" cy="210" r="18" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="240" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">F</text><circle cx="490" cy="210" r="18" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="490" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">G</text><circle cx="190" cy="290" r="18" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="190" y="291" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">H</text><circle cx="290" cy="290" r="18" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="290" y="291" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">I</text><text x="640" y="50" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Level 0</text><text x="640" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Level 1</text><text x="640" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Level 2</text><text x="640" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Level 3</text><text x="390" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">root</text><rect x="30" y="330" width="14" height="14" rx="7" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="52" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">root</text><rect x="110" y="330" width="14" height="14" rx="7" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="132" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">leaf (no children): C, E, G, H, I</text><rect x="380" y="330" width="14" height="14" rx="7" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="402" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">internal node: A, B, D, F</text><text x="330" y="375" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Height of the tree = 3 (edges on the longest root-to-leaf path A-B-F-H); degree of A = 3</text>
</svg>
