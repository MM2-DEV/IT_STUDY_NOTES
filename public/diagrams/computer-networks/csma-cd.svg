<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="CSMA/CD">
<title>CSMA/CD</title>
<rect width="720" height="450" fill="#ffffff"/>
<rect x="250" y="10" width="220" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="360" y="28" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Station has a frame to send</text><rect x="250" y="70" width="220" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="360" y="84" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sense the medium:</text><text x="360" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">is it idle?</text><rect x="520" y="70" width="170" height="44" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="605" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Wait until idle</text><rect x="250" y="140" width="220" height="44" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Transmit the frame and</text><text x="360" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">listen (detect collision)</text><rect x="250" y="210" width="220" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="360" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Collision detected</text><text x="360" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">during transmission?</text><rect x="250" y="285" width="220" height="36" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="360" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Success</text><rect x="520" y="210" width="170" height="44" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="605" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Stop and send</text><text x="605" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">a jam signal</text><rect x="520" y="285" width="170" height="56" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="605" y="297" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Attempts n = n + 1;</text><text x="605" y="313" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">wait K × slot time,</text><text x="605" y="329" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">K random in 0 … 2ⁿ − 1</text><rect x="520" y="375" width="170" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="605" y="395" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">n > 15: abort</text><path d="M360,46 L360,68" fill="none" stroke="#17292d" stroke-width="2"/><path d="M360,68 L355.7,59.0 L364.3,59.0 Z" fill="#17292d"/><path d="M470,92 L518,92" fill="none" stroke="#17292d" stroke-width="2"/><path d="M518,92 L509.0,96.3 L509.0,87.7 Z" fill="#17292d"/><text x="494" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">busy</text><line x1="605" y1="70" x2="605" y2="58" stroke="#17292d" stroke-width="2"/><line x1="605" y1="58" x2="360" y2="58" stroke="#17292d" stroke-width="2"/><path d="M360,58 L360,68" fill="none" stroke="#17292d" stroke-width="2"/><path d="M360,68 L355.7,59.0 L364.3,59.0 Z" fill="#17292d"/><path d="M360,114 L360,138" fill="none" stroke="#17292d" stroke-width="2"/><path d="M360,138 L355.7,129.0 L364.3,129.0 Z" fill="#17292d"/><text x="378" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">idle</text><path d="M360,184 L360,208" fill="none" stroke="#17292d" stroke-width="2"/><path d="M360,208 L355.7,199.0 L364.3,199.0 Z" fill="#17292d"/><path d="M360,254 L360,283" fill="none" stroke="#17292d" stroke-width="2"/><path d="M360,283 L355.7,274.0 L364.3,274.0 Z" fill="#17292d"/><text x="374" y="268.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">no</text><path d="M470,232 L518,232" fill="none" stroke="#17292d" stroke-width="2"/><path d="M518,232 L509.0,236.3 L509.0,227.7 Z" fill="#17292d"/><text x="494" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">yes</text><path d="M605,254 L605,283" fill="none" stroke="#17292d" stroke-width="2"/><path d="M605,283 L600.7,274.0 L609.3,274.0 Z" fill="#17292d"/><line x1="690" y1="313" x2="705" y2="313" stroke="#17292d" stroke-width="2"/><line x1="705" y1="313" x2="705" y2="92" stroke="#17292d" stroke-width="2"/><path d="M705,92 L692,92" fill="none" stroke="#17292d" stroke-width="2"/><path d="M692,92 L701.0,87.7 L701.0,96.3 Z" fill="#17292d"/><path d="M605,341 L605,373" fill="none" stroke="#17292d" stroke-width="2"/><path d="M605,373 L600.7,364.0 L609.3,364.0 Z" fill="#17292d"/><text x="543" y="357" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">too many attempts</text><text x="360" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">CSMA/CD: carrier sense, transmission with collision detection, jam signal and binary exponential backoff</text>
</svg>
