<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="IPv4 header">
<title>IPv4 header</title>
<rect width="720" height="330" fill="#ffffff"/>
<text x="360" y="16" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">32 bits</text><line x1="110" y1="24" x2="610" y2="24" stroke="#4b6166" stroke-width="1"/><rect x="110" y="30" width="62.5" height="38" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="141.25" y="41.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Version</text><text x="141.25" y="56.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(4)</text><rect x="172.5" y="30" width="62.5" height="38" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="203.75" y="41.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">HLEN</text><text x="203.75" y="56.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(4)</text><rect x="235" y="30" width="125" height="38" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="297.5" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Type of service (8)</text><rect x="360" y="30" width="250" height="38" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="485" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Total length (16)</text><rect x="110" y="68" width="250" height="38" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="235" y="87" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Identification (16)</text><rect x="360" y="68" width="46.875" height="38" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="383.4375" y="79.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Flags</text><text x="383.4375" y="94.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(3)</text><rect x="406.875" y="68" width="203.125" height="38" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="508.4375" y="87" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Fragment offset (13)</text><rect x="110" y="106" width="125" height="38" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="172.5" y="125" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Time to live (8)</text><rect x="235" y="106" width="125" height="38" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="297.5" y="125" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Protocol (8)</text><rect x="360" y="106" width="250" height="38" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="485" y="125" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Header checksum (16)</text><rect x="110" y="144" width="500" height="38" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="360" y="163" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Source IP address (32)</text><rect x="110" y="182" width="500" height="38" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="360" y="201" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Destination IP address (32)</text><rect x="110" y="220" width="500" height="38" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="360" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Options (0–40 bytes) and padding</text><rect x="110" y="258" width="500" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="360" y="277" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data</text><text x="625" y="125" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">20-byte</text><text x="625" y="141" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">fixed part</text><text x="360" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">IPv4 datagram header (20 to 60 bytes)</text>
</svg>
