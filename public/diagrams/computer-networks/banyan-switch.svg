"#9aaeb0" stroke-width="1.2"/><line x1="330" y1="166" x2="440" y2="166" stroke="#9aaeb0" stroke-width="1.2"/><line x1="330" y1="208" x2="440" y2="208" stroke="#9aaeb0" stroke-width="1.2"/><line x1="330" y1="250" x2="440" y2="292" stroke="#9aaeb0" stroke-width="1.2"/><line x1="330" y1="292" x2="440" y2="250" stroke="#9aaeb0" stroke-width="1.2"/><line x1="330" y1="334" x2="440" y2="334" stroke="#9aaeb0" stroke-width="1.2"/><text x="145" y="18" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Stage 1 (1st bit)</text><text x="305" y="18" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Stage 2 (2nd bit)</text><text x="465" y="18" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Stage 3 (3rd bit)</text><text x="545" y="18" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">output</text><text x="330" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Each 2×2 microswitch sends a cell up for bit 0 and down for bit 1 of the output port number.</text><text x="330" y="406" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">8 inputs need log₂ 8 = 3 stages of 4 microswitches = 12 microswitches (a crossbar needs 64 crosspoints).</text><text x="330" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">An 8 × 8 banyan switch: three stages of 2 × 2 microswitches</text>
