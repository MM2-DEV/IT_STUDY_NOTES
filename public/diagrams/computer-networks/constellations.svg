<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="Constellation diagrams">
<title>Constellation diagrams</title>
<rect width="720" height="310" fill="#ffffff"/>
<text x="120" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">BPSK (1 bit/symbol)</text><line x1="25" y1="145" x2="215" y2="145" stroke="#4b6166" stroke-width="1"/><line x1="120" y1="50" x2="120" y2="240" stroke="#4b6166" stroke-width="1"/><circle cx="60" cy="145" r="6" fill="#08595a"/><text x="60" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><circle cx="180" cy="145" r="6" fill="#08595a"/><text x="180" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><text x="360" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">QPSK (2 bits/symbol)</text><line x1="265" y1="145" x2="455" y2="145" stroke="#4b6166" stroke-width="1"/><line x1="360" y1="50" x2="360" y2="240" stroke="#4b6166" stroke-width="1"/><circle cx="410" cy="95" r="6" fill="#08595a"/><text x="410" y="80" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">00</text><circle cx="310" cy="95" r="6" fill="#08595a"/><text x="310" y="80" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">01</text><circle cx="310" cy="195" r="6" fill="#08595a"/><text x="310" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">11</text><circle cx="410" cy="195" r="6" fill="#08595a"/><text x="410" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">10</text><text x="600" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">16-QAM (4 bits/symbol)</text><line x1="505" y1="145" x2="695" y2="145" stroke="#4b6166" stroke-width="1"/><line x1="600" y1="50" x2="600" y2="240" stroke="#4b6166" stroke-width="1"/><circle cx="525" cy="220" r="6" fill="#08595a"/><circle cx="525" cy="170" r="6" fill="#08595a"/><circle cx="525" cy="120" r="6" fill="#08595a"/><circle cx="525" cy="70" r="6" fill="#08595a"/><circle cx="575" cy="220" r="6" fill="#08595a"/><circle cx="575" cy="170" r="6" fill="#08595a"/><circle cx="575" cy="120" r="6" fill="#08595a"/><circle cx="575" cy="70" r="6" fill="#08595a"/><circle cx="625" cy="220" r="6" fill="#08595a"/><circle cx="625" cy="170" r="6" fill="#08595a"/><circle cx="625" cy="120" r="6" fill="#08595a"/><circle cx="625" cy="70" r="6" fill="#08595a"/><circle cx="675" cy="220" r="6" fill="#08595a"/><circle cx="675" cy="170" r="6" fill="#08595a"/><circle cx="675" cy="120" r="6" fill="#08595a"/><circle cx="675" cy="70" r="6" fill="#08595a"/><text x="360" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Each dot is one signal element: its distance from the centre is the amplitude and its angle is the phase</text><text x="360" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Constellation diagrams of BPSK, QPSK and 16-QAM</text>
</svg>
