<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="Synchronous and statistical TDM">
<title>Synchronous and statistical TDM</title>
<rect width="720" height="280" fill="#ffffff"/>
<text x="360" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Sources A, B, C, D; a filled cell means the source has data in that round</text><text x="20" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Synchronous TDM (one slot per source in every frame; empty slots are wasted)</text><rect x="20" y="64" width="40" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="40" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A1</text><rect x="60" y="64" width="40" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="4 3"/><text x="80" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><rect x="100" y="64" width="40" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="120" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C1</text><rect x="140" y="64" width="40" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="4 3"/><text x="160" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="100" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">frame 1</text><rect x="194" y="64" width="40" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="214" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A2</text><rect x="234" y="64" width="40" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="254" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B2</text><rect x="274" y="64" width="40" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="4 3"/><text x="294" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><rect x="314" y="64" width="40" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="4 3"/><text x="334" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="274" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">frame 2</text><rect x="368" y="64" width="40" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="4 3"/><text x="388" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><rect x="408" y="64" width="40" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="4 3"/><text x="428" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><rect x="448" y="64" width="40" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="468" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C3</text><rect x="488" y="64" width="40" height="34" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="508" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">D3</text><text x="448" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">frame 3</text><text x="20" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Statistical (asynchronous) TDM (slots only for sources with data; each slot carries an address)</text><rect x="20" y="162" width="22" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="31" y="179" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><rect x="42" y="162" width="36" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A1</text><rect x="78" y="162" width="22" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="89" y="179" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><rect x="100" y="162" width="36" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="118" y="179" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C1</text><rect x="136" y="162" width="22" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="147" y="179" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><rect x="158" y="162" width="36" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="176" y="179" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A2</text><text x="107" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">frame 1</text><rect x="208" y="162" width="22" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="219" y="179" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><rect x="230" y="162" width="36" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="248" y="179" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B2</text><rect x="266" y="162" width="22" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="277" y="179" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><rect x="288" y="162" width="36" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="306" y="179" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C3</text><rect x="324" y="162" width="22" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="335" y="179" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">D</text><rect x="346" y="162" width="36" height="34" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="364" y="179" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">D3</text><text x="295" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">frame 2</text><text x="360" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Small white box = address of the source</text><text x="360" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Synchronous TDM sends empty slots; statistical TDM fills slots only with data that is ready</text>
</svg>
