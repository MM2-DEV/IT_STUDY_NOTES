<svg xmlns="http://www.w3.org/2000/svg" width="760" height="475" viewBox="0 0 760 475" role="img" aria-label="Autonomous systems">
<title>Autonomous systems</title>
<rect width="760" height="475" fill="#ffffff"/>
<ellipse cx="200" cy="140" rx="140" ry="95" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><text x="200" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">AS 1</text><text x="140" y="212" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">intra-AS: OSPF or RIP</text><ellipse cx="565" cy="140" rx="140" ry="95" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><text x="565" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">AS 2</text><text x="565" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">intra-AS: OSPF</text><ellipse cx="385" cy="340" rx="125" ry="75" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><text x="470" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">AS 3</text><text x="385" y="400" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">intra-AS: RIP</text><line x1="150" y1="110" x2="205" y2="175" stroke="#4b6166" stroke-width="2"/><line x1="150" y1="110" x2="250" y2="110" stroke="#4b6166" stroke-width="2"/><line x1="205" y1="175" x2="250" y2="110" stroke="#4b6166" stroke-width="2"/><line x1="520" y1="110" x2="610" y2="110" stroke="#4b6166" stroke-width="2"/><line x1="520" y1="110" x2="565" y2="175" stroke="#4b6166" stroke-width="2"/><line x1="610" y1="110" x2="565" y2="175" stroke="#4b6166" stroke-width="2"/><line x1="380" y1="300" x2="340" y2="360" stroke="#4b6166" stroke-width="2"/><line x1="380" y1="300" x2="430" y2="360" stroke="#4b6166" stroke-width="2"/><line x1="340" y1="360" x2="430" y2="360" stroke="#4b6166" stroke-width="2"/><line x1="250" y1="110" x2="520" y2="110" stroke="#c0392b" stroke-width="3"/><text x="385" y="98" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">eBGP</text><line x1="205" y1="175" x2="380" y2="300" stroke="#c0392b" stroke-width="3"/><text x="272" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">eBGP</text><circle cx="150" cy="110" r="17" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="150" y="111" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1a</text><circle cx="205" cy="175" r="17" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="205" y="176" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1b</text><circle cx="250" cy="110" r="17" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="250" y="111" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1c</text><circle cx="520" cy="110" r="17" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="520" y="111" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2a</text><circle cx="610" cy="110" r="17" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="610" y="111" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2b</text><circle cx="565" cy="175" r="17" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="565" y="176" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2c</text><circle cx="380" cy="300" r="17" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="380" y="301" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3a</text><circle cx="340" cy="360" r="17" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="340" y="361" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3b</text><circle cx="430" cy="360" r="17" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="430" y="361" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3c</text><text x="380" y="438" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Yellow = gateway routers. Intra-AS protocols route inside each AS; BGP routes between ASes (iBGP spreads routes inside an AS).</text><text x="380" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Hierarchical routing: autonomous systems, intra-AS routing and inter-AS routing (BGP)</text>
</svg>
