<svg xmlns="http://www.w3.org/2000/svg" width="720" height="255" viewBox="0 0 720 255" role="img" aria-label="FTP connections">
<title>FTP connections</title>
<rect width="720" height="255" fill="#ffffff"/>
<rect x="20" y="40" width="190" height="150" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="115" y="115" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="115" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">FTP client</text><rect x="510" y="40" width="190" height="150" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="605" y="115" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="605" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">FTP server</text><rect x="40" y="75" width="150" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="115" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Control process</text><rect x="40" y="135" width="150" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="115" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data transfer process</text><rect x="530" y="75" width="150" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="605" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Control process</text><rect x="530" y="135" width="150" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="605" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data transfer process</text><line x1="190" y1="95" x2="530" y2="95" stroke="#08595a" stroke-width="3"/><text x="360" y="84" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Control connection (port 21)</text><line x1="190" y1="155" x2="530" y2="155" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 4"/><text x="360" y="144" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">Data connection (port 20)</text><text x="360" y="212" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Control: commands and replies, open for the whole session.  Data: opened for each file, then closed.</text><text x="360" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">FTP uses two TCP connections: control (out-of-band) and data</text>
</svg>
