<svg xmlns="http://www.w3.org/2000/svg" width="720" height="295" viewBox="0 0 720 295" role="img" aria-label="IP address classes">
<title>IP address classes</title>
<rect width="720" height="295" fill="#ffffff"/>
<text x="120" y="18" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">0</text><text x="250" y="18" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">8</text><text x="380" y="18" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">16</text><text x="510" y="18" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">24</text><text x="640" y="18" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">32</text><text x="106" y="46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">Class A</text><rect x="120" y="28" width="16.25" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="128.125" y="46" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><rect x="136.25" y="28" width="113.75" height="36" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="193.125" y="46" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Network (7 bits)</text><rect x="250" y="28" width="390" height="36" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="445" y="46" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host (24 bits)</text><text x="106" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">Class B</text><rect x="120" y="72" width="32.5" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="136.25" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">10</text><rect x="152.5" y="72" width="227.5" height="36" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="266.25" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Network (14 bits)</text><rect x="380" y="72" width="260" height="36" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="510" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host (16 bits)</text><text x="106" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">Class C</text><rect x="120" y="116" width="48.75" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="144.375" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">110</text><rect x="168.75" y="116" width="341.25" height="36" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="339.375" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Network (21 bits)</text><rect x="510" y="116" width="130" height="36" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="575" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host (8)</text><text x="106" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">Class D</text><rect x="120" y="160" width="65" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="152.5" y="178" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1110</text><rect x="185" y="160" width="455" height="36" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="412.5" y="178" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Multicast address (28 bits)</text><text x="106" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">Class E</text><rect x="120" y="204" width="65" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="152.5" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1111</text><rect x="185" y="204" width="455" height="36" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="412.5" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Reserved for future use (28 bits)</text><text x="380" y="260" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The leading bits identify the class; in classes A, B and C the network part ends on a byte boundary (8, 16 or 24 bits)</text><text x="360" y="284" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Classful IPv4 addresses: leading bits, network part and host part</text>
</svg>
