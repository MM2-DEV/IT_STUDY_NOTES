<svg xmlns="http://www.w3.org/2000/svg" width="790" height="355" viewBox="0 0 790 355" role="img" aria-label="Hidden terminal">
<title>Hidden terminal</title>
<rect width="790" height="355" fill="#ffffff"/>
<circle cx="160" cy="145" r="132" fill="#69c6ca" fill-opacity="0.25" stroke="#08595a" stroke-dasharray="5 4"/><circle cx="400" cy="145" r="132" fill="#cbadd1" fill-opacity="0.3" stroke="#08595a" stroke-dasharray="5 4"/><circle cx="160" cy="145" r="20" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="160" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="280" cy="145" r="20" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="280" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><circle cx="400" cy="145" r="20" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="400" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><text x="100" y="220" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">range of A</text><text x="460" y="220" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">range of C</text><text x="280" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">B is in the range of both A and C, but A and C cannot hear each other:</text><text x="280" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">their frames collide at B (hidden terminals)</text><text x="560" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><text x="680" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><line x1="560" y1="30" x2="560" y2="290" stroke="#17292d" stroke-width="3"/><line x1="680" y1="30" x2="680" y2="290" stroke="#17292d" stroke-width="3"/><path d="M560,45 L680,70" fill="none" stroke="#08595a" stroke-width="2"/><path d="M680,70 L670.3,72.4 L672.1,63.9 Z" fill="#08595a"/><text x="620" y="48.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">RTS</text><path d="M680,85 L560,110" fill="none" stroke="#17292d" stroke-width="2"/><path d="M560,110 L567.9,103.9 L569.7,112.4 Z" fill="#17292d"/><text x="620" y="88.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">CTS</text><path d="M560,130 L680,190" fill="none" stroke="#08595a" stroke-width="2"/><path d="M680,190 L670.0,189.9 L673.9,182.1 Z" fill="#08595a"/><text x="620" y="151" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">DATA</text><path d="M680,205 L560,230" fill="none" stroke="#17292d" stroke-width="2"/><path d="M560,230 L567.9,223.9 L569.7,232.4 Z" fill="#17292d"/><text x="620" y="208.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ACK</text><text x="688" y="95" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="start" dominant-baseline="middle">C also hears</text><text x="688" y="109" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="start" dominant-baseline="middle">the CTS and</text><text x="688" y="123" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="start" dominant-baseline="middle">stays silent</text><text x="395" y="343" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The hidden-terminal problem and its solution with RTS/CTS</text>
</svg>
