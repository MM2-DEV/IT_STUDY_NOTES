<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="IPv6 header">
<title>IPv6 header</title>
<rect width="720" height="330" fill="#ffffff"/>
<text x="360" y="16" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">32 bits</text><line x1="110" y1="24" x2="610" y2="24" stroke="#4b6166" stroke-width="1"/><rect x="110" y="30" width="62.5" height="38" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="141.25" y="41.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Version</text><text x="141.25" y="56.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(4)</text><rect x="172.5" y="30" width="125" height="38" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="235" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Traffic class (8)</text><rect x="297.5" y="30" width="312.5" height="38" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="453.75" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Flow label (20)</text><rect x="110" y="68" width="250" height="38" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="235" y="87" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Payload length (16)</text><rect x="360" y="68" width="125" height="38" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="422.5" y="87" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Next header (8)</text><rect x="485" y="68" width="125" height="38" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="547.5" y="87" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hop limit (8)</text><rect x="110" y="106" width="500" height="70" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="360" y="141" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Source address (128 bits)</text><rect x="110" y="176" width="500" height="70" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="360" y="211" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Destination address (128 bits)</text><rect x="110" y="246" width="500" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="360" y="265" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Payload (extension headers and data)</text><text x="625" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">40-byte</text><text x="625" y="156" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">fixed header</text><text x="360" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">IPv6 base header (fixed 40 bytes)</text>
</svg>
