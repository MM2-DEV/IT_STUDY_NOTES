<svg xmlns="http://www.w3.org/2000/svg" width="730" height="300" viewBox="0 0 730 300" role="img" aria-label="Circuit and packet switching">
<title>Circuit and packet switching</title>
<rect width="730" height="300" fill="#ffffff"/>
<text x="175" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Circuit switching</text><line x1="30" y1="135" x2="120" y2="80" stroke="#c9d6d6" stroke-width="2"/><line x1="30" y1="135" x2="120" y2="190" stroke="#c9d6d6" stroke-width="2"/><line x1="120" y1="80" x2="230" y2="80" stroke="#c9d6d6" stroke-width="2"/><line x1="120" y1="190" x2="230" y2="190" stroke="#c9d6d6" stroke-width="2"/><line x1="120" y1="80" x2="230" y2="190" stroke="#c9d6d6" stroke-width="2"/><line x1="230" y1="80" x2="320" y2="135" stroke="#c9d6d6" stroke-width="2"/><line x1="230" y1="190" x2="320" y2="135" stroke="#c9d6d6" stroke-width="2"/><line x1="120" y1="190" x2="230" y2="80" stroke="#c9d6d6" stroke-width="2"/><line x1="30" y1="135" x2="120" y2="80" stroke="#c0392b" stroke-width="6"/><line x1="120" y1="80" x2="230" y2="80" stroke="#c0392b" stroke-width="6"/><line x1="230" y1="80" x2="320" y2="135" stroke="#c0392b" stroke-width="6"/><rect x="10" y="119" width="40" height="32" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="30" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="120" cy="80" r="19" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="120" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S1</text><circle cx="120" cy="190" r="19" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="120" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S2</text><circle cx="230" cy="80" r="19" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="230" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S3</text><circle cx="230" cy="190" r="19" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="230" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S4</text><rect x="300" y="119" width="40" height="32" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="320" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><text x="175" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">one dedicated path (red) is reserved</text><text x="175" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">for the whole call; all data follows it</text><line x1="360" y1="30" x2="360" y2="260" stroke="#dde6e6" stroke-width="1"/><text x="545" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Packet switching (datagram)</text><line x1="400" y1="135" x2="490" y2="80" stroke="#c9d6d6" stroke-width="2"/><line x1="400" y1="135" x2="490" y2="190" stroke="#c9d6d6" stroke-width="2"/><line x1="490" y1="80" x2="600" y2="80" stroke="#c9d6d6" stroke-width="2"/><line x1="490" y1="190" x2="600" y2="190" stroke="#c9d6d6" stroke-width="2"/><line x1="490" y1="80" x2="600" y2="190" stroke="#c9d6d6" stroke-width="2"/><line x1="600" y1="80" x2="690" y2="135" stroke="#c9d6d6" stroke-width="2"/><line x1="600" y1="190" x2="690" y2="135" stroke="#c9d6d6" stroke-width="2"/><line x1="490" y1="190" x2="600" y2="80" stroke="#c9d6d6" stroke-width="2"/><line x1="400" y1="135" x2="490" y2="80" stroke="#c0392b" stroke-width="4"/><line x1="490" y1="80" x2="600" y2="80" stroke="#c0392b" stroke-width="4"/><line x1="600" y1="80" x2="690" y2="135" stroke="#c0392b" stroke-width="4"/><line x1="400" y1="135" x2="490" y2="190" stroke="#2471a3" stroke-width="4"/><line x1="490" y1="190" x2="600" y2="190" stroke="#2471a3" stroke-width="4"/><line x1="600" y1="190" x2="690" y2="135" stroke="#2471a3" stroke-width="4"/><line x1="400" y1="135" x2="490" y2="80" stroke="#d68910" stroke-width="4"/><line x1="490" y1="80" x2="600" y2="190" stroke="#d68910" stroke-width="4"/><line x1="600" y1="190" x2="690" y2="135" stroke="#d68910" stroke-width="4"/><rect x="380" y="119" width="40" height="32" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="400" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="490" cy="80" r="19" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="490" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S1</text><circle cx="490" cy="190" r="19" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="490" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S2</text><circle cx="600" cy="80" r="19" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="600" y="81" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S3</text><circle cx="600" cy="190" r="19" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="600" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S4</text><rect x="670" y="119" width="40" height="32" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="690" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><text x="545" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">packets 1, 2, 3 (three colours) are</text><text x="545" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">routed separately and share the links</text><text x="365" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Circuit switching reserves a path; in packet switching each packet is forwarded on its own</text>
</svg>
