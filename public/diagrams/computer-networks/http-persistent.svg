<svg xmlns="http://www.w3.org/2000/svg" width="730" height="460" viewBox="0 0 730 460" role="img" aria-label="HTTP connections">
<title>HTTP connections</title>
<rect width="730" height="460" fill="#ffffff"/>
<text x="185" y="18" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Non-persistent HTTP</text><text x="60" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><text x="310" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Server</text><line x1="60" y1="52" x2="60" y2="400" stroke="#17292d" stroke-width="3"/><line x1="310" y1="52" x2="310" y2="400" stroke="#17292d" stroke-width="3"/><path d="M60,60 L310,90" fill="none" stroke="#08595a" stroke-width="2"/><path d="M310,90 L300.5,93.2 L301.6,84.6 Z" fill="#08595a"/><text x="185" y="66" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">TCP SYN</text><path d="M310,94 L60,124" fill="none" stroke="#17292d" stroke-width="2"/><path d="M60,124 L68.4,118.6 L69.5,127.2 Z" fill="#17292d"/><text x="185" y="100" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SYN+ACK</text><text x="52" y="94" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="end" dominant-baseline="middle">RTT 1</text><path d="M60,132 L310,162" fill="none" stroke="#08595a" stroke-width="2"/><path d="M310,162 L300.5,165.2 L301.6,156.6 Z" fill="#08595a"/><text x="185" y="138" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">ACK + GET page</text><path d="M310,166 L60,196" fill="none" stroke="#17292d" stroke-width="2"/><path d="M60,196 L68.4,190.6 L69.5,199.2 Z" fill="#17292d"/><text x="185" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">page</text><text x="52" y="166" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="end" dominant-baseline="middle">RTT 2</text><path d="M60,204 L310,234" fill="none" stroke="#08595a" stroke-width="2"/><path d="M310,234 L300.5,237.2 L301.6,228.6 Z" fill="#08595a"/><text x="185" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">TCP SYN (new)</text><path d="M310,238 L60,268" fill="none" stroke="#17292d" stroke-width="2"/><path d="M60,268 L68.4,262.6 L69.5,271.2 Z" fill="#17292d"/><text x="185" y="244" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SYN+ACK</text><text x="52" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="end" dominant-baseline="middle">RTT 3</text><path d="M60,276 L310,306" fill="none" stroke="#08595a" stroke-width="2"/><path d="M310,306 L300.5,309.2 L301.6,300.6 Z" fill="#08595a"/><text x="185" y="282" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">ACK + GET image</text><path d="M310,310 L60,340" fill="none" stroke="#17292d" stroke-width="2"/><path d="M60,340 L68.4,334.6 L69.5,343.2 Z" fill="#17292d"/><text x="185" y="316" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">image</text><text x="52" y="310" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="end" dominant-baseline="middle">RTT 4</text><text x="185" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">a new TCP connection for every object: 2 RTT each</text><text x="545" y="18" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Persistent HTTP (with pipelining)</text><text x="420" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><text x="670" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Server</text><line x1="420" y1="52" x2="420" y2="400" stroke="#17292d" stroke-width="3"/><line x1="670" y1="52" x2="670" y2="400" stroke="#17292d" stroke-width="3"/><path d="M420,60 L670,90" fill="none" stroke="#08595a" stroke-width="2"/><path d="M670,90 L660.5,93.2 L661.6,84.6 Z" fill="#08595a"/><text x="545" y="66" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">TCP SYN</text><path d="M670,94 L420,124" fill="none" stroke="#17292d" stroke-width="2"/><path d="M420,124 L428.4,118.6 L429.5,127.2 Z" fill="#17292d"/><text x="545" y="100" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SYN+ACK</text><text x="412" y="94" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="end" dominant-baseline="middle">RTT 1</text><path d="M420,132 L670,162" fill="none" stroke="#08595a" stroke-width="2"/><path d="M670,162 L660.5,165.2 L661.6,156.6 Z" fill="#08595a"/><text x="545" y="138" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">ACK + GET page</text><path d="M670,166 L420,196" fill="none" stroke="#17292d" stroke-width="2"/><path d="M420,196 L428.4,190.6 L429.5,199.2 Z" fill="#17292d"/><text x="545" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">page</text><text x="412" y="166" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="end" dominant-baseline="middle">RTT 2</text><path d="M420,204 L670,234" fill="none" stroke="#08595a" stroke-width="2"/><path d="M670,234 L660.5,237.2 L661.6,228.6 Z" fill="#08595a"/><text x="545" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">GET img1, img2, img3</text><path d="M670,238 L420,268" fill="none" stroke="#17292d" stroke-width="2"/><path d="M420,268 L428.4,262.6 L429.5,271.2 Z" fill="#17292d"/><text x="545" y="244" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">img1, img2, img3</text><text x="412" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="end" dominant-baseline="middle">RTT 3</text><text x="545" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">one connection; all images in about 1 more RTT</text><text x="365" y="448" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Non-persistent and persistent HTTP connections (transmission times ignored)</text>
</svg>
