<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Router architecture">
<title>Router architecture</title>
<rect width="720" height="330" fill="#ffffff"/>
<rect x="20" y="40" width="190" height="46" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="115" y="55.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Input port 1</text><text x="115" y="70.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(link layer, lookup, queue)</text><rect x="510" y="40" width="190" height="46" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="605" y="55.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Output port 1</text><text x="605" y="70.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(queue, link layer)</text><path d="M210,63 L268,63" fill="none" stroke="#17292d" stroke-width="2"/><path d="M268,63 L259.0,67.3 L259.0,58.7 Z" fill="#17292d"/><path d="M452,63 L508,63" fill="none" stroke="#17292d" stroke-width="2"/><path d="M508,63 L499.0,67.3 L499.0,58.7 Z" fill="#17292d"/><rect x="20" y="110" width="190" height="46" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="115" y="125.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Input port 2</text><text x="115" y="140.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(link layer, lookup, queue)</text><rect x="510" y="110" width="190" height="46" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="605" y="125.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Output port 2</text><text x="605" y="140.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(queue, link layer)</text><path d="M210,133 L268,133" fill="none" stroke="#17292d" stroke-width="2"/><path d="M268,133 L259.0,137.3 L259.0,128.7 Z" fill="#17292d"/><path d="M452,133 L508,133" fill="none" stroke="#17292d" stroke-width="2"/><path d="M508,133 L499.0,137.3 L499.0,128.7 Z" fill="#17292d"/><rect x="20" y="180" width="190" height="46" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="115" y="195.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Input port 3</text><text x="115" y="210.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(link layer, lookup, queue)</text><rect x="510" y="180" width="190" height="46" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="605" y="195.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Output port 3</text><text x="605" y="210.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(queue, link layer)</text><path d="M210,203 L268,203" fill="none" stroke="#17292d" stroke-width="2"/><path d="M268,203 L259.0,207.3 L259.0,198.7 Z" fill="#17292d"/><path d="M452,203 L508,203" fill="none" stroke="#17292d" stroke-width="2"/><path d="M508,203 L499.0,207.3 L499.0,198.7 Z" fill="#17292d"/><rect x="270" y="40" width="180" height="186" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="360" y="117" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Switching fabric</text><text x="360" y="133" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(memory, bus or</text><text x="360" y="149" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">crossbar)</text><rect x="270" y="250" width="180" height="46" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="360" y="265.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Routing processor</text><text x="360" y="280.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(control plane)</text><line x1="360" y1="226" x2="360" y2="250" stroke="#4b6166" stroke-width="2" stroke-dasharray="4 3"/><text x="470" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">computes forwarding table</text><text x="115" y="255" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">data plane: forwarding</text><text x="115" y="271" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">(hardware, nanoseconds)</text><text x="360" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Inside a router: input ports, switching fabric, output ports and routing processor</text>
</svg>
