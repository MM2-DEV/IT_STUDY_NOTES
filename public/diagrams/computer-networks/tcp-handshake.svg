<svg xmlns="http://www.w3.org/2000/svg" width="730" height="385" viewBox="0 0 730 385" role="img" aria-label="TCP handshake">
<title>TCP handshake</title>
<rect width="730" height="385" fill="#ffffff"/>
<text x="185" y="18" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Connection setup (three-way handshake)</text><text x="60" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><text x="310" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Server</text><line x1="60" y1="52" x2="60" y2="330" stroke="#17292d" stroke-width="3"/><line x1="310" y1="52" x2="310" y2="330" stroke="#17292d" stroke-width="3"/><path d="M60,60 L310,85" fill="none" stroke="#08595a" stroke-width="2"/><path d="M310,85 L300.6,88.4 L301.5,79.8 Z" fill="#08595a"/><text x="185" y="56.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">SYN, seq = x</text><path d="M310,120 L60,145" fill="none" stroke="#17292d" stroke-width="2"/><path d="M60,145 L68.5,139.8 L69.4,148.4 Z" fill="#17292d"/><text x="185" y="116.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SYN + ACK, seq = y, ack = x + 1</text><path d="M60,180 L310,205" fill="none" stroke="#08595a" stroke-width="2"/><path d="M310,205 L300.6,208.4 L301.5,199.8 Z" fill="#08595a"/><text x="185" y="176.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">ACK, seq = x + 1, ack = y + 1</text><text x="185" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">connection ESTABLISHED; data can flow</text><text x="545" y="18" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Connection release (four-way)</text><text x="420" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><text x="670" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Server</text><line x1="420" y1="52" x2="420" y2="330" stroke="#17292d" stroke-width="3"/><line x1="670" y1="52" x2="670" y2="330" stroke="#17292d" stroke-width="3"/><path d="M420,60 L670,85" fill="none" stroke="#08595a" stroke-width="2"/><path d="M670,85 L660.6,88.4 L661.5,79.8 Z" fill="#08595a"/><text x="545" y="56.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">FIN</text><path d="M670,115 L420,140" fill="none" stroke="#17292d" stroke-width="2"/><path d="M420,140 L428.5,134.8 L429.4,143.4 Z" fill="#17292d"/><text x="545" y="111.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ACK</text><path d="M670,170 L420,195" fill="none" stroke="#17292d" stroke-width="2"/><path d="M420,195 L428.5,189.8 L429.4,198.4 Z" fill="#17292d"/><text x="545" y="166.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">FIN</text><path d="M420,225 L670,250" fill="none" stroke="#08595a" stroke-width="2"/><path d="M670,250 L660.6,253.4 L661.5,244.8 Z" fill="#08595a"/><text x="545" y="221.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">ACK</text><text x="545" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">client waits (TIME_WAIT), then CLOSED</text><text x="365" y="373" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Opening and closing a TCP connection</text>
</svg>
