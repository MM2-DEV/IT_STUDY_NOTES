<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="Line coding schemes">
<title>Line coding schemes</title>
<rect width="720" height="450" fill="#ffffff"/>
<text x="230" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><text x="290" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><text x="350" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><text x="410" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><text x="470" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><text x="530" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><text x="590" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><text x="650" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><line x1="200" y1="38" x2="200" y2="360" stroke="#c9d6d6" stroke-width="1" stroke-dasharray="3 3"/><line x1="260" y1="38" x2="260" y2="360" stroke="#c9d6d6" stroke-width="1" stroke-dasharray="3 3"/><line x1="320" y1="38" x2="320" y2="360" stroke="#c9d6d6" stroke-width="1" stroke-dasharray="3 3"/><line x1="380" y1="38" x2="380" y2="360" stroke="#c9d6d6" stroke-width="1" stroke-dasharray="3 3"/><line x1="440" y1="38" x2="440" y2="360" stroke="#c9d6d6" stroke-width="1" stroke-dasharray="3 3"/><line x1="500" y1="38" x2="500" y2="360" stroke="#c9d6d6" stroke-width="1" stroke-dasharray="3 3"/><line x1="560" y1="38" x2="560" y2="360" stroke="#c9d6d6" stroke-width="1" stroke-dasharray="3 3"/><line x1="620" y1="38" x2="620" y2="360" stroke="#c9d6d6" stroke-width="1" stroke-dasharray="3 3"/><line x1="680" y1="38" x2="680" y2="360" stroke="#c9d6d6" stroke-width="1" stroke-dasharray="3 3"/><text x="185" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">NRZ-L</text><line x1="200" y1="82" x2="680" y2="82" stroke="#dde6e6" stroke-width="1"/><path d="M200,104 L230,104 L230,104 L260,104 L260,60 L290,60 L290,60 L320,60 L320,104 L350,104 L350,104 L380,104 L380,104 L410,104 L410,104 L440,104 L440,60 L470,60 L470,60 L500,60 L500,60 L530,60 L530,60 L560,60 L560,60 L590,60 L590,60 L620,60 L620,104 L650,104 L650,104 L680,104" fill="none" stroke="#08595a" stroke-width="2.5"/><text x="185" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">NRZ-I</text><line x1="200" y1="162" x2="680" y2="162" stroke="#dde6e6" stroke-width="1"/><path d="M200,184 L230,184 L230,184 L260,184 L260,140 L290,140 L290,140 L320,140 L320,140 L350,140 L350,140 L380,140 L380,140 L410,140 L410,140 L440,140 L440,184 L470,184 L470,184 L500,184 L500,140 L530,140 L530,140 L560,140 L560,184 L590,184 L590,184 L620,184 L620,184 L650,184 L650,184 L680,184" fill="none" stroke="#08595a" stroke-width="2.5"/><text x="185" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">Manchester</text><line x1="200" y1="242" x2="680" y2="242" stroke="#dde6e6" stroke-width="1"/><path d="M200,220 L230,220 L230,264 L260,264 L260,264 L290,264 L290,220 L320,220 L320,220 L350,220 L350,264 L380,264 L380,220 L410,220 L410,264 L440,264 L440,264 L470,264 L470,220 L500,220 L500,264 L530,264 L530,220 L560,220 L560,264 L590,264 L590,220 L620,220 L620,220 L650,220 L650,264 L680,264" fill="none" stroke="#08595a" stroke-width="2.5"/><text x="185" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">Differential Manchester</text><line x1="200" y1="322" x2="680" y2="322" stroke="#dde6e6" stroke-width="1"/><path d="M200,344 L230,344 L230,300 L260,300 L260,300 L290,300 L290,344 L320,344 L320,300 L350,300 L350,344 L380,344 L380,300 L410,300 L410,344 L440,344 L440,344 L470,344 L470,300 L500,300 L500,300 L530,300 L530,344 L560,344 L560,344 L590,344 L590,300 L620,300 L620,344 L650,344 L650,300 L680,300" fill="none" stroke="#08595a" stroke-width="2.5"/><text x="360" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">NRZ-L: 1 = high, 0 = low.  NRZ-I: 1 = invert the level, 0 = no change (starts low).</text><text x="360" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Manchester (IEEE 802.3): 1 = low-to-high, 0 = high-to-low in the middle of the bit.</text><text x="360" y="410" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Differential Manchester: always a mid-bit transition; 0 = transition at the start, 1 = none.</text><text x="360" y="436" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The bit pattern 01001110 in four line-coding schemes</text>
</svg>
