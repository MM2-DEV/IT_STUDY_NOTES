<svg xmlns="http://www.w3.org/2000/svg" width="730" height="265" viewBox="0 0 730 265" role="img" aria-label="ARP">
<title>ARP</title>
<rect width="730" height="265" fill="#ffffff"/>
<line x1="30" y1="150" x2="690" y2="150" stroke="#17292d" stroke-width="3"/><text x="700" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">LAN</text><line x1="90" y1="150" x2="90" y2="120" stroke="#4b6166" stroke-width="2"/><rect x="35" y="80" width="110" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="90" y="92.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host A</text><text x="90" y="107.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">192.168.1.2</text><line x1="270" y1="150" x2="270" y2="120" stroke="#4b6166" stroke-width="2"/><rect x="215" y="80" width="110" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="270" y="92.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host C</text><text x="270" y="107.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">192.168.1.4</text><line x1="450" y1="150" x2="450" y2="120" stroke="#4b6166" stroke-width="2"/><rect x="395" y="80" width="110" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="450" y="92.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host B</text><text x="450" y="107.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">192.168.1.3</text><line x1="620" y1="150" x2="620" y2="120" stroke="#4b6166" stroke-width="2"/><rect x="565" y="80" width="110" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="620" y="92.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host D</text><text x="620" y="107.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">192.168.1.5</text><text x="360" y="22" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">1. ARP request (broadcast to FF:FF:FF:FF:FF:FF): "Who has 192.168.1.3? Tell 192.168.1.2"</text><line x1="90" y1="75" x2="90" y2="40" stroke="#08595a" stroke-width="2"/><line x1="90" y1="40" x2="620" y2="40" stroke="#08595a" stroke-width="2"/><path d="M620,40 L620,76" fill="none" stroke="#08595a" stroke-width="2"/><path d="M620,76 L615.7,67.0 L624.3,67.0 Z" fill="#08595a"/><path d="M270,40 L270,76" fill="none" stroke="#08595a" stroke-width="2"/><path d="M270,76 L265.7,67.0 L274.3,67.0 Z" fill="#08595a"/><path d="M450,40 L450,76" fill="none" stroke="#08595a" stroke-width="2"/><path d="M450,76 L445.7,67.0 L454.3,67.0 Z" fill="#08595a"/><text x="270" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">2. ARP reply (unicast to A): "192.168.1.3 is at BB:BB:BB:BB:BB:BB"</text><line x1="450" y1="152" x2="450" y2="180" stroke="#c0392b" stroke-width="2"/><line x1="450" y1="180" x2="90" y2="180" stroke="#c0392b" stroke-width="2"/><path d="M90,180 L90,154" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M90,154 L94.3,163.0 L85.7,163.0 Z" fill="#c0392b"/><text x="360" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">3. A stores the mapping in its ARP cache and sends the frame to B's MAC address</text><text x="365" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">ARP: the request is broadcast; only the owner of the IP address replies</text>
</svg>
