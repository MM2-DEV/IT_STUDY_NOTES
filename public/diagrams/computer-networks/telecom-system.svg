306.0,90.3 L306.0,81.7 Z" fill="#17292d"/><rect x="418" y="60" width="88" height="52" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="462" y="86" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receiver</text><path d="M404,86 L417,86" fill="none" stroke="#17292d" stroke-width="2"/><path d="M417,86 L408.0,90.3 L408.0,81.7 Z" fill="#17292d"/><rect x="520" y="60" width="88" height="52" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="564" y="78.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Output</text><text x="564" y="93.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">transducer</text><path d="M506,86 L519,86" fill="none" stroke="#17292d" stroke-width="2"/><path d="M519,86 L510.0,90.3 L510.0,81.7 Z" fill="#17292d"/><rect x="622" y="60" width="88" height="52" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="666" y="86" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Destination</text><path d="M608,86 L621,86" fill="none" stroke="#17292d" stroke-width="2"/><path d="M621,86 L612.0,90.3 L612.0,81.7 Z" fill="#17292d"/><rect x="316" y="160" width="88" height="36" rx="6" fill="#f6d5d5" stroke="#17292d" stroke-width="2"/><text x="360" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Noise</text><path d="M360,160 L360,114" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M360,114 L364.3,123.0 L355.7,123.0 Z" fill="#c0392b"/><text x="105" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">e.g. microphone</text><text x="207" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">modulation</text><text x="462" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">demodulation</text><text x="564" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">e.g. loudspeaker</text><text x="360" y="30" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">electrical signal ←— message —→ electrical signal</text><text x="360" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Block diagram of a telecommunication system</text>
