<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="Sliding window">
<title>Sliding window</title>
<rect width="720" height="230" fill="#ffffff"/>
<text x="360" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sender sliding window (3-bit sequence numbers: 0–7, window size 7)</text><rect x="40" y="70" width="52" height="44" rx="6" fill="#e3eaea" stroke="#17292d" stroke-width="2"/><text x="66" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><rect x="92" y="70" width="52" height="44" rx="6" fill="#e3eaea" stroke="#17292d" stroke-width="2"/><text x="118" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><rect x="144" y="70" width="52" height="44" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="170" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2</text><rect x="196" y="70" width="52" height="44" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="222" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3</text><rect x="248" y="70" width="52" height="44" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="274" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4</text><rect x="300" y="70" width="52" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="326" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5</text><rect x="352" y="70" width="52" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="378" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">6</text><rect x="404" y="70" width="52" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="430" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">7</text><rect x="456" y="70" width="52" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="482" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><rect x="508" y="70" width="52" height="44" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="534" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><rect x="560" y="70" width="52" height="44" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="586" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2</text><rect x="612" y="70" width="52" height="44" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="638" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3</text><rect x="140" y="62" width="372" height="60" fill="none" stroke="#c0392b" stroke-width="3" rx="6"/><text x="92" y="142" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">acknowledged</text><text x="222" y="142" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">sent, not yet ACKed</text><text x="404" y="142" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">can be sent now</text><text x="586" y="142" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">cannot be sent yet</text><path d="M184,170 L288,170" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M288,170 L279.0,174.3 L279.0,165.7 Z" fill="#c0392b"/><text x="236" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">window slides right when an ACK arrives</text><text x="360" y="215" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The sender may have up to 7 unacknowledged frames; each ACK slides the window forward</text>
</svg>
