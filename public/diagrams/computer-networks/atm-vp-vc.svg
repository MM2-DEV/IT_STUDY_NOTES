<svg xmlns="http://www.w3.org/2000/svg" width="740" height="255" viewBox="0 0 740 255" role="img" aria-label="ATM VP and VC">
<title>ATM VP and VC</title>
<rect width="740" height="255" fill="#ffffff"/>
<rect x="30" y="30" width="300" height="150" rx="8" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="180" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Transmission path (TP) — the physical link</text><rect x="45" y="50" width="270" height="50" rx="25" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="65" y="75" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">VP 1</text><line x1="110" y1="63" x2="300" y2="63" stroke="#17292d" stroke-width="2"/><line x1="110" y1="75" x2="300" y2="75" stroke="#17292d" stroke-width="2"/><line x1="110" y1="87" x2="300" y2="87" stroke="#17292d" stroke-width="2"/><rect x="45" y="110" width="270" height="50" rx="25" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="65" y="135" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">VP 2</text><line x1="110" y1="123" x2="300" y2="123" stroke="#17292d" stroke-width="2"/><line x1="110" y1="135" x2="300" y2="135" stroke="#17292d" stroke-width="2"/><line x1="110" y1="147" x2="300" y2="147" stroke="#17292d" stroke-width="2"/><text x="205" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">each line = one virtual channel (VC); a VP is a bundle of VCs</text><rect x="420" y="40" width="100" height="90" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="470" y="76.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ATM</text><text x="470" y="93.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">switch</text><path d="M345,100 L418,100" fill="none" stroke="#17292d" stroke-width="2"/><path d="M418,100 L409.0,104.3 L409.0,95.7 Z" fill="#17292d"/><text x="381" y="72" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">in: port 1</text><text x="381" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VPI 14, VCI 21</text><path d="M520,100 L600,100" fill="none" stroke="#17292d" stroke-width="2"/><path d="M600,100 L591.0,104.3 L591.0,95.7 Z" fill="#17292d"/><text x="560" y="72" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">out: port 3</text><text x="560" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VPI 22, VCI 74</text><rect x="370" y="150" width="60" height="26" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="400" y="163" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">In port</text><rect x="430" y="150" width="60" height="26" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="460" y="163" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">In VPI</text><rect x="490" y="150" width="60" height="26" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="520" y="163" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">In VCI</text><rect x="550" y="150" width="60" height="26" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="580" y="163" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Out port</text><rect x="610" y="150" width="60" height="26" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="640" y="163" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Out VPI</text><rect x="670" y="150" width="60" height="26" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="700" y="163" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Out VCI</text><rect x="370" y="176" width="60" height="26" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="400" y="189" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><rect x="430" y="176" width="60" height="26" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="460" y="189" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">14</text><rect x="490" y="176" width="60" height="26" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="520" y="189" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">21</text><rect x="550" y="176" width="60" height="26" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="580" y="189" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3</text><rect x="610" y="176" width="60" height="26" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="640" y="189" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">22</text><rect x="670" y="176" width="60" height="26" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="700" y="189" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">74</text><text x="550" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">switching table: the switch changes the VPI/VCI at each hop</text><text x="370" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Virtual paths and virtual channels, and a VP/VC switch with its switching table</text>
</svg>
