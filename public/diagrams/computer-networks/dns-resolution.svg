<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="DNS resolution">
<title>DNS resolution</title>
<rect width="720" height="405" fill="#ffffff"/>
<rect x="15" y="150" width="100" height="46" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="65" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host</text><text x="65" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(client)</text><rect x="215" y="150" width="130" height="46" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="280" y="165.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Local DNS</text><text x="280" y="180.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">server (resolver)</text><rect x="530" y="20" width="170" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="615" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Root DNS server</text><rect x="530" y="153" width="170" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="615" y="173" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">TLD (.com) server</text><rect x="530" y="286" width="170" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="615" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Authoritative server</text><path d="M115,181 L215,181" fill="none" stroke="#17292d" stroke-width="2"/><path d="M215,181 L206.0,185.3 L206.0,176.7 Z" fill="#17292d"/><path d="M215,165 L115,165" fill="none" stroke="#17292d" stroke-width="2"/><path d="M115,165 L124.0,160.7 L124.0,169.3 Z" fill="#17292d"/><text x="165" y="193.8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">1</text><text x="165" y="152.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">8</text><path d="M349.223472969005,166.79428260231236 L534.223472969005,51.79428260231235" fill="none" stroke="#17292d" stroke-width="2"/><path d="M534.223472969005,51.79428260231235 L528.9,60.2 L524.3,52.9 Z" fill="#17292d"/><path d="M525.776527030995,38.20571739768765 L340.776527030995,153.20571739768764" fill="none" stroke="#17292d" stroke-width="2"/><path d="M340.776527030995,153.20571739768764 L346.1,144.8 L350.7,152.1 Z" fill="#17292d"/><text x="448.48102971941296" y="120.16513476601212" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">2</text><text x="426.51897028058704" y="84.83486523398788" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3</text><path d="M345,181 L530,181" fill="none" stroke="#17292d" stroke-width="2"/><path d="M530,181 L521.0,185.3 L521.0,176.7 Z" fill="#17292d"/><path d="M530,165 L345,165" fill="none" stroke="#17292d" stroke-width="2"/><path d="M345,165 L354.0,160.7 L354.0,169.3 Z" fill="#17292d"/><text x="437.5" y="193.8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">4</text><text x="437.5" y="152.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5</text><path d="M340.776527030995,192.79428260231236 L525.776527030995,307.79428260231236" fill="none" stroke="#17292d" stroke-width="2"/><path d="M525.776527030995,307.79428260231236 L515.8,306.7 L520.4,299.3 Z" fill="#17292d"/><path d="M534.223472969005,294.20571739768764 L349.223472969005,179.20571739768764" fill="none" stroke="#17292d" stroke-width="2"/><path d="M349.223472969005,179.20571739768764 L359.2,180.3 L354.6,187.7 Z" fill="#17292d"/><text x="426.51897028058704" y="261.1651347660121" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">6</text><text x="448.48102971941296" y="225.8348652339879" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">7</text><text x="360" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">1 = query for www.example.com (recursive); 2, 4, 6 = iterative queries; 3 = address of the TLD server;</text><text x="360" y="367" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">5 = address of the authoritative server; 7 = IP address of www.example.com; 8 = answer to the host</text><text x="360" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Resolving a name: a recursive query to the local server, then iterative queries from it</text>
</svg>
