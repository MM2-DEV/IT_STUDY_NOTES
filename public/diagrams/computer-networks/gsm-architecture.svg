, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">BSC</text><line x1="235" y1="90" x2="265" y2="125" stroke="#4b6166" stroke-width="2"/><line x1="235" y1="170" x2="265" y2="135" stroke="#4b6166" stroke-width="2"/><rect x="380" y="40" width="230" height="200" rx="8" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="495" y="30" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Network switching subsystem (NSS)</text><rect x="395" y="110" width="80" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="435" y="122.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">MSC</text><text x="435" y="137.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(+ VLR)</text><rect x="515" y="55" width="80" height="34" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="555" y="72" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">HLR</text><rect x="515" y="105" width="80" height="34" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="555" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">AuC</text><rect x="515" y="155" width="80" height="34" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="555" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">EIR</text><rect x="395" y="185" width="80" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="435" y="205" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">GMSC</text><line x1="475" y1="125" x2="515" y2="72" stroke="#4b6166" stroke-width="2"/><line x1="475" y1="130" x2="515" y2="122" stroke="#4b6166" stroke-width="2"/><line x1="475" y1="135" x2="515" y2="172" stroke="#4b6166" stroke-width="2"/><line x1="435" y1="150" x2="435" y2="185" stroke="#4b6166" stroke-width="2"/><rect x="640" y="185" width="70" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="675" y="198" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">PSTN /</text><text x="675" y="212" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">other nets</text><line x1="475" y1="205" x2="640" y2="205" stroke="#4b6166" stroke-width="2"/><path d="M105,90 L163,90" fill="none" stroke="#17292d" stroke-width="2"/><path d="M163,90 L154.0,94.3 L154.0,85.7 Z" fill="#17292d"/><text x="134" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Um</text><text x="134" y="134" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">(radio)</text><text x="250" y="220" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Abis</text><line x1="335" y1="130" x2="395" y2="130" stroke="#4b6166" stroke-width="2"/><text x="365" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">A</text><rect x="360" y="265" width="280" height="36" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="500" y="283" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Operation support subsystem (OSS / OMC)</text><text x="360" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">GSM architecture: MS, BSS, NSS and OSS</text>
