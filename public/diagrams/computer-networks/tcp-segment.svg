<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="TCP segment">
<title>TCP segment</title>
<rect width="720" height="330" fill="#ffffff"/>
<text x="360" y="16" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">32 bits</text><line x1="120" y1="24" x2="600" y2="24" stroke="#4b6166" stroke-width="1"/><rect x="120" y="30" width="240" height="38" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="240" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Source port (16)</text><rect x="360" y="30" width="240" height="38" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="480" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Destination port (16)</text><rect x="120" y="68" width="480" height="38" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="360" y="87" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sequence number (32)</text><rect x="120" y="106" width="480" height="38" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="125" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Acknowledgement number (32)</text><rect x="120" y="144" width="62.400000000000006" height="38" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="151.2" y="155.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Header</text><text x="151.2" y="170.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">length (4)</text><rect x="182.4" y="144" width="48" height="38" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="206.4" y="163" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Rsvd</text><rect x="230.4" y="144" width="129.60000000000002" height="38" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="295.20000000000005" y="155.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Flags: URG ACK PSH</text><text x="295.20000000000005" y="170.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">RST SYN FIN</text><rect x="360" y="144" width="240" height="38" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="480" y="163" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receive window (16)</text><rect x="120" y="182" width="240" height="38" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="240" y="201" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Checksum (16)</text><rect x="360" y="182" width="240" height="38" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="480" y="201" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Urgent data pointer (16)</text><rect x="120" y="220" width="480" height="38" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="360" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Options (variable, 0–40 bytes)</text><rect x="120" y="258" width="480" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="360" y="277" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data</text><text x="612" y="125" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">20-byte</text><text x="612" y="141" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">header</text><text x="360" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">TCP segment structure (header 20 to 60 bytes)</text>
</svg>
