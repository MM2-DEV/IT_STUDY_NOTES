<svg xmlns="http://www.w3.org/2000/svg" width="720" height="255" viewBox="0 0 720 255" role="img" aria-label="Baseband and broadband">
<title>Baseband and broadband</title>
<rect width="720" height="255" fill="#ffffff"/>
<text x="185" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Baseband</text><text x="545" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Broadband</text><line x1="40" y1="170" x2="340" y2="170" stroke="#4b6166" stroke-width="1.5"/><line x1="40" y1="170" x2="40" y2="170" stroke="#4b6166" stroke-width="1.5"/><text x="336" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">frequency</text><path d="M40,170 L40,70 Q190,60 320,170 Z" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="150" y="125" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">one signal uses</text><text x="150" y="142" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">the whole bandwidth</text><text x="40" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">0 Hz</text><line x1="400" y1="170" x2="700" y2="170" stroke="#4b6166" stroke-width="1.5"/><line x1="400" y1="170" x2="400" y2="170" stroke="#4b6166" stroke-width="1.5"/><text x="696" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">frequency</text><rect x="420" y="90" width="56" height="80" rx="3" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="448" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Ch 1</text><rect x="488" y="90" width="56" height="80" rx="3" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="516" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Ch 2</text><rect x="556" y="90" width="56" height="80" rx="3" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="584" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Ch 3</text><rect x="624" y="90" width="56" height="80" rx="3" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="652" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Ch 4</text><text x="185" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">digital signal sent directly, no modulation</text><text x="545" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">many modulated signals on separate frequencies (FDM)</text><text x="360" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Baseband uses the whole channel for one signal; broadband divides it into frequency channels</text>
</svg>
