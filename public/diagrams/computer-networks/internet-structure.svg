<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="Internet structure">
<title>Internet structure</title>
<rect width="920" height="360" fill="#ffffff"/>
<ellipse cx="450" cy="170" rx="210" ry="95" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><text x="450" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Network core (routers, links)</text><line x1="330" y1="150" x2="450" y2="120" stroke="#17292d" stroke-width="2"/><line x1="450" y1="120" x2="570" y2="150" stroke="#17292d" stroke-width="2"/><line x1="330" y1="150" x2="390" y2="220" stroke="#17292d" stroke-width="2"/><line x1="390" y1="220" x2="510" y2="220" stroke="#17292d" stroke-width="2"/><line x1="510" y1="220" x2="570" y2="150" stroke="#17292d" stroke-width="2"/><line x1="450" y1="120" x2="390" y2="220" stroke="#17292d" stroke-width="2"/><line x1="450" y1="120" x2="510" y2="220" stroke="#17292d" stroke-width="2"/><rect x="25" y="42" width="160" height="56" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="105" y="62.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Home</text><text x="105" y="77.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(DSL / cable / FTTH)</text><line x1="185" y1="70" x2="330" y2="150" stroke="#4b6166" stroke-width="2"/><rect x="25" y="242" width="160" height="56" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="105" y="262.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Mobile</text><text x="105" y="277.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(4G / 5G)</text><line x1="185" y1="270" x2="390" y2="220" stroke="#4b6166" stroke-width="2"/><rect x="735" y="42" width="160" height="56" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="815" y="62.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Enterprise LAN</text><text x="815" y="77.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(Ethernet, Wi-Fi)</text><line x1="735" y1="70" x2="570" y2="150" stroke="#4b6166" stroke-width="2"/><rect x="735" y="242" width="160" height="56" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="815" y="262.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data centre</text><text x="815" y="277.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(servers)</text><line x1="735" y1="270" x2="510" y2="220" stroke="#4b6166" stroke-width="2"/><circle cx="330" cy="150" r="16" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="330" y="151" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R</text><circle cx="450" cy="120" r="16" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="450" y="121" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R</text><circle cx="570" cy="150" r="16" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="570" y="151" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R</text><circle cx="390" cy="220" r="16" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="390" y="221" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R</text><circle cx="510" cy="220" r="16" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="510" y="221" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R</text><text x="80" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Network edge: end systems (hosts) and access networks</text><text x="460" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The Internet: end systems and access networks at the edge, connected through the network core</text>
</svg>
