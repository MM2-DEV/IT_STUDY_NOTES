<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-label="ATM layers">
<title>ATM layers</title>
<rect width="760" height="310" fill="#ffffff"/>
<rect x="250" y="20" width="260" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="380" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Upper layers (IP, voice, video)</text><rect x="250" y="70" width="260" height="70" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="380" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="380" y="86" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ATM adaptation layer (AAL)</text><rect x="262" y="98" width="116" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="320" y="115" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">CS (convergence)</text><rect x="382" y="98" width="116" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="440" y="108" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SAR (segmentation</text><text x="440" y="122" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">and reassembly)</text><rect x="250" y="150" width="260" height="44" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="380" y="164.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ATM layer</text><text x="380" y="179.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(cell header, VPI/VCI switching)</text><rect x="250" y="204" width="260" height="70" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="380" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="380" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Physical layer</text><rect x="262" y="232" width="116" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="320" y="242" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">TC (transmission</text><text x="320" y="256" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">convergence)</text><rect x="382" y="232" width="116" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="440" y="242" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">PMD (physical</text><text x="440" y="256" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">medium dependent)</text><text x="530" y="105" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">splits data into 48-byte payloads</text><text x="530" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">adds the 5-byte header</text><text x="530" y="240" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">sends cells as bits (SONET, fibre)</text><text x="230" y="105" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">AAL1, AAL2, AAL3/4, AAL5</text><text x="380" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Layers of the ATM reference model</text>
</svg>
