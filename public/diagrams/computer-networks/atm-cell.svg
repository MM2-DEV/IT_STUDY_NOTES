<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="ATM cell">
<title>ATM cell</title>
<rect width="720" height="340" fill="#ffffff"/>
<rect x="20" y="30" width="120" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="80" y="47" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Header</text><text x="80" y="63" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5 bytes</text><rect x="140" y="30" width="560" height="50" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="420" y="55" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Payload (user data) — 48 bytes</text><text x="360" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">ATM cell = 53 bytes</text><text x="20" y="135" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">UNI header (user–network interface)</text><rect x="20" y="145" width="68" height="38" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="54" y="157" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">GFC</text><text x="54" y="171" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4 bits</text><rect x="88" y="145" width="136" height="38" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="156" y="157" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VPI</text><text x="156" y="171" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">8 bits</text><rect x="224" y="145" width="272" height="38" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="157" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VCI</text><text x="360" y="171" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">16 bits</text><rect x="496" y="145" width="51" height="38" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="521.5" y="157" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">PT</text><text x="521.5" y="171" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3 bits</text><rect x="547" y="145" width="17" height="38" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="555.5" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><rect x="564" y="145" width="136" height="38" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="632" y="157" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">HEC</text><text x="632" y="171" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">8 bits</text><text x="20" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">NNI header (network–network interface)</text><rect x="20" y="225" width="204" height="38" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="122" y="237" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VPI</text><text x="122" y="251" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">12 bits</text><rect x="224" y="225" width="272" height="38" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="360" y="237" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VCI</text><text x="360" y="251" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">16 bits</text><rect x="496" y="225" width="51" height="38" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="521.5" y="237" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">PT</text><text x="521.5" y="251" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3 bits</text><rect x="547" y="225" width="17" height="38" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="555.5" y="244" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><rect x="564" y="225" width="136" height="38" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="632" y="237" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">HEC</text><text x="632" y="251" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">8 bits</text><text x="360" y="285" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">GFC = generic flow control, VPI = virtual path identifier, VCI = virtual channel identifier,</text><text x="360" y="301" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">PT = payload type, C = CLP (cell loss priority, 1 bit), HEC = header error control (CRC of the header)</text><text x="360" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The ATM cell and its UNI and NNI headers</text>
</svg>
