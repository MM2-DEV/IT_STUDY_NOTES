<svg xmlns="http://www.w3.org/2000/svg" width="720" height="215" viewBox="0 0 720 215" role="img" aria-label="UDP header">
<title>UDP header</title>
<rect width="720" height="215" fill="#ffffff"/>
<text x="360" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">32 bits</text><line x1="160" y1="28" x2="560" y2="28" stroke="#4b6166" stroke-width="1"/><rect x="160" y="35" width="200" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="260" y="57" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Source port (16)</text><rect x="360" y="35" width="200" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="460" y="57" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Destination port (16)</text><rect x="160" y="79" width="200" height="44" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="260" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Length (16)</text><rect x="360" y="79" width="200" height="44" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="460" y="101" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Checksum (16)</text><rect x="160" y="123" width="400" height="50" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="360" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Application data (message)</text><text x="600" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start" dominant-baseline="middle">8-byte header</text><text x="360" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">UDP segment format: an 8-byte header of four 16-bit fields</text>
</svg>
