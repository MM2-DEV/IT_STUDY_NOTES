<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-label="Stop-and-wait ARQ">
<title>Stop-and-wait ARQ</title>
<rect width="720" height="510" fill="#ffffff"/>
<text x="170" y="26" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sender</text><text x="550" y="26" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receiver</text><line x1="170" y1="40" x2="170" y2="470" stroke="#17292d" stroke-width="3"/><line x1="550" y1="40" x2="550" y2="470" stroke="#17292d" stroke-width="3"/><path d="M170,50 L550,100" fill="none" stroke="#08595a" stroke-width="2"/><path d="M550,100 L540.5,103.1 L541.6,94.5 Z" fill="#08595a"/><text x="360" y="66" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Frame 0</text><path d="M550,105 L170,155" fill="none" stroke="#17292d" stroke-width="2"/><path d="M170,155 L178.4,149.5 L179.5,158.1 Z" fill="#17292d"/><text x="360" y="121" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ACK 1</text><line x1="170" y1="165" x2="379" y2="192.5" stroke="#c0392b" stroke-width="2"/><text x="389" y="192.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">✕</text><text x="274.5" y="169.75" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">Frame 1 (lost)</text><line x1="160" y1="165" x2="160" y2="290" stroke="#4b6166" stroke-width="1.5"/><text x="154" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">timeout</text><path d="M170,290 L550,340" fill="none" stroke="#08595a" stroke-width="2"/><path d="M550,340 L540.5,343.1 L541.6,334.5 Z" fill="#08595a"/><text x="360" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Frame 1 (resent)</text><path d="M550,345 L170,395" fill="none" stroke="#17292d" stroke-width="2"/><path d="M170,395 L178.4,389.5 L179.5,398.1 Z" fill="#17292d"/><text x="360" y="361" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ACK 0</text><path d="M170,405 L550,455" fill="none" stroke="#08595a" stroke-width="2"/><path d="M550,455 L540.5,458.1 L541.6,449.5 Z" fill="#08595a"/><text x="360" y="421" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Frame 0</text><text x="360" y="495" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Stop-and-wait ARQ: one frame at a time; a lost frame is resent after a timeout</text>
</svg>
