<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Client-server and P2P">
<title>Client-server and P2P</title>
<rect width="720" height="330" fill="#ffffff"/>
<text x="180" y="20" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Client-server</text><text x="545" y="20" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Peer-to-peer (P2P)</text><line x1="60" y1="60" x2="180" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="300" y1="60" x2="180" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="60" y1="210" x2="180" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="300" y1="210" x2="180" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="180" y1="255" x2="180" y2="135" stroke="#4b6166" stroke-width="2"/><rect x="130" y="110" width="100" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="180" y="127" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Server</text><text x="180" y="143" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(always on)</text><rect x="28" y="44" width="64" height="32" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="60" y="60" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><rect x="268" y="44" width="64" height="32" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="300" y="60" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><rect x="28" y="194" width="64" height="32" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><rect x="268" y="194" width="64" height="32" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="300" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><rect x="148" y="239" width="64" height="32" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="180" y="255" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><line x1="460" y1="70" x2="630" y2="70" stroke="#4b6166" stroke-width="2"/><line x1="460" y1="70" x2="420" y2="175" stroke="#4b6166" stroke-width="2"/><line x1="630" y1="70" x2="670" y2="175" stroke="#4b6166" stroke-width="2"/><line x1="420" y1="175" x2="545" y2="250" stroke="#4b6166" stroke-width="2"/><line x1="670" y1="175" x2="545" y2="250" stroke="#4b6166" stroke-width="2"/><line x1="460" y1="70" x2="670" y2="175" stroke="#4b6166" stroke-width="2"/><line x1="630" y1="70" x2="545" y2="250" stroke="#4b6166" stroke-width="2"/><line x1="420" y1="175" x2="670" y2="175" stroke="#4b6166" stroke-width="2"/><rect x="430" y="54" width="60" height="32" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="460" y="70" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Peer</text><rect x="600" y="54" width="60" height="32" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="630" y="70" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Peer</text><rect x="390" y="159" width="60" height="32" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="420" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Peer</text><rect x="640" y="159" width="60" height="32" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="670" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Peer</text><rect x="515" y="234" width="60" height="32" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="545" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Peer</text><text x="180" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">clients talk only to the server</text><text x="545" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">peers act as both clients and servers</text><text x="360" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Client-server and peer-to-peer application architectures</text>
</svg>
