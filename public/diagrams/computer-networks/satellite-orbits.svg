<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Satellite orbits">
<title>Satellite orbits</title>
<rect width="720" height="360" fill="#ffffff"/>
<circle cx="200" cy="170" r="60" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="200" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Earth</text><circle cx="200" cy="170" r="80" fill="none" stroke="#17292d" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="266.02684919277425" cy="124.82860212839716" r="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="266.02684919277425" y="125.82860212839716" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><circle cx="386" cy="60" r="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="386" y="61" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="398" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">LEO (160–2000 km)</text><circle cx="200" cy="170" r="110" fill="none" stroke="#17292d" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="263.9851398410272" cy="80.5242944731689" r="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="263.9851398410272" y="81.5242944731689" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><circle cx="386" cy="80" r="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="386" y="81" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="398" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">MEO (2000–35 786 km)</text><circle cx="200" cy="170" r="150" fill="none" stroke="#17292d" stroke-width="1.5" stroke-dasharray=""/><circle cx="240.12482429368814" cy="25.466272187421055" r="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="240.12482429368814" y="26.466272187421055" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><circle cx="386" cy="100" r="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="386" y="101" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="398" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">GEO (35 786 km)</text><text x="380" y="30" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Orbits (not to scale)</text><rect x="470" y="140" width="110" height="34" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="525" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Satellite</text><text x="525" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(transponder)</text><rect x="395" y="270" width="90" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="440" y="285" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Earth station A</text><rect x="570" y="270" width="90" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="615" y="285" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Earth station B</text><path d="M440,268 L505,176" fill="none" stroke="#08595a" stroke-width="2"/><path d="M505,176 L503.4,185.9 L496.3,180.8 Z" fill="#08595a"/><text x="434.5" y="222" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">uplink (f₁)</text><path d="M550,176 L612,268" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M612,268 L603.4,263.0 L610.6,258.1 Z" fill="#c0392b"/><text x="621" y="222" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">downlink (f₂)</text><text x="525" y="318" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">f₁ ≠ f₂: e.g. C band 6 GHz up, 4 GHz down</text><text x="360" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Satellite orbits and the uplink and downlink of a transponder</text>
</svg>
