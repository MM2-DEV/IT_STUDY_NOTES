<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="Distance vector example">
<title>Distance vector example</title>
<rect width="600" height="270" fill="#ffffff"/>
<line x1="120" y1="170" x2="300" y2="40" stroke="#4b6166" stroke-width="2"/><circle cx="210" cy="105" r="11" fill="#fff"/><text x="210" y="105" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">2</text><line x1="300" y1="40" x2="480" y2="170" stroke="#4b6166" stroke-width="2"/><circle cx="390" cy="105" r="11" fill="#fff"/><text x="390" y="105" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">1</text><line x1="120" y1="170" x2="480" y2="170" stroke="#4b6166" stroke-width="2"/><circle cx="300" cy="184" r="11" fill="#fff"/><text x="300" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">7</text><circle cx="120" cy="170" r="24" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="120" y="171" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">x</text><circle cx="300" cy="40" r="24" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="300" y="41" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">y</text><circle cx="480" cy="170" r="24" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="480" y="171" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">z</text><text x="300" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Dx(z) = min{ c(x,y) + Dy(z),  c(x,z) + Dz(z) } = min{ 2 + 1,  7 + 0 } = 3   (via y)</text><text x="300" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Distance-vector calculation at router x using the Bellman-Ford equation</text>
</svg>
