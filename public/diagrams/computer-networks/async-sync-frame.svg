<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-label="Asynchronous and synchronous transmission">
<title>Asynchronous and synchronous transmission</title>
<rect width="720" height="250" fill="#ffffff"/>
<text x="20" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Asynchronous: each byte has a start bit (0) and a stop bit (1); gaps between bytes</text><rect x="30" y="40" width="26" height="36" rx="2" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="43" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><rect x="56" y="40" width="120" height="36" rx="2" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="116" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">8 data bits</text><rect x="176" y="40" width="26" height="36" rx="2" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="189" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><rect x="260" y="40" width="26" height="36" rx="2" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="273" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><rect x="286" y="40" width="120" height="36" rx="2" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="346" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">8 data bits</text><rect x="406" y="40" width="26" height="36" rx="2" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="419" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><rect x="500" y="40" width="26" height="36" rx="2" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="513" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><rect x="526" y="40" width="120" height="36" rx="2" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="586" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">8 data bits</text><rect x="646" y="40" width="26" height="36" rx="2" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="659" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><text x="230" y="58" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">gap</text><text x="468" y="58" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">gap</text><text x="43" y="92" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">start</text><text x="189" y="92" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">stop</text><text x="20" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Synchronous: bytes sent one after another as a frame, with no start/stop bits or gaps</text><rect x="30" y="148" width="110" height="36" rx="2" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="85" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Header (sync)</text><rect x="140" y="148" width="80" height="36" rx="2" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="180" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">byte</text><rect x="220" y="148" width="80" height="36" rx="2" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="260" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">byte</text><rect x="300" y="148" width="80" height="36" rx="2" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="340" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">byte</text><rect x="380" y="148" width="80" height="36" rx="2" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="420" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">byte</text><rect x="460" y="148" width="80" height="36" rx="2" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="500" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">byte</text><rect x="540" y="148" width="110" height="36" rx="2" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="595" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Trailer</text><path d="M650,205 L60,205" fill="none" stroke="#17292d" stroke-width="2"/><path d="M60,205 L69.0,200.7 L69.0,209.3 Z" fill="#17292d"/><text x="355" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">direction of flow</text><text x="360" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Asynchronous and synchronous serial transmission</text>
</svg>
