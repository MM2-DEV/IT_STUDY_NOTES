<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340" role="img" aria-label="VSAT network">
<title>VSAT network</title>
<rect width="740" height="340" fill="#ffffff"/>
<rect x="300" y="15" width="140" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="370" y="27.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">GEO satellite</text><text x="370" y="42.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(35 786 km)</text><rect x="300" y="230" width="140" height="46" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="370" y="245.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hub earth station</text><text x="370" y="260.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(large dish)</text><path d="M370,228 L370,58" fill="none" stroke="#08595a" stroke-width="2"/><path d="M370,58 L374.3,67.0 L365.7,67.0 Z" fill="#08595a"/><path d="M380,58 L380,228" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M380,228 L375.7,219.0 L384.3,219.0 Z" fill="#c0392b"/><rect x="470" y="238" width="120" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="530" y="253" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Internet / data centre</text><line x1="440" y1="253" x2="470" y2="253" stroke="#4b6166" stroke-width="2"/><rect x="22" y="140" width="96" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="70" y="153" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VSAT</text><text x="70" y="167" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(bank branch)</text><line x1="70" y1="140" x2="300" y2="45" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 4"/><rect x="122" y="180" width="96" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="170" y="193" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VSAT</text><text x="170" y="207" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(ATM)</text><line x1="170" y1="180" x2="300" y2="45" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 4"/><rect x="542" y="140" width="96" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="590" y="153" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VSAT</text><text x="590" y="167" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(remote office)</text><line x1="590" y1="140" x2="440" y2="45" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 4"/><rect x="592" y="70" width="96" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="640" y="83" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">VSAT</text><text x="640" y="97" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(ship)</text><line x1="640" y1="70" x2="440" y2="45" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 4"/><text x="370" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Star topology: every VSAT talks to the hub through the satellite (VSAT → satellite → hub → satellite → VSAT)</text><text x="370" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">A VSAT network: small terminals connected through a satellite to a central hub</text>
</svg>
