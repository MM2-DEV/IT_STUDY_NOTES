<rect x="20" y="30" width="130" height="300" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="85" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Computer A</text><text x="85" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(DTE)</text><text x="85" y="197" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DB-9</text><rect x="570" y="30" width="130" height="300" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="635" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Computer B</text><text x="635" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(DTE)</text><text x="635" y="197" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DB-9</text><text x="160" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">TxD (3)</text><text x="560" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">RxD (2)</text><text x="160" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">RxD (2)</text><text x="560" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">TxD (3)</text><text x="160" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">RTS (7)</text><text x="560" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">CTS (8)</text><text x="160" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">CTS (8)</text><text x="560" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">RTS (7)</text><text x="160" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">DTR (4)</text><text x="560" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">DSR + DCD (6 + 1)</text><text x="160" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">DSR + DCD (6 + 1)</text><text x="560" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">DTR (4)</text><text x="160" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">GND (5)</text><text x="560" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">GND (5)</text><line x1="285" y1="50" x2="435" y2="50" stroke="#08595a" stroke-width="2"/><line x1="285" y1="90" x2="435" y2="90" stroke="#08595a" stroke-width="2"/><line x1="285" y1="130" x2="435" y2="130" stroke="#08595a" stroke-width="2"/><line x1="285" y1="170" x2="435" y2="170" stroke="#08595a" stroke-width="2"/><line x1="285" y1="210" x2="435" y2="210" stroke="#08595a" stroke-width="2"/><line x1="285" y1="250" x2="435" y2="250" stroke="#08595a" stroke-width="2"/><line x1="285" y1="290" x2="435" y2="290" stroke="#4b6166" stroke-width="2"/><text x="360" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Pin numbers are for DB-9 connectors (full-handshaking wiring)</text><text x="360" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Null modem: the output signals of each computer go to the input signals of the other</text>
</svg>
