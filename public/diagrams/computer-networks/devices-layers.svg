<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Devices by layer">
<title>Devices by layer</title>
<rect width="720" height="260" fill="#ffffff"/>
<rect x="20" y="20" width="280" height="46" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="160" y="43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Layer 7–4: Application to transport</text><rect x="320" y="20" width="380" height="46" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="510" y="43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Gateway</text><rect x="20" y="76" width="280" height="46" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="160" y="99" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Layer 3: Network</text><rect x="320" y="76" width="380" height="46" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="510" y="99" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Router, Layer-3 switch, Brouter (2 + 3)</text><rect x="20" y="132" width="280" height="46" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="160" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Layer 2: Data link</text><rect x="320" y="132" width="380" height="46" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="510" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bridge, Switch, NIC, Access point</text><rect x="20" y="188" width="280" height="46" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="160" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Layer 1: Physical</text><rect x="320" y="188" width="380" height="46" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="510" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Repeater, Hub, Modem, Cables</text><text x="360" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Network devices and the OSI layers at which they work</text>
</svg>
