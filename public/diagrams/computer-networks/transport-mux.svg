<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Multiplexing and demultiplexing">
<title>Multiplexing and demultiplexing</title>
<rect width="720" height="340" fill="#ffffff"/>
<rect x="15" y="30" width="250" height="230" rx="8" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="140" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host A (sender)</text><rect x="30" y="60" width="72" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="66" y="78" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Browser</text><text x="66" y="92" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">port 50123</text><rect x="110" y="60" width="72" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="146" y="78" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Mail</text><text x="146" y="92" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">port 50200</text><rect x="190" y="60" width="72" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="226" y="78" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DNS</text><text x="226" y="92" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">port 53001</text><rect x="30" y="135" width="220" height="40" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="140" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Transport layer (TCP / UDP)</text><rect x="30" y="200" width="220" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="140" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Network layer (IP address)</text><line x1="66" y1="110" x2="66" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="146" y1="110" x2="146" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="226" y1="110" x2="226" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="140" y1="175" x2="140" y2="200" stroke="#4b6166" stroke-width="2"/><rect x="455" y="30" width="250" height="230" rx="8" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="580" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Server B (receiver)</text><rect x="470" y="60" width="72" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="506" y="78" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Web</text><text x="506" y="92" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">port 80</text><rect x="550" y="60" width="72" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="586" y="78" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SMTP</text><text x="586" y="92" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">port 25</text><rect x="630" y="60" width="72" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="666" y="78" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DNS</text><text x="666" y="92" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">port 53</text><rect x="470" y="135" width="220" height="40" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="580" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Transport layer (TCP / UDP)</text><rect x="470" y="200" width="220" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="580" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Network layer (IP address)</text><line x1="506" y1="110" x2="506" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="586" y1="110" x2="586" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="666" y1="110" x2="666" y2="135" stroke="#4b6166" stroke-width="2"/><line x1="580" y1="175" x2="580" y2="200" stroke="#4b6166" stroke-width="2"/><path d="M265,220 L453,220" fill="none" stroke="#17292d" stroke-width="2"/><path d="M453,220 L444.0,224.3 L444.0,215.7 Z" fill="#17292d"/><text x="359" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">segments with port numbers</text><text x="140" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Multiplexing: data from many sockets</text><text x="140" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">gets headers with port numbers</text><text x="580" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Demultiplexing: each segment goes to the</text><text x="580" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">socket named by its destination port</text><text x="360" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Transport-layer multiplexing and demultiplexing with port numbers</text>
</svg>
