<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="Bit rate vs baud rate">
<title>Bit rate vs baud rate</title>
<rect width="720" height="280" fill="#ffffff"/>
<line x1="110" y1="180" x2="650" y2="180" stroke="#d6e2e2" stroke-width="1"/><text x="100" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Level 0</text><line x1="110" y1="142" x2="650" y2="142" stroke="#d6e2e2" stroke-width="1"/><text x="100" y="142" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Level 1</text><line x1="110" y1="104" x2="650" y2="104" stroke="#d6e2e2" stroke-width="1"/><text x="100" y="104" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Level 2</text><line x1="110" y1="66" x2="650" y2="66" stroke="#d6e2e2" stroke-width="1"/><text x="100" y="66" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Level 3</text><text x="155" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">10</text><line x1="110" y1="44" x2="110" y2="200" stroke="#4b6166" stroke-width="1" stroke-dasharray="3 3"/><text x="245" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">01</text><line x1="200" y1="44" x2="200" y2="200" stroke="#4b6166" stroke-width="1" stroke-dasharray="3 3"/><text x="335" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">11</text><line x1="290" y1="44" x2="290" y2="200" stroke="#4b6166" stroke-width="1" stroke-dasharray="3 3"/><text x="425" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">00</text><line x1="380" y1="44" x2="380" y2="200" stroke="#4b6166" stroke-width="1" stroke-dasharray="3 3"/><text x="515" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">10</text><line x1="470" y1="44" x2="470" y2="200" stroke="#4b6166" stroke-width="1" stroke-dasharray="3 3"/><text x="605" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">11</text><line x1="560" y1="44" x2="560" y2="200" stroke="#4b6166" stroke-width="1" stroke-dasharray="3 3"/><path d="M110,104 L200,104 L200,142 L290,142 L290,66 L380,66 L380,180 L470,180 L470,104 L560,104 L560,66 L650,66" fill="none" stroke="#08595a" stroke-width="3"/><line x1="650" y1="44" x2="650" y2="200" stroke="#4b6166" stroke-width="1" stroke-dasharray="3 3"/><text x="360" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">4 signal levels (L = 4): each signal element (baud) carries log₂4 = 2 bits</text><text x="360" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">6 signal elements carry 12 bits, so bit rate = 2 × baud rate</text><text x="360" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Bit rate and baud rate with a four-level signal</text>
</svg>
