<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Transmission modes">
<title>Transmission modes</title>
<rect width="720" height="300" fill="#ffffff"/>
<text x="20" y="50" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Simplex</text><rect x="140" y="28" width="110" height="44" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="195" y="50" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Station A</text><rect x="470" y="28" width="110" height="44" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="525" y="50" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Station B</text><path d="M255,50 L465,50" fill="none" stroke="#17292d" stroke-width="2"/><path d="M465,50 L456.0,54.3 L456.0,45.7 Z" fill="#17292d"/><text x="360" y="86" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">one direction only</text><text x="20" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Half-duplex</text><rect x="140" y="118" width="110" height="44" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="195" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Station A</text><rect x="470" y="118" width="110" height="44" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="525" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Station B</text><path d="M255,132 L465,132" fill="none" stroke="#17292d" stroke-width="2"/><path d="M465,132 L456.0,136.3 L456.0,127.7 Z" fill="#17292d"/><path d="M465,148 L255,148" fill="none" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><path d="M255,148 L264.0,143.7 L264.0,152.3 Z" fill="#17292d"/><text x="360" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">both directions, one at a time (dashed: at another time)</text><text x="20" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Full-duplex</text><rect x="140" y="208" width="110" height="44" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="195" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Station A</text><rect x="470" y="208" width="110" height="44" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="525" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Station B</text><path d="M255,222 L465,222" fill="none" stroke="#17292d" stroke-width="2"/><path d="M465,222 L456.0,226.3 L456.0,217.7 Z" fill="#17292d"/><path d="M465,238 L255,238" fill="none" stroke="#17292d" stroke-width="2"/><path d="M255,238 L264.0,233.7 L264.0,242.3 Z" fill="#17292d"/><text x="360" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">both directions at the same time</text><text x="600" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Keyboard, TV</text><text x="600" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Walkie-talkie</text><text x="600" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Telephone</text><text x="360" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Simplex, half-duplex and full-duplex transmission</text>
</svg>
