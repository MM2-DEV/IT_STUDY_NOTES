<svg xmlns="http://www.w3.org/2000/svg" width="720" height="235" viewBox="0 0 720 235" role="img" aria-label="E-mail system">
<title>E-mail system</title>
<rect width="720" height="235" fill="#ffffff"/>
<rect x="10" y="70" width="110" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="65" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sender's</text><text x="65" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">user agent</text><rect x="190" y="70" width="120" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="250" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sender's</text><text x="250" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">mail server</text><rect x="430" y="70" width="120" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="490" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receiver's</text><text x="490" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">mail server</text><rect x="620" y="70" width="95" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="667.5" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receiver's</text><text x="667.5" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">user agent</text><path d="M120,95 L188,95" fill="none" stroke="#17292d" stroke-width="2"/><path d="M188,95 L179.0,99.3 L179.0,90.7 Z" fill="#17292d"/><text x="154" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">SMTP</text><path d="M310,95 L428,95" fill="none" stroke="#17292d" stroke-width="2"/><path d="M428,95 L419.0,99.3 L419.0,90.7 Z" fill="#17292d"/><text x="369" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">SMTP</text><path d="M618,95 L552,95" fill="none" stroke="#17292d" stroke-width="2"/><path d="M552,95 L561.0,90.7 L561.0,99.3 Z" fill="#17292d"/><text x="585" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">POP3/IMAP</text><text x="154" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">push</text><text x="369" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">push</text><text x="585" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">pull</text><text x="490" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">mailbox</text><text x="360" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">SMTP (TCP port 25) pushes mail from the sender to the receiver's mail server;</text><text x="360" y="193" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">the receiver pulls it from the mailbox with POP3 or IMAP (or HTTP for web mail)</text><text x="360" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Main parts of the Internet e-mail system</text>
</svg>
