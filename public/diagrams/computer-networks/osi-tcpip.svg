<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="OSI and TCP/IP">
<title>OSI and TCP/IP</title>
<rect width="720" height="360" fill="#ffffff"/>
<text x="170" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">OSI model (7 layers)</text><text x="560" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">TCP/IP model (4 layers)</text><rect x="90" y="36" width="160" height="38" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="170" y="55" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">7. Application</text><text x="275" y="55" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">data</text><rect x="90" y="80" width="160" height="38" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="170" y="99" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">6. Presentation</text><text x="275" y="99" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">data</text><rect x="90" y="124" width="160" height="38" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="170" y="143" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5. Session</text><text x="275" y="143" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">data</text><rect x="90" y="168" width="160" height="38" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="170" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Transport</text><text x="275" y="187" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">segment</text><rect x="90" y="212" width="160" height="38" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="170" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Network</text><text x="275" y="231" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">packet</text><rect x="90" y="256" width="160" height="38" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="170" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Data link</text><text x="275" y="275" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">frame</text><rect x="90" y="300" width="160" height="38" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="170" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Physical</text><text x="275" y="319" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">bits</text><rect x="470" y="36" width="180" height="126" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="560" y="91" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Application</text><text x="560" y="107" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(HTTP, FTP, SMTP, DNS)</text><rect x="470" y="168" width="180" height="38" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="560" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Transport (TCP, UDP)</text><rect x="470" y="212" width="180" height="38" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="560" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Internet (IP, ICMP, ARP)</text><rect x="470" y="256" width="180" height="82" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="560" y="289" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Network access</text><text x="560" y="305" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(Ethernet, Wi-Fi)</text><text x="325" y="231" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle"></text><text x="360" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">OSI layers and the corresponding TCP/IP layers, with the data unit of each OSI layer</text>
</svg>
