<svg xmlns="http://www.w3.org/2000/svg" width="720" height="355" viewBox="0 0 720 355" role="img" aria-label="HDLC frame">
<title>HDLC frame</title>
<rect width="720" height="355" fill="#ffffff"/>
<rect x="30" y="30" width="80" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="70" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Flag</text><text x="70" y="98" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">8 bits</text><text x="70" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">01111110</text><rect x="110" y="30" width="110" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="165" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Address</text><text x="165" y="98" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">8 bits (or more)</text><rect x="220" y="30" width="100" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="270" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Control</text><text x="270" y="98" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">8 or 16 bits</text><rect x="320" y="30" width="190" height="50" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="415" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Information</text><text x="415" y="98" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">variable</text><text x="415" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">(I-frames and some U-frames)</text><rect x="510" y="30" width="100" height="50" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="560" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">FCS</text><text x="560" y="98" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">16 or 32 bits</text><text x="560" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">CRC</text><rect x="610" y="30" width="80" height="50" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="650" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Flag</text><text x="650" y="98" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">8 bits</text><text x="650" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">01111110</text><text x="360" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Control field (8 bits, first bit sent on the left)</text><text x="160" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">I-frame</text><rect x="180" y="165" width="60" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="210" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">0</text><rect x="240" y="165" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="295" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">N(S) 3</text><rect x="350" y="165" width="60" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="380" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P/F</text><rect x="410" y="165" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="465" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">N(R) 3</text><text x="160" y="229" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">S-frame</text><rect x="180" y="211" width="60" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="210" y="229" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1 0</text><rect x="240" y="211" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="295" y="229" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Code 2</text><rect x="350" y="211" width="60" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="380" y="229" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P/F</text><rect x="410" y="211" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="465" y="229" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">N(R) 3</text><text x="160" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="end" dominant-baseline="middle">U-frame</text><rect x="180" y="257" width="60" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="210" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1 1</text><rect x="240" y="257" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="295" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Code 2</text><rect x="350" y="257" width="60" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="380" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P/F</text><rect x="410" y="257" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="465" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Code 3</text><text x="360" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">N(S) = send sequence number, N(R) = receive (acknowledgement) number, P/F = poll/final bit</text><text x="360" y="342" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">HDLC frame format and the three control-field formats</text>
</svg>
