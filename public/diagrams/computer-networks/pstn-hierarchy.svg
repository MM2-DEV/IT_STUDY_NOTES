<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="PSTN hierarchy">
<title>PSTN hierarchy</title>
<rect width="720" height="330" fill="#ffffff"/>
<rect x="285" y="15" width="150" height="40" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="360" y="27.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">International gateway</text><text x="360" y="42.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">exchange</text><rect x="140" y="85" width="150" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="215" y="97.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Trunk (toll)</text><text x="215" y="112.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">exchange</text><rect x="430" y="85" width="150" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="505" y="97.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Trunk (toll)</text><text x="505" y="112.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">exchange</text><rect x="60" y="160" width="130" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="125" y="172.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Local exchange</text><text x="125" y="187.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(central office)</text><rect x="240" y="160" width="130" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="305" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Local exchange</text><rect x="530" y="160" width="130" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="595" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Local exchange</text><line x1="215" y1="85" x2="330" y2="55" stroke="#4b6166" stroke-width="2"/><line x1="505" y1="85" x2="390" y2="55" stroke="#4b6166" stroke-width="2"/><line x1="290" y1="105" x2="430" y2="105" stroke="#c0392b" stroke-width="2"/><text x="360" y="98" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">trunks</text><line x1="125" y1="160" x2="195" y2="125" stroke="#4b6166" stroke-width="2"/><line x1="305" y1="160" x2="235" y2="125" stroke="#4b6166" stroke-width="2"/><line x1="595" y1="160" x2="505" y2="125" stroke="#4b6166" stroke-width="2"/><line x1="125" y1="200" x2="85" y2="236" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><rect x="59" y="236" width="52" height="28" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="85" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">☎</text><line x1="125" y1="200" x2="165" y2="236" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><rect x="139" y="236" width="52" height="28" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="165" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">☎</text><line x1="305" y1="200" x2="270" y2="236" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><rect x="244" y="236" width="52" height="28" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="270" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">☎</text><line x1="305" y1="200" x2="345" y2="236" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><rect x="319" y="236" width="52" height="28" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="345" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">☎</text><line x1="595" y1="200" x2="560" y2="236" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><rect x="534" y="236" width="52" height="28" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="560" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">☎</text><line x1="595" y1="200" x2="635" y2="236" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><rect x="609" y="236" width="52" height="28" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="635" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">☎</text><text x="360" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">local loop (subscriber line): twisted pair from each telephone to its local exchange</text><text x="360" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The hierarchy of the public switched telephone network (PSTN)</text>
</svg>
