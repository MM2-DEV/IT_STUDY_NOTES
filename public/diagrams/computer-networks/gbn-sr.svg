<svg xmlns="http://www.w3.org/2000/svg" width="720" height="505" viewBox="0 0 720 505" role="img" aria-label="Go-Back-N and Selective Repeat">
<title>Go-Back-N and Selective Repeat</title>
<rect width="720" height="505" fill="#ffffff"/>
<text x="175" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Go-Back-N ARQ</text><text x="60" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sender</text><text x="290" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receiver</text><line x1="60" y1="58" x2="60" y2="470" stroke="#17292d" stroke-width="3"/><line x1="290" y1="58" x2="290" y2="470" stroke="#17292d" stroke-width="3"/><path d="M60,66 L290,106" fill="none" stroke="#08595a" stroke-width="2"/><path d="M290,106 L280.4,108.7 L281.9,100.2 Z" fill="#08595a"/><text x="175" y="77" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F0</text><line x1="60" y1="96" x2="186.5" y2="118" stroke="#c0392b" stroke-width="2"/><text x="196.5" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">✕</text><text x="123.25" y="98" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">F1 (lost)</text><path d="M60,126 L290,166" fill="none" stroke="#08595a" stroke-width="2"/><path d="M290,166 L280.4,168.7 L281.9,160.2 Z" fill="#08595a"/><text x="175" y="137" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F2</text><path d="M60,156 L290,196" fill="none" stroke="#08595a" stroke-width="2"/><path d="M290,196 L280.4,198.7 L281.9,190.2 Z" fill="#08595a"/><text x="175" y="167" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F3</text><path d="M290,106 L60,146" fill="none" stroke="#17292d" stroke-width="2"/><path d="M60,146 L68.1,140.2 L69.6,148.7 Z" fill="#17292d"/><text x="221" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ACK 1</text><text x="284" y="230" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#c0392b" text-anchor="end" dominant-baseline="middle">F2, F3 discarded</text><line x1="52" y1="96" x2="52" y2="260" stroke="#4b6166" stroke-width="1.5"/><text x="48" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">timeout</text><path d="M60,270 L290,310" fill="none" stroke="#08595a" stroke-width="2"/><path d="M290,310 L280.4,312.7 L281.9,304.2 Z" fill="#08595a"/><text x="175" y="281" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F1</text><path d="M60,300 L290,340" fill="none" stroke="#08595a" stroke-width="2"/><path d="M290,340 L280.4,342.7 L281.9,334.2 Z" fill="#08595a"/><text x="175" y="311" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F2</text><path d="M60,330 L290,370" fill="none" stroke="#08595a" stroke-width="2"/><path d="M290,370 L280.4,372.7 L281.9,364.2 Z" fill="#08595a"/><text x="175" y="341" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F3</text><text x="175" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Frame 1 and all frames after it</text><text x="175" y="418" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">are resent (here F1, F2, F3)</text><text x="535" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Selective Repeat ARQ</text><text x="420" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sender</text><text x="650" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receiver</text><line x1="420" y1="58" x2="420" y2="470" stroke="#17292d" stroke-width="3"/><line x1="650" y1="58" x2="650" y2="470" stroke="#17292d" stroke-width="3"/><path d="M420,66 L650,106" fill="none" stroke="#08595a" stroke-width="2"/><path d="M650,106 L640.4,108.7 L641.9,100.2 Z" fill="#08595a"/><text x="535" y="77" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F0</text><line x1="420" y1="96" x2="546.5" y2="118" stroke="#c0392b" stroke-width="2"/><text x="556.5" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">✕</text><text x="483.25" y="98" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">F1 (lost)</text><path d="M420,126 L650,166" fill="none" stroke="#08595a" stroke-width="2"/><path d="M650,166 L640.4,168.7 L641.9,160.2 Z" fill="#08595a"/><text x="535" y="137" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F2</text><path d="M420,156 L650,196" fill="none" stroke="#08595a" stroke-width="2"/><path d="M650,196 L640.4,198.7 L641.9,190.2 Z" fill="#08595a"/><text x="535" y="167" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F3</text><text x="644" y="240" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#08595a" text-anchor="end" dominant-baseline="middle">F2, F3 buffered</text><path d="M650,168 L420,208" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M420,208 L428.1,202.2 L429.6,210.7 Z" fill="#c0392b"/><text x="477.5" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">NAK 1</text><path d="M420,270 L650,310" fill="none" stroke="#08595a" stroke-width="2"/><path d="M650,310 L640.4,312.7 L641.9,304.2 Z" fill="#08595a"/><text x="535" y="281" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">F1</text><text x="535" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Only the lost frame F1 is resent;</text><text x="535" y="418" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">the receiver delivers F1, F2, F3 in order</text><text x="360" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Frame 1 is lost: Go-Back-N resends from frame 1 onward; Selective Repeat resends only frame 1</text>
</svg>
