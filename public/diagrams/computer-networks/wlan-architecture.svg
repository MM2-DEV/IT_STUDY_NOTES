<svg xmlns="http://www.w3.org/2000/svg" width="750" height="310" viewBox="0 0 750 310" role="img" aria-label="WLAN architecture">
<title>WLAN architecture</title>
<rect width="750" height="310" fill="#ffffff"/>
<rect x="150" y="15" width="330" height="34" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="315" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Distribution system (wired LAN) → router → Internet</text><ellipse cx="160" cy="175" rx="120" ry="80" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><text x="160" y="111" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">BSS 1</text><ellipse cx="460" cy="175" rx="120" ry="80" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><text x="460" y="111" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">BSS 2</text><line x1="160" y1="49" x2="160" y2="140" stroke="#17292d" stroke-width="2"/><line x1="460" y1="49" x2="460" y2="140" stroke="#17292d" stroke-width="2"/><rect x="125" y="140" width="70" height="30" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="160" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">AP 1</text><rect x="425" y="140" width="70" height="30" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="460" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">AP 2</text><line x1="160" y1="170" x2="95" y2="193" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><circle cx="95" cy="205" r="12" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="95" y="206" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><line x1="160" y1="170" x2="160" y2="210" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><circle cx="160" cy="222" r="12" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="160" y="223" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><line x1="160" y1="170" x2="225" y2="193" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><circle cx="225" cy="205" r="12" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="225" y="206" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><line x1="460" y1="170" x2="395" y2="193" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><circle cx="395" cy="205" r="12" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="395" y="206" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><line x1="460" y1="170" x2="460" y2="210" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><circle cx="460" cy="222" r="12" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="460" y="223" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><line x1="460" y1="170" x2="525" y2="193" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><circle cx="525" cy="205" r="12" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="525" y="206" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><text x="310" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">ESS = BSS 1 + BSS 2 + distribution system (infrastructure mode)</text><ellipse cx="660" cy="175" rx="80" ry="70" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><text x="660" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Ad hoc (IBSS)</text><circle cx="625" cy="165" r="12" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="625" y="166" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><circle cx="695" cy="165" r="12" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="695" y="166" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><circle cx="660" cy="215" r="12" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="660" y="216" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><line x1="637" y1="165" x2="683" y2="165" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><line x1="630" y1="176" x2="652" y2="205" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><line x1="690" y1="176" x2="668" y2="205" stroke="#08595a" stroke-width="2" stroke-dasharray="4 3"/><text x="660" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">no access point</text><text x="375" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">IEEE 802.11 architecture: BSS with access points, ESS and an ad hoc network (S = station)</text>
</svg>
