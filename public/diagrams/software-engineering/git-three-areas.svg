<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="245" viewBox="0 0 1050 245" role="img" aria-label="Git areas and commands">
<title>Git areas and commands</title>
<rect width="1050" height="245" fill="#ffffff"/>
<rect x="30" y="40" width="180" height="64" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="120" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Working directory</text><text x="120" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">files you edit</text><rect x="300" y="40" width="180" height="64" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="390" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Staging area (index)</text><text x="390" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">changes for the next commit</text><rect x="570" y="40" width="180" height="64" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="660" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Local repository (.git)</text><text x="660" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">committed snapshots</text><rect x="840" y="40" width="180" height="64" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="930" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Remote repository</text><text x="930" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">shared copy (e.g. GitHub)</text><path d="M210,62 L300,62" fill="none" stroke="#17292d" stroke-width="2"/><path d="M300,62 L291.0,66.3 L291.0,57.7 Z" fill="#17292d"/><text x="255" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">git add</text><path d="M480,62 L570,62" fill="none" stroke="#17292d" stroke-width="2"/><path d="M570,62 L561.0,66.3 L561.0,57.7 Z" fill="#17292d"/><text x="525" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">git commit</text><path d="M750,62 L840,62" fill="none" stroke="#17292d" stroke-width="2"/><path d="M840,62 L831.0,66.3 L831.0,57.7 Z" fill="#17292d"/><text x="795" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">git push</text><path d="M840,88 L750,88" fill="none" stroke="#17292d" stroke-width="2"/><path d="M750,88 L759.0,83.7 L759.0,92.3 Z" fill="#17292d"/><text x="795" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">git fetch</text><line x1="660" y1="130" x2="660" y2="150" stroke="#17292d" stroke-width="2" stroke-dasharray="5 4"/><line x1="660" y1="150" x2="135" y2="150" stroke="#17292d" stroke-width="2" stroke-dasharray="5 4"/><path d="M135,150 L135,130" fill="none" stroke="#17292d" stroke-width="2" stroke-dasharray="5 4"/><path d="M135,130 L139.3,139.0 L130.7,139.0 Z" fill="#17292d"/><text x="390" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">git checkout / git switch: bring a commit or branch into the working directory</text><line x1="930" y1="130" x2="930" y2="185" stroke="#17292d" stroke-width="2"/><line x1="930" y1="185" x2="105" y2="185" stroke="#17292d" stroke-width="2"/><path d="M105,185 L105,130" fill="none" stroke="#17292d" stroke-width="2"/><path d="M105,130 L109.3,139.0 L100.7,139.0 Z" fill="#17292d"/><text x="525" y="197" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">git pull = git fetch + merge (or rebase) into the current branch</text><text x="525" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Git moves changes from the working directory to the staging area, the local repository and the remote</text>
</svg>
