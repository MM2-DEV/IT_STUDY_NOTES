<svg xmlns="http://www.w3.org/2000/svg" width="800" height="255" viewBox="0 0 800 255" role="img" aria-label="RAD model">
<title>RAD model</title>
<rect width="800" height="255" fill="#ffffff"/>
<rect x="20" y="90" width="160" height="56" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="100" y="109.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Requirements</text><text x="100" y="126.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">planning</text><rect x="220" y="30" width="380" height="180" rx="4" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="6 5"/><text x="410" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">User design ⇄ construction (repeated)</text><rect x="240" y="90" width="140" height="56" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="310" y="109.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. User design</text><text x="310" y="126.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(prototype)</text><rect x="440" y="90" width="140" height="56" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="510" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Construction</text><path d="M380,108 Q409,94 438,108" fill="none" stroke="#17292d" stroke-width="2"/><path d="M438,108 L428.0,108.0 L431.8,100.2 Z" fill="#17292d"/><path d="M440,130 Q411,144 382,130" fill="none" stroke="#17292d" stroke-width="2"/><path d="M382,130 L392.0,130.0 L388.2,137.8 Z" fill="#17292d"/><text x="410" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">users test the prototype</text><text x="410" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">and give feedback</text><rect x="640" y="90" width="140" height="56" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="710" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Cutover</text><path d="M180,118 L238,118" fill="none" stroke="#17292d" stroke-width="2"/><path d="M238,118 L229.0,122.3 L229.0,113.7 Z" fill="#17292d"/><path d="M600,118 L638,118" fill="none" stroke="#17292d" stroke-width="2"/><path d="M638,118 L629.0,122.3 L629.0,113.7 Z" fill="#17292d"/><text x="400" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">RAD model (James Martin): rapid, time-boxed prototyping with continuous user feedback</text>
</svg>
