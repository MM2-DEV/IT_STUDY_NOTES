<svg xmlns="http://www.w3.org/2000/svg" width="880" height="425" viewBox="0 0 880 425" role="img" aria-label="McCall's software quality model">
<title>McCall's software quality model</title>
<rect width="880" height="425" fill="#ffffff"/>
<rect x="310" y="20" width="260" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="440" y="45" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">McCall's quality factors (11)</text><path d="M440,70 L150,108" fill="none" stroke="#17292d" stroke-width="2"/><path d="M150,108 L158.4,102.5 L159.5,111.1 Z" fill="#17292d"/><rect x="40" y="110" width="220" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="150" y="126.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Product revision</text><text x="150" y="143.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(ability to change)</text><rect x="70" y="180" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="150" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Maintainability</text><rect x="70" y="222" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="150" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Flexibility</text><rect x="70" y="264" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="150" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Testability</text><line x1="55" y1="160" x2="55" y2="280" stroke="#4b6166" stroke-width="2"/><line x1="55" y1="196" x2="70" y2="196" stroke="#4b6166" stroke-width="2"/><line x1="55" y1="238" x2="70" y2="238" stroke="#4b6166" stroke-width="2"/><line x1="55" y1="280" x2="70" y2="280" stroke="#4b6166" stroke-width="2"/><path d="M440,70 L440,108" fill="none" stroke="#17292d" stroke-width="2"/><path d="M440,108 L435.7,99.0 L444.3,99.0 Z" fill="#17292d"/><rect x="330" y="110" width="220" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="440" y="126.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Product operation</text><text x="440" y="143.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(operational use)</text><rect x="360" y="180" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="440" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Correctness</text><rect x="360" y="222" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="440" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Reliability</text><rect x="360" y="264" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="440" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Efficiency</text><rect x="360" y="306" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="440" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Integrity</text><rect x="360" y="348" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="440" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Usability</text><line x1="345" y1="160" x2="345" y2="364" stroke="#4b6166" stroke-width="2"/><line x1="345" y1="196" x2="360" y2="196" stroke="#4b6166" stroke-width="2"/><line x1="345" y1="238" x2="360" y2="238" stroke="#4b6166" stroke-width="2"/><line x1="345" y1="280" x2="360" y2="280" stroke="#4b6166" stroke-width="2"/><line x1="345" y1="322" x2="360" y2="322" stroke="#4b6166" stroke-width="2"/><line x1="345" y1="364" x2="360" y2="364" stroke="#4b6166" stroke-width="2"/><path d="M440,70 L730,108" fill="none" stroke="#17292d" stroke-width="2"/><path d="M730,108 L720.5,111.1 L721.6,102.5 Z" fill="#17292d"/><rect x="620" y="110" width="220" height="50" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="730" y="126.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Product transition</text><text x="730" y="143.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(adapt to new environments)</text><rect x="650" y="180" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="730" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Portability</text><rect x="650" y="222" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="730" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Reusability</text><rect x="650" y="264" width="160" height="32" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="730" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Interoperability</text><line x1="635" y1="160" x2="635" y2="280" stroke="#4b6166" stroke-width="2"/><line x1="635" y1="196" x2="650" y2="196" stroke="#4b6166" stroke-width="2"/><line x1="635" y1="238" x2="650" y2="238" stroke="#4b6166" stroke-width="2"/><line x1="635" y1="280" x2="650" y2="280" stroke="#4b6166" stroke-width="2"/><text x="440" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">McCall's model (1977): eleven quality factors in three groups</text>
</svg>
