 x="400" y="338.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Maintenance</text><text x="400" y="355.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">system</text><line x1="400" y1="320" x2="400" y2="225" stroke="#4b6166" stroke-width="2"/><rect x="560" y="300" width="200" height="54" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="660" y="327" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Customer</text><line x1="660" y1="300" x2="500" y2="225" stroke="#4b6166" stroke-width="2"/><rect x="285" y="150" width="230" height="90" rx="4" fill="none" stroke="#08595a" stroke-width="2" stroke-dasharray="6 5"/><text x="400" y="255" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#08595a" text-anchor="middle" dominant-baseline="middle">system boundary</text><text x="400" y="395" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Context model of an ATM system: the system and the external systems and people around it</text>
