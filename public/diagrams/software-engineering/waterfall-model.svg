ont-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Integration and</text><text x="475" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">system testing</text><line x1="570" y1="230" x2="595" y2="230" stroke="#17292d" stroke-width="2"/><path d="M595,230 L595,266" fill="none" stroke="#17292d" stroke-width="2"/><path d="M595,266 L590.7,257.0 L599.3,257.0 Z" fill="#17292d"/><rect x="500" y="268" width="190" height="48" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="595" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Deployment</text><line x1="690" y1="292" x2="715" y2="292" stroke="#17292d" stroke-width="2"/><path d="M715,292 L715,328" fill="none" stroke="#17292d" stroke-width="2"/><path d="M715,328 L710.7,319.0 L719.3,319.0 Z" fill="#17292d"/><rect x="620" y="330" width="190" height="48" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="715" y="354" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Maintenance</text><text x="420" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Waterfall model: each phase starts only after the previous phase is complete</text>
