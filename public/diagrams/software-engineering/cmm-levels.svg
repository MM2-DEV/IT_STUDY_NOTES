<svg xmlns="http://www.w3.org/2000/svg" width="870" height="355" viewBox="0 0 870 355" role="img" aria-label="CMM maturity levels">
<title>CMM maturity levels</title>
<rect width="870" height="355" fill="#ffffff"/>
<rect x="20" y="250" width="190" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="115" y="267" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Initial</text><text x="115" y="283" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ad hoc, chaotic</text><rect x="180" y="200" width="190" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="275" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Repeatable</text><text x="275" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">basic project management</text><rect x="340" y="150" width="190" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="435" y="167" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Defined</text><text x="435" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">standard process</text><rect x="500" y="100" width="190" height="50" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="595" y="117" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Managed</text><text x="595" y="133" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">measured and controlled</text><rect x="660" y="50" width="190" height="50" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="755" y="67" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5. Optimizing</text><text x="755" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">continuous improvement</text><path d="M20,320 L850,320" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M850,320 L841.0,324.3 L841.0,315.7 Z" fill="#4b6166"/><text x="435" y="308" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">increasing process maturity, predictability and quality</text><text x="435" y="343" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The five maturity levels of the SEI Capability Maturity Model (CMM)</text>
</svg>
