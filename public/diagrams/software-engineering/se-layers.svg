<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" role="img" aria-label="Software engineering layers">
<title>Software engineering layers</title>
<rect width="700" height="290" fill="#ffffff"/>
<rect x="60" y="30" width="420" height="48" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="270" y="54" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Tools</text><rect x="60" y="85" width="420" height="48" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="270" y="109" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Methods</text><rect x="60" y="140" width="420" height="48" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="270" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Process</text><rect x="60" y="195" width="420" height="48" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="270" y="219" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A quality focus</text><path d="M530,240 L530,40" fill="none" stroke="#17292d" stroke-width="2"/><path d="M530,40 L534.3,49.0 L525.7,49.0 Z" fill="#17292d"/><text x="545" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">each layer rests on</text><text x="545" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">the layer below it</text><text x="350" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Software engineering as a layered technology (Pressman): quality focus is the bedrock</text>
