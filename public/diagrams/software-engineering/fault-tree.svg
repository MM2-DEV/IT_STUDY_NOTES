<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-label="Fault tree">
<title>Fault tree</title>
<rect width="860" height="390" fill="#ffffff"/>
<rect x="250" y="20" width="300" height="48" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="400" y="36" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Incorrect insulin dose given</text><text x="400" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(top event / hazard)</text><line x1="400" y1="68" x2="400" y2="88" stroke="#17292d" stroke-width="2"/><path d="M374,130 Q400,116 426,130 Q422,100 400,88 Q378,100 374,130 Z" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="400" y="114" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">OR</text><line x1="400" y1="130" x2="120" y2="160" stroke="#17292d" stroke-width="2"/><rect x="20" y="162" width="200" height="48" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="120" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Incorrect sugar</text><text x="120" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">level measured</text><line x1="400" y1="130" x2="400" y2="160" stroke="#17292d" stroke-width="2"/><rect x="300" y="162" width="200" height="48" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="400" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Correct dose</text><text x="400" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">delivered at wrong time</text><line x1="400" y1="130" x2="680" y2="160" stroke="#17292d" stroke-width="2"/><rect x="580" y="162" width="200" height="48" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="680" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Delivery system</text><text x="680" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">failure</text><line x1="120" y1="210" x2="120" y2="228" stroke="#17292d" stroke-width="2"/><path d="M94,270 Q120,256 146,270 Q142,240 120,228 Q98,240 94,270 Z" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="120" y="254" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">OR</text><line x1="120" y1="270" x2="80" y2="300" stroke="#17292d" stroke-width="2"/><rect x="5" y="302" width="150" height="46" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="80" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sensor</text><text x="80" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">failure</text><line x1="120" y1="270" x2="240" y2="300" stroke="#17292d" stroke-width="2"/><rect x="165" y="302" width="150" height="46" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="240" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sugar computation</text><text x="240" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">error</text><line x1="680" y1="210" x2="680" y2="228" stroke="#17292d" stroke-width="2"/><path d="M654,270 Q680,256 706,270 Q702,240 680,228 Q658,240 654,270 Z" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="680" y="254" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">OR</text><line x1="680" y1="270" x2="600" y2="300" stroke="#17292d" stroke-width="2"/><rect x="530" y="302" width="140" height="46" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="600" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Pump signals</text><text x="600" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">incorrect</text><line x1="680" y1="270" x2="760" y2="300" stroke="#17292d" stroke-width="2"/><rect x="690" y="302" width="140" height="46" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="760" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Timer</text><text x="760" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">failure</text><text x="430" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Part of a fault tree for an insulin pump: the hazard is traced down to the possible causes through OR gates</text>
</svg>
