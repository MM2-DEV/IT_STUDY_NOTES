<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-label="SOAP message structure">
<title>SOAP message structure</title>
<rect width="480" height="310" fill="#ffffff"/>
<rect x="40" y="20" width="400" height="250" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="60" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">SOAP Envelope (required, root element)</text><rect x="70" y="60" width="340" height="60" rx="4" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="90" y="85" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Header (optional)</text><text x="90" y="105" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">authentication, transaction ID …</text><rect x="70" y="135" width="340" height="120" rx="4" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="90" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Body (required)</text><text x="90" y="176" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">the actual request or response data</text><rect x="100" y="190" width="280" height="50" rx="4" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="120" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Fault (optional, inside Body)</text><text x="120" y="230" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">error information</text><text x="240" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Structure of a SOAP message</text>
</svg>
