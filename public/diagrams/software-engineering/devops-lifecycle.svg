<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" role="img" aria-label="DevOps lifecycle">
<title>DevOps lifecycle</title>
<rect width="700" height="290" fill="#ffffff"/>
<path d="M230,55 C90,55 90,245 230,245 C350,245 350,55 470,55 C610,55 610,245 470,245 C350,245 350,55 230,55 Z" fill="none" stroke="#08595a" stroke-width="22" stroke-opacity="0.22"/><text x="190" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Dev</text><text x="510" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Ops</text><rect x="118" y="50" width="84" height="30" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="160" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Plan</text><rect x="243" y="50" width="84" height="30" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="285" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Code</text><rect x="243" y="220" width="84" height="30" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="285" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Build</text><rect x="118" y="220" width="84" height="30" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="160" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Test</text><rect x="373" y="50" width="84" height="30" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="415" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Release</text><rect x="498" y="50" width="84" height="30" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="540" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Deploy</text><rect x="498" y="220" width="84" height="30" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="540" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Operate</text><rect x="373" y="220" width="84" height="30" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="415" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Monitor</text><text x="350" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The DevOps lifecycle: a continuous loop of Plan, Code, Build, Test, Release, Deploy, Operate and Monitor</text>
</svg>
