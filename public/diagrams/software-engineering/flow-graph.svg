t-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4</text><circle cx="200" cy="360" r="20" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="200" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5</text><circle cx="70" cy="120" r="20" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="70" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">6</text><text x="168" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">R1</text><text x="290" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">R2</text><text x="420" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">R3 (outside)</text><text x="520" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">1: i = 0, c = 0</text><text x="520" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">2: while (i &lt; n)</text><text x="520" y="94" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">3: if (a[i] > 0)</text><text x="520" y="116" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">4: c++</text><text x="520" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">5: i++</text><text x="520" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">6: return c</text><text x="520" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">E = 7 edges, N = 6 nodes</text><text x="520" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">V(G) = E − N + 2 = 7 − 6 + 2 = 3</text><text x="520" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Decisions (nodes 2, 3) + 1 = 3</text><text x="520" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Regions R1, R2, R3 = 3</text><text x="410" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Control flow graph of count_positive(): cyclomatic complexity 3 by all three methods</text>
