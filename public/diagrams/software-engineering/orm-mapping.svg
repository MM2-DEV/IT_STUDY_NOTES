<svg xmlns="http://www.w3.org/2000/svg" width="820" height="275" viewBox="0 0 820 275" role="img" aria-label="Object-relational mapping">
<title>Object-relational mapping</title>
<rect width="820" height="275" fill="#ffffff"/>
<rect x="20" y="30" width="220" height="150" rx="4" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="130" y="54" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">class Student</text><line x1="20" y1="66" x2="240" y2="66" stroke="#17292d" stroke-width="2"/><text x="36" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">int Id</text><text x="36" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">string Name</text><text x="36" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">double Cgpa</text><text x="130" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">object: new Student(1, "Rahim", 3.75)</text><rect x="300" y="70" width="160" height="70" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="380" y="97" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ORM</text><text x="380" y="113" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(e.g. Entity Framework)</text><path d="M240,92 L298,92" fill="none" stroke="#17292d" stroke-width="2"/><path d="M298,92 L289.0,96.3 L289.0,87.7 Z" fill="#17292d"/><text x="269" y="82" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">save</text><path d="M298,120 L240,120" fill="none" stroke="#17292d" stroke-width="2"/><path d="M240,120 L249.0,115.7 L249.0,124.3 Z" fill="#17292d"/><text x="269" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">load</text><path d="M460,92 L588,92" fill="none" stroke="#17292d" stroke-width="2"/><path d="M588,92 L579.0,96.3 L579.0,87.7 Z" fill="#17292d"/><text x="524" y="82" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">INSERT / UPDATE</text><path d="M588,120 L460,120" fill="none" stroke="#17292d" stroke-width="2"/><path d="M460,120 L469.0,115.7 L469.0,124.3 Z" fill="#17292d"/><text x="524" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">SELECT</text><rect x="590" y="62" width="50" height="30" rx="0" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="615" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Id</text><rect x="640" y="62" width="90" height="30" rx="0" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="685" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Name</text><rect x="730" y="62" width="70" height="30" rx="0" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="765" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Cgpa</text><rect x="590" y="92" width="50" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="615" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><rect x="640" y="92" width="90" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="685" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Rahim</text><rect x="730" y="92" width="70" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="765" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3.75</text><rect x="590" y="122" width="50" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="615" y="142" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2</text><rect x="640" y="122" width="90" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="685" y="142" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Karim</text><rect x="730" y="122" width="70" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="765" y="142" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3.40</text><text x="695" y="52" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">table Students</text><text x="400" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">class → table, property → column, object → row</text><text x="410" y="263" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Object-relational mapping: the ORM converts objects to table rows and back</text>
</svg>
