<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="E-commerce transaction">
<title>E-commerce transaction</title>
<rect width="860" height="300" fill="#ffffff"/>
<rect x="20" y="40" width="150" height="60" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="95" y="61.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Customer</text><text x="95" y="78.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(browser / app)</text><rect x="300" y="40" width="170" height="60" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="385" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Online store</text><text x="385" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(website, catalog, cart)</text><rect x="600" y="40" width="170" height="60" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="685" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Payment gateway</text><rect x="600" y="200" width="170" height="60" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="685" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Banks</text><text x="685" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(customer's and merchant's)</text><rect x="300" y="200" width="170" height="60" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="385" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Order processing</text><text x="385" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">and warehouse</text><rect x="20" y="200" width="150" height="60" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="95" y="221.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Delivery</text><text x="95" y="238.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(courier)</text><path d="M170,60 L298,60" fill="none" stroke="#17292d" stroke-width="2"/><path d="M298,60 L289.0,64.3 L289.0,55.7 Z" fill="#17292d"/><text x="234" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">1. browse, order</text><path d="M470,60 L598,60" fill="none" stroke="#17292d" stroke-width="2"/><path d="M598,60 L589.0,64.3 L589.0,55.7 Z" fill="#17292d"/><text x="534" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">2. pay</text><path d="M670,100 L670,198" fill="none" stroke="#17292d" stroke-width="2"/><path d="M670,198 L665.7,189.0 L674.3,189.0 Z" fill="#17292d"/><text x="664" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="end" dominant-baseline="middle">3. authorize</text><path d="M720,198 L720,100" fill="none" stroke="#17292d" stroke-width="2"/><path d="M720,100 L724.3,109.0 L715.7,109.0 Z" fill="#17292d"/><text x="726" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="start" dominant-baseline="middle">4. approved</text><path d="M598,85 L472,85" fill="none" stroke="#17292d" stroke-width="2"/><path d="M472,85 L481.0,80.7 L481.0,89.3 Z" fill="#17292d"/><text x="534" y="100" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">5. confirmed</text><path d="M385,100 L385,198" fill="none" stroke="#17292d" stroke-width="2"/><path d="M385,198 L380.7,189.0 L389.3,189.0 Z" fill="#17292d"/><text x="391" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="start" dominant-baseline="middle">6. fulfil order</text><path d="M300,230 L172,230" fill="none" stroke="#17292d" stroke-width="2"/><path d="M172,230 L181.0,225.7 L181.0,234.3 Z" fill="#17292d"/><text x="236" y="220" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">7. ship</text><path d="M95,200 L95,102" fill="none" stroke="#17292d" stroke-width="2"/><path d="M95,102 L99.3,111.0 L90.7,111.0 Z" fill="#17292d"/><text x="101" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="start" dominant-baseline="middle">8. deliver</text><text x="430" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Steps of an online (B2C) e-commerce transaction</text>
</svg>
