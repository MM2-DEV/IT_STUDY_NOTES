ill="none" stroke="#17292d" stroke-width="2"/><path d="M150,132 L159.0,127.7 L159.0,136.3 Z" fill="#17292d"/><text x="214" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">HTTP response</text><path d="M430,108 L558,108" fill="none" stroke="#17292d" stroke-width="2"/><path d="M558,108 L549.0,112.3 L549.0,103.7 Z" fill="#17292d"/><text x="494" y="96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">dynamic request</text><path d="M558,132 L430,132" fill="none" stroke="#17292d" stroke-width="2"/><path d="M430,132 L439.0,127.7 L439.0,136.3 Z" fill="#17292d"/><text x="494" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">generated page</text><path d="M710,108 L838,108" fill="none" stroke="#17292d" stroke-width="2"/><path d="M838,108 L829.0,112.3 L829.0,103.7 Z" fill="#17292d"/><text x="774" y="96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">query</text><path d="M838,132 L710,132" fill="none" stroke="#17292d" stroke-width="2"/><path d="M710,132 L719.0,127.7 L719.0,136.3 Z" fill="#17292d"/><text x="774" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">data</text><text x="355" y="185" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">serves static files</text><text x="355" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">(HTML, CSS, images)</text><text x="635" y="185" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">runs business logic,</text><text x="635" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">transactions, security</text><text x="490" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">A static request is answered by the web server; a dynamic request goes on to the application server and database</text>
</svg>
