200" y="210" width="150" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="275" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Version 3</text><line x1="120" y1="150" x2="160" y2="150" stroke="#17292d" stroke-width="2"/><line x1="160" y1="150" x2="160" y2="235" stroke="#17292d" stroke-width="2"/><path d="M160,235 L198,235" fill="none" stroke="#17292d" stroke-width="2"/><path d="M198,235 L189.0,239.3 L189.0,230.7 Z" fill="#17292d"/><line x1="350" y1="235" x2="400" y2="235" stroke="#17292d" stroke-width="2"/><line x1="400" y1="235" x2="400" y2="150" stroke="#17292d" stroke-width="2"/><path d="M400,150 L438,150" fill="none" stroke="#17292d" stroke-width="2"/><path d="M438,150 L429.0,154.3 L429.0,145.7 Z" fill="#17292d"/><rect x="440" y="120" width="150" height="60" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="515" y="141.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Output selector</text><text x="515" y="158.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(majority vote)</text><path d="M590,150 L660,150" fill="none" stroke="#17292d" stroke-width="2"/><path d="M660,150 L651.0,154.3 L651.0,145.7 Z" fill="#17292d"/><rect x="662" y="125" width="110" height="50" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="717" y="141.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Agreed</text><text x="717" y="158.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">result</text><text x="275" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">developed independently by different teams; run in parallel</text><text x="395" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">N-version programming: independently developed versions run in parallel and a voter selects the majority result</text>
