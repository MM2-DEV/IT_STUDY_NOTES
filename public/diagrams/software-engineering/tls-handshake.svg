<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-label="TLS handshake">
<title>TLS handshake</title>
<rect width="800" height="440" fill="#ffffff"/>
<rect x="60" y="20" width="180" height="44" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="150" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client (browser)</text><rect x="560" y="20" width="180" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="650" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Server (web site)</text><line x1="150" y1="64" x2="150" y2="400" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 5"/><line x1="650" y1="64" x2="650" y2="400" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 5"/><path d="M152,95 L648,95" fill="none" stroke="#17292d" stroke-width="2"/><path d="M648,95 L639.0,99.3 L639.0,90.7 Z" fill="#17292d"/><text x="400" y="89" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. ClientHello: TLS versions, cipher suites, random number</text><path d="M648,131 L152,131" fill="none" stroke="#17292d" stroke-width="2"/><path d="M152,131 L161.0,126.7 L161.0,135.3 Z" fill="#17292d"/><text x="400" y="125" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. ServerHello: chosen version and cipher suite, random number</text><path d="M648,167 L152,167" fill="none" stroke="#17292d" stroke-width="2"/><path d="M152,167 L161.0,162.7 L161.0,171.3 Z" fill="#17292d"/><text x="400" y="161" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Certificate: server's digital certificate (with public key)</text><text x="400" y="203" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">4. Client verifies the certificate with the CA's public key</text><path d="M152,239 L648,239" fill="none" stroke="#17292d" stroke-width="2"/><path d="M648,239 L639.0,243.3 L639.0,234.7 Z" fill="#17292d"/><text x="400" y="233" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5. Key exchange: pre-master secret (encrypted with server's public key) or Diffie-Hellman</text><text x="400" y="275" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">6. Both sides compute the same symmetric session key</text><path d="M152,311 L648,311" fill="none" stroke="#17292d" stroke-width="2"/><path d="M648,311 L639.0,315.3 L639.0,306.7 Z" fill="#17292d"/><text x="400" y="305" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">7. Finished (encrypted)</text><path d="M648,347 L152,347" fill="none" stroke="#17292d" stroke-width="2"/><path d="M152,347 L161.0,342.7 L161.0,351.3 Z" fill="#17292d"/><text x="400" y="341" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">8. Finished (encrypted)</text><path d="M152,383 L648,383" fill="none" stroke="#08595a" stroke-width="2"/><path d="M648,383 L639.0,387.3 L639.0,378.7 Z" fill="#08595a"/><path d="M648,391 L152,391" fill="none" stroke="#08595a" stroke-width="2"/><path d="M152,391 L161.0,386.7 L161.0,395.3 Z" fill="#08595a"/><text x="400" y="377" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">9. Application data encrypted with the session key</text><text x="400" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Simplified SSL/TLS handshake: authenticate the server, agree on a session key, then encrypt</text>
</svg>
