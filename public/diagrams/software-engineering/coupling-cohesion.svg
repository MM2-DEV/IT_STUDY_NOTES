<svg xmlns="http://www.w3.org/2000/svg" width="900" height="295" viewBox="0 0 900 295" role="img" aria-label="Types of cohesion and coupling">
<title>Types of cohesion and coupling</title>
<rect width="900" height="295" fill="#ffffff"/>
<text x="20" y="18" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Cohesion (strength inside a module)</text><rect x="20" y="40" width="116.85714285714286" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="78.42857142857143" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Functional</text><rect x="142.85714285714286" y="40" width="116.85714285714286" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="201.28571428571428" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sequential</text><rect x="265.7142857142857" y="40" width="116.85714285714286" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="324.14285714285717" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Communicational</text><rect x="388.57142857142856" y="40" width="116.85714285714286" height="40" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="447" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Procedural</text><rect x="511.42857142857144" y="40" width="116.85714285714286" height="40" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="569.8571428571429" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Temporal</text><rect x="634.2857142857143" y="40" width="116.85714285714286" height="40" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="692.7142857142858" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Logical</text><rect x="757.1428571428571" y="40" width="116.85714285714286" height="40" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="815.5714285714286" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Coincidental</text><path d="M20,102 L874,102" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M874,102 L865.0,106.3 L865.0,97.7 Z" fill="#4b6166"/><text x="20" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">best (high cohesion)</text><text x="874" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">worst (low cohesion)</text><text x="20" y="158" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Coupling (dependence between modules)</text><rect x="20" y="180" width="137.33333333333334" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="88.66666666666667" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data</text><rect x="163.33333333333334" y="180" width="137.33333333333334" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="232" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Stamp</text><rect x="306.6666666666667" y="180" width="137.33333333333334" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="375.33333333333337" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Control</text><rect x="450" y="180" width="137.33333333333334" height="40" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="518.6666666666666" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">External</text><rect x="593.3333333333334" y="180" width="137.33333333333334" height="40" rx="6" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="662" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Common</text><rect x="736.6666666666667" y="180" width="137.33333333333334" height="40" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="805.3333333333334" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Content</text><path d="M20,242 L874,242" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M874,242 L865.0,246.3 L865.0,237.7 Z" fill="#4b6166"/><text x="20" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">best (low coupling)</text><text x="874" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">worst (high coupling)</text><text x="450" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Good modular design: high cohesion and low coupling</text>
</svg>
