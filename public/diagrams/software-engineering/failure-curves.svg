<svg xmlns="http://www.w3.org/2000/svg" width="880" height="315" viewBox="0 0 880 315" role="img" aria-label="Failure curves for hardware and software">
<title>Failure curves for hardware and software</title>
<rect width="880" height="315" fill="#ffffff"/>
<path d="M50,250 L50,40" fill="none" stroke="#17292d" stroke-width="2"/><path d="M50,40 L54.3,49.0 L45.7,49.0 Z" fill="#17292d"/><path d="M50,250 L390,250" fill="none" stroke="#17292d" stroke-width="2"/><path d="M390,250 L381.0,254.3 L381.0,245.7 Z" fill="#17292d"/><text transform="rotate(-90 36 145)" x="36" y="145" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Failure rate</text><text x="220" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Time</text><text x="220" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(a) Hardware: bathtub curve</text><path d="M55,70 Q80,215 120,215 L300,215 Q360,215 385,80" fill="none" stroke="#08595a" stroke-width="3"/><text x="118" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">infant</text><text x="118" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">mortality</text><text x="210" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">useful life</text><text x="345" y="120" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">wear out</text><path d="M470,250 L470,40" fill="none" stroke="#17292d" stroke-width="2"/><path d="M470,40 L474.3,49.0 L465.7,49.0 Z" fill="#17292d"/><path d="M470,250 L850,250" fill="none" stroke="#17292d" stroke-width="2"/><path d="M850,250 L841.0,254.3 L841.0,245.7 Z" fill="#17292d"/><text transform="rotate(-90 456 145)" x="456" y="145" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Failure rate</text><text x="660" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Time</text><text x="660" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(b) Software: idealized and actual curves</text><path d="M475,70 Q500,215 540,215 L840,215" fill="none" stroke="#4b6166" stroke-width="2" stroke-dasharray="6 5"/><path d="M475,70 Q500,200 540,200 L600,200 L610,140 Q625,185 650,185 L700,185 L710,120 Q725,170 750,170 L790,170 L800,105 Q815,155 840,155" fill="none" stroke="#c0392b" stroke-width="3"/><text x="835" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">idealized curve</text><text x="705" y="100" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">change</text><text x="780" y="95" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#c0392b" text-anchor="start" dominant-baseline="middle">actual curve</text><text x="440" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Hardware wears out; software does not wear out but deteriorates as changes introduce new defects</text>
</svg>
