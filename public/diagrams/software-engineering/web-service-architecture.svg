<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-label="Web service architecture">
<title>Web service architecture</title>
<rect width="820" height="330" fill="#ffffff"/>
<rect x="310" y="20" width="200" height="60" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="410" y="41.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Service registry</text><text x="410" y="58.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(UDDI)</text><rect x="40" y="220" width="200" height="60" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="140" y="241.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Service requestor</text><text x="140" y="258.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(client)</text><rect x="580" y="220" width="200" height="60" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="680" y="241.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Service provider</text><text x="680" y="258.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(hosts the service)</text><path d="M580,225 L470,82" fill="none" stroke="#17292d" stroke-width="2"/><path d="M470,82 L478.9,86.5 L472.0,91.8 Z" fill="#17292d"/><text x="590" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Publish</text><text x="590" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">(WSDL description)</text><path d="M240,225 L350,82" fill="none" stroke="#17292d" stroke-width="2"/><path d="M350,82 L348.0,91.8 L341.1,86.5 Z" fill="#17292d"/><text x="230" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Find</text><text x="230" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">(search for WSDL)</text><path d="M240,240 L578,240" fill="none" stroke="#17292d" stroke-width="2"/><path d="M578,240 L569.0,244.3 L569.0,235.7 Z" fill="#17292d"/><text x="410" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Bind and invoke (SOAP request)</text><path d="M578,264 L240,264" fill="none" stroke="#17292d" stroke-width="2"/><path d="M240,264 L249.0,259.7 L249.0,268.3 Z" fill="#17292d"/><text x="410" y="284" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">SOAP response</text><text x="410" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Web service architecture: three roles and the publish, find and bind operations</text>
</svg>
