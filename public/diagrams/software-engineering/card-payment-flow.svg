<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="275" viewBox="0 0 1060 275" role="img" aria-label="Card payment flow">
<title>Card payment flow</title>
<rect width="1060" height="275" fill="#ffffff"/>
<rect x="20" y="90" width="140" height="64" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="90" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Cardholder</text><text x="90" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(customer)</text><rect x="196" y="90" width="140" height="64" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="266" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Merchant</text><text x="266" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(online store)</text><rect x="372" y="90" width="140" height="64" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="442" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Payment</text><text x="442" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">gateway</text><rect x="548" y="90" width="140" height="64" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="618" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Acquiring bank</text><text x="618" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(merchant's bank)</text><rect x="724" y="90" width="140" height="64" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="794" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Card network</text><text x="794" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(Visa, Mastercard)</text><rect x="900" y="90" width="140" height="64" rx="6" fill="#a9c4eb" stroke="#17292d" stroke-width="2"/><text x="970" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Issuing bank</text><text x="970" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(customer's bank)</text><path d="M160,110 L194,110" fill="none" stroke="#17292d" stroke-width="2"/><path d="M194,110 L185.0,114.3 L185.0,105.7 Z" fill="#17292d"/><path d="M194,134 L162,134" fill="none" stroke="#17292d" stroke-width="2"/><path d="M162,134 L171.0,129.7 L171.0,138.3 Z" fill="#17292d"/><path d="M336,110 L370,110" fill="none" stroke="#17292d" stroke-width="2"/><path d="M370,110 L361.0,114.3 L361.0,105.7 Z" fill="#17292d"/><path d="M370,134 L338,134" fill="none" stroke="#17292d" stroke-width="2"/><path d="M338,134 L347.0,129.7 L347.0,138.3 Z" fill="#17292d"/><path d="M512,110 L546,110" fill="none" stroke="#17292d" stroke-width="2"/><path d="M546,110 L537.0,114.3 L537.0,105.7 Z" fill="#17292d"/><path d="M546,134 L514,134" fill="none" stroke="#17292d" stroke-width="2"/><path d="M514,134 L523.0,129.7 L523.0,138.3 Z" fill="#17292d"/><path d="M688,110 L722,110" fill="none" stroke="#17292d" stroke-width="2"/><path d="M722,110 L713.0,114.3 L713.0,105.7 Z" fill="#17292d"/><path d="M722,134 L690,134" fill="none" stroke="#17292d" stroke-width="2"/><path d="M690,134 L699.0,129.7 L699.0,138.3 Z" fill="#17292d"/><path d="M864,110 L898,110" fill="none" stroke="#17292d" stroke-width="2"/><path d="M898,110 L889.0,114.3 L889.0,105.7 Z" fill="#17292d"/><path d="M898,134 L866,134" fill="none" stroke="#17292d" stroke-width="2"/><path d="M866,134 L875.0,129.7 L875.0,138.3 Z" fill="#17292d"/><path d="M30,60 L1030,60" fill="none" stroke="#08595a" stroke-width="2"/><path d="M1030,60 L1021.0,64.3 L1021.0,55.7 Z" fill="#08595a"/><text x="530" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">1–5. card details and authorization request travel to the issuing bank</text><path d="M1030,184 L30,184" fill="none" stroke="#08595a" stroke-width="2"/><path d="M30,184 L39.0,179.7 L39.0,188.3 Z" fill="#08595a"/><text x="530" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">6–10. approved or declined response travels back to the customer</text><text x="530" y="234" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Later, in settlement, the issuing bank pays the acquiring bank through the card network, and the acquiring bank credits the merchant (less fees).</text><text x="530" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Card payment through a payment gateway: authorization and settlement</text>
</svg>
