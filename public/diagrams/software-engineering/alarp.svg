<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="Risk triangle (ALARP)">
<title>Risk triangle (ALARP)</title>
<rect width="760" height="360" fill="#ffffff"/>
<polygon points="330,30 260,110 400,110" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><polygon points="260,110 400,110 490,215 170,215" fill="#dbda65" stroke="#17292d" stroke-width="2"/><polygon points="170,215 490,215 580,320 80,320" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="330" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Unacceptable</text><text x="330" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ALARP region</text><text x="330" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Acceptable region</text><text x="450" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">risk cannot be tolerated</text><text x="535" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">tolerated only if risk reduction</text><text x="535" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">is impractical or very costly</text><text x="620" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">negligible risk</text><text x="380" y="345" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The risk triangle: risks are classified as unacceptable, ALARP (as low as reasonably practicable) or acceptable</text>
</svg>
