<svg xmlns="http://www.w3.org/2000/svg" width="770" height="270" viewBox="0 0 770 270" role="img" aria-label="Recovery block">
<title>Recovery block</title>
<rect width="770" height="270" fill="#ffffff"/>
<rect x="20" y="40" width="120" height="50" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="80" y="57" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Save state</text><text x="80" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(checkpoint)</text><rect x="200" y="40" width="140" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="270" y="57" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Run primary</text><text x="270" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">algorithm</text><rect x="400" y="40" width="140" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="470" y="57" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Acceptance</text><text x="470" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">test</text><rect x="620" y="40" width="130" height="50" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="685" y="57" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Continue with</text><text x="685" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">result</text><path d="M140,65 L198,65" fill="none" stroke="#17292d" stroke-width="2"/><path d="M198,65 L189.0,69.3 L189.0,60.7 Z" fill="#17292d"/><path d="M340,65 L398,65" fill="none" stroke="#17292d" stroke-width="2"/><path d="M398,65 L389.0,69.3 L389.0,60.7 Z" fill="#17292d"/><path d="M540,65 L618,65" fill="none" stroke="#17292d" stroke-width="2"/><path d="M618,65 L609.0,69.3 L609.0,60.7 Z" fill="#17292d"/><text x="579" y="54" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">pass</text><rect x="400" y="170" width="140" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="470" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Restore state;</text><text x="470" y="203" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">try next alternate</text><path d="M470,90 L470,168" fill="none" stroke="#17292d" stroke-width="2"/><path d="M470,168 L465.7,159.0 L474.3,159.0 Z" fill="#17292d"/><text x="488" y="129" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">fail</text><line x1="400" y1="195" x2="270" y2="195" stroke="#17292d" stroke-width="2"/><path d="M270,195 L270,92" fill="none" stroke="#17292d" stroke-width="2"/><path d="M270,92 L274.3,101.0 L265.7,101.0 Z" fill="#17292d"/><text x="278" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="start" dominant-baseline="middle">alternate algorithm</text><rect x="620" y="170" width="130" height="50" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="685" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">All alternates</text><text x="685" y="203" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">failed: exception</text><path d="M540,205 L618,205" fill="none" stroke="#17292d" stroke-width="2"/><path d="M618,205 L609.0,209.3 L609.0,200.7 Z" fill="#17292d"/><text x="385" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Recovery block: the alternates are tried one after another until one passes the acceptance test</text>
</svg>
