<svg xmlns="http://www.w3.org/2000/svg" width="850" height="355" viewBox="0 0 850 355" role="img" aria-label="CSS box model">
<title>CSS box model</title>
<rect width="850" height="355" fill="#ffffff"/>
<rect x="40" y="30" width="560" height="290" rx="4" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="6 5"/><text x="60" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="start" dominant-baseline="middle">Margin (transparent, outside the border)</text><rect x="90" y="70" width="460" height="210" rx="4" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="110" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Border</text><rect x="120" y="100" width="400" height="150" rx="4" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="140" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Padding (space inside the border)</text><rect x="180" y="140" width="280" height="70" rx="4" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="320" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Content (width × height)</text><text x="640" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Total width =</text><text x="640" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">border + padding + width</text><text x="640" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">+ padding + border</text><text x="640" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">Example: 10 + 15 + 400</text><text x="640" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">+ 15 + 10 = 450 px</text><text x="425" y="342" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">CSS box model: content, padding, border and margin</text>
</svg>
