<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-label="E-commerce business models">
<title>E-commerce business models</title>
<rect width="800" height="320" fill="#ffffff"/>
<text x="480" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Buyer / receiver</text><text x="40" y="175" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" transform="rotate(-90 40 175)">Seller / provider</text><text x="280" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Business</text><text x="168" y="110" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">Business</text><text x="480" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Consumer</text><text x="168" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">Consumer</text><text x="680" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Government</text><text x="168" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">Government</text><rect x="180" y="70" width="200" height="70" rx="0" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="280" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B2B</text><text x="280" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Alibaba.com</text><rect x="380" y="70" width="200" height="70" rx="0" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="480" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B2C</text><text x="480" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Amazon, Daraz</text><rect x="580" y="70" width="200" height="70" rx="0" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="680" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B2G</text><text x="680" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">e-procurement, tenders</text><rect x="180" y="140" width="200" height="70" rx="0" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="280" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C2B</text><text x="280" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">freelancers, reviews</text><rect x="380" y="140" width="200" height="70" rx="0" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="480" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C2C</text><text x="480" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">eBay, Bikroy</text><rect x="580" y="140" width="200" height="70" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="680" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C2G</text><text x="680" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">online tax, bill payment</text><rect x="180" y="210" width="200" height="70" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="280" y="240" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">G2B</text><text x="280" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">licences, tenders</text><rect x="380" y="210" width="200" height="70" rx="0" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="480" y="240" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">G2C</text><text x="480" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">birth registration, passport</text><rect x="580" y="210" width="200" height="70" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="680" y="240" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">G2G</text><text x="680" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">shared databases</text><text x="400" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">E-commerce models named by seller (row) and buyer (column); shaded cells are the main models</text>
</svg>
