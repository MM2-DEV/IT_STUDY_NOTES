<svg xmlns="http://www.w3.org/2000/svg" width="950" height="285" viewBox="0 0 950 285" role="img" aria-label="Public-key encryption">
<title>Public-key encryption</title>
<rect width="950" height="285" fill="#ffffff"/>
<rect x="20" y="70" width="120" height="56" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="80" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Plaintext</text><text x="80" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">"Pay Tk 500"</text><rect x="210" y="70" width="130" height="56" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="275" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Encrypt</text><rect x="410" y="70" width="130" height="56" rx="6" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="475" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Ciphertext</text><text x="475" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">"x9#Lq@…"</text><rect x="610" y="70" width="130" height="56" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="675" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Decrypt</text><rect x="810" y="70" width="120" height="56" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="870" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Plaintext</text><text x="870" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">"Pay Tk 500"</text><path d="M140,98 L208,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M208,98 L199.0,102.3 L199.0,93.7 Z" fill="#17292d"/><path d="M340,98 L408,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M408,98 L399.0,102.3 L399.0,93.7 Z" fill="#17292d"/><path d="M540,98 L608,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M608,98 L599.0,102.3 L599.0,93.7 Z" fill="#17292d"/><path d="M740,98 L808,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M808,98 L799.0,102.3 L799.0,93.7 Z" fill="#17292d"/><rect x="195" y="175" width="160" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="275" y="197" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receiver's PUBLIC key</text><path d="M275,175 L275,128" fill="none" stroke="#17292d" stroke-width="2"/><path d="M275,128 L279.3,137.0 L270.7,137.0 Z" fill="#17292d"/><rect x="595" y="175" width="160" height="44" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="675" y="197" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receiver's PRIVATE key</text><path d="M675,175 L675,128" fill="none" stroke="#17292d" stroke-width="2"/><path d="M675,128 L679.3,137.0 L670.7,137.0 Z" fill="#17292d"/><text x="80" y="50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sender</text><text x="870" y="50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Receiver</text><text x="475" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">travels over the Internet</text><text x="475" y="245" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Symmetric encryption uses the SAME secret key in both places.</text><text x="475" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Asymmetric (public-key) encryption: encrypt with the receiver's public key, decrypt with its private key</text>
</svg>
