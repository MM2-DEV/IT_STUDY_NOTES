<svg xmlns="http://www.w3.org/2000/svg" width="800" height="345" viewBox="0 0 800 345" role="img" aria-label="Class diagram of a bank system">
<title>Class diagram of a bank system</title>
<rect width="800" height="345" fill="#ffffff"/>
<rect x="300" y="20" width="200" height="120" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><rect x="300" y="20" width="200" height="28" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="400" y="34" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Account</text><line x1="300" y1="94" x2="500" y2="94" stroke="#17292d" stroke-width="2"/><text x="308" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">- accountNo: int</text><text x="308" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">- balance: double</text><text x="308" y="108" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">+ deposit(amount)</text><text x="308" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">+ withdraw(amount)</text><rect x="140" y="230" width="180" height="84" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><rect x="140" y="230" width="180" height="28" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="230" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SavingsAccount</text><line x1="140" y1="286" x2="320" y2="286" stroke="#17292d" stroke-width="2"/><text x="148" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">- interestRate: double</text><text x="148" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">+ addInterest()</text><rect x="480" y="230" width="180" height="84" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><rect x="480" y="230" width="180" height="28" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="570" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">CurrentAccount</text><line x1="480" y1="286" x2="660" y2="286" stroke="#17292d" stroke-width="2"/><text x="488" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">- overdraftLimit: double</text><text x="488" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">+ checkLimit()</text><rect x="20" y="20" width="180" height="102" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><rect x="20" y="20" width="180" height="28" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="110" y="34" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Customer</text><line x1="20" y1="94" x2="200" y2="94" stroke="#17292d" stroke-width="2"/><text x="28" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">- name: String</text><text x="28" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">- phone: String</text><text x="28" y="108" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">+ openAccount()</text><rect x="620" y="20" width="160" height="84" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><rect x="620" y="20" width="160" height="28" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="700" y="34" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bank</text><line x1="620" y1="76" x2="780" y2="76" stroke="#17292d" stroke-width="2"/><text x="628" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">- name: String</text><text x="628" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">+ addAccount()</text><line x1="230" y1="230" x2="230" y2="190" stroke="#17292d" stroke-width="2"/><line x1="230" y1="190" x2="400" y2="190" stroke="#17292d" stroke-width="2"/><line x1="400" y1="190" x2="400" y2="154" stroke="#17292d" stroke-width="2"/><polygon points="400,140 391,154 409,154" fill="#fff" stroke="#17292d" stroke-width="2"/><line x1="570" y1="230" x2="570" y2="190" stroke="#17292d" stroke-width="2"/><line x1="570" y1="190" x2="400" y2="190" stroke="#17292d" stroke-width="2"/><line x1="200" y1="70" x2="300" y2="70" stroke="#17292d" stroke-width="2"/><text x="210" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">1</text><text x="288" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">1..*</text><text x="250" y="86" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">owns</text><line x1="500" y1="70" x2="604" y2="70" stroke="#17292d" stroke-width="2"/><polygon points="620,70 608,63 596,70 608,77" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="512" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">1..*</text><text x="560" y="86" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">has (aggregation)</text><text x="410" y="205" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">generalization (inheritance)</text><text x="400" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Object (class) model: classes with attributes and operations, inheritance, association and aggregation</text>
</svg>
