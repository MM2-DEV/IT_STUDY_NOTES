" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><rect x="642" y="122" width="76" height="36" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="680" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><rect x="412" y="202" width="76" height="36" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="450" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">D</text><rect x="512" y="202" width="76" height="36" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="550" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">E</text><rect x="642" y="202" width="76" height="36" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="680" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">F</text><text x="190" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">start at the top; stubs replace lower modules</text><text x="590" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">start at the bottom; drivers call lower modules</text><text x="390" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Integration testing: stubs stand in for lower modules (top-down); drivers stand in for higher modules (bottom-up)</text>
