#cbadd1" stroke="#17292d" stroke-width="2"/><circle cx="300" cy="200" r="9" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><circle cx="420" cy="200" r="9" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><circle cx="560" cy="200" r="9" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><circle cx="800" cy="200" r="9" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><path d="M139,55 L152,193" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M152,193 L146.8,184.4 L155.5,183.6 Z" fill="#4b6166"/><circle cx="200" cy="250" r="9" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><circle cx="250" cy="250" r="9" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><path d="M166,207 L193,244" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M193,244 L184.2,239.3 L191.2,234.2 Z" fill="#4b6166"/><path d="M258,244 L293,207" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M293,207 L290.0,216.5 L283.7,210.6 Z" fill="#4b6166"/><circle cx="450" cy="150" r="9" fill="#f2b880" stroke="#17292d" stroke-width="2"/><circle cx="490" cy="150" r="9" fill="#f2b880" stroke="#17292d" stroke-width="2"/><path d="M427,194 L444,157" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M444,157 L444.2,167.0 L436.3,163.4 Z" fill="#4b6166"/><path d="M497,144 L513,57" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M513,57 L515.6,66.6 L507.1,65.1 Z" fill="#4b6166"/><path d="M497,156 L553,194" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M553,194 L543.1,192.5 L548.0,185.3 Z" fill="#4b6166"/><circle cx="690" cy="100" r="9" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><path d="M528,55 L682,96" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M682,96 L672.2,97.9 L674.4,89.5 Z" fill="#4b6166"/><path d="M698,96 L752,56" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M752,56 L747.4,64.9 L742.2,57.9 Z" fill="#4b6166"/><path d="M698,106 L792,194" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M792,194 L782.5,191.0 L788.4,184.7 Z" fill="#