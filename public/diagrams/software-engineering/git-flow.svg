<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Git Flow branching model">
<title>Git Flow branching model</title>
<rect width="880" height="300" fill="#ffffff"/>
