<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="MVC request flow">
<title>MVC request flow</title>
<rect width="900" height="330" fill="#ffffff"/>
<rect x="20" y="110" width="110" height="50" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="75" y="126.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">User</text><text x="75" y="143.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(browser)</text><rect x="230" y="110" width="150" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="305" y="135" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Controller</text><rect x="520" y="20" width="170" height="56" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="605" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Model</text><text x="605" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(data, business logic)</text><rect x="520" y="200" width="170" height="56" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="605" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">View</text><text x="605" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(presentation)</text><path d="M130,135 L228,135" fill="none" stroke="#17292d" stroke-width="2"/><path d="M228,135 L219.0,139.3 L219.0,130.7 Z" fill="#17292d"/><text x="179" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">1. request</text><path d="M370,110 L518,50" fill="none" stroke="#17292d" stroke-width="2"/><path d="M518,50 L511.3,57.4 L508.0,49.4 Z" fill="#17292d"/><text x="420" y="62" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">2. update / query</text><path d="M518,66 L382,122" fill="none" stroke="#17292d" stroke-width="2"/><path d="M382,122 L388.7,114.5 L392.0,122.6 Z" fill="#17292d"/><text x="478" y="108" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">3. data</text><path d="M370,160 L518,220" fill="none" stroke="#17292d" stroke-width="2"/><path d="M518,220 L508.0,220.6 L511.3,212.6 Z" fill="#17292d"/><text x="420" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">4. select view,</text><text x="420" y="224" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">pass data</text><line x1="605" y1="256" x2="605" y2="285" stroke="#17292d" stroke-width="2"/><line x1="605" y1="285" x2="75" y2="285" stroke="#17292d" stroke-width="2"/><path d="M75,285 L75,162" fill="none" stroke="#17292d" stroke-width="2"/><path d="M75,162 L79.3,171.0 L70.7,171.0 Z" fill="#17292d"/><text x="340" y="275" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">5. response (HTML page)</text><rect x="760" y="20" width="120" height="56" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="820" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Database</text><path d="M690,40 L758,40" fill="none" stroke="#17292d" stroke-width="2"/><path d="M758,40 L749.0,44.3 L749.0,35.7 Z" fill="#17292d"/><path d="M758,56 L690,56" fill="none" stroke="#17292d" stroke-width="2"/><path d="M690,56 L699.0,51.7 L699.0,60.3 Z" fill="#17292d"/><text x="450" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">MVC web framework: the controller handles the request, uses the model and chooses the view</text>
</svg>
