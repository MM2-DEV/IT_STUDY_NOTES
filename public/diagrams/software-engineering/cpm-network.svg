<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-label="Activity network and critical path">
<title>Activity network and critical path</title>
<rect width="760" height="290" fill="#ffffff"/>
<rect x="20" y="102" width="80" height="40" rx="20" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="60" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Start</text><rect x="135" y="94" width="110" height="56" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="190" y="113.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><text x="190" y="130.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3 days</text><rect x="315" y="22" width="110" height="56" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="370" y="41.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><text x="370" y="58.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2 days</text><rect x="315" y="166" width="110" height="56" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="370" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><text x="370" y="202.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4 days</text><rect x="495" y="94" width="110" height="56" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="550" y="113.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">D</text><text x="550" y="130.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2 days</text><rect x="660" y="102" width="80" height="40" rx="20" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="700" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">End</text><path d="M100,122 L133,122" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M133,122 L124.0,126.3 L124.0,117.7 Z" fill="#c0392b"/><path d="M245,108 L313,62" fill="none" stroke="#17292d" stroke-width="2"/><path d="M313,62 L308.0,70.6 L303.1,63.4 Z" fill="#17292d"/><path d="M245,136 L313,182" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M313,182 L303.1,180.6 L308.0,173.4 Z" fill="#c0392b"/><path d="M425,62 L493,108" fill="none" stroke="#17292d" stroke-width="2"/><path d="M493,108 L483.1,106.6 L488.0,99.4 Z" fill="#17292d"/><path d="M425,182 L493,136" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M493,136 L488.0,144.6 L483.1,137.4 Z" fill="#c0392b"/><path d="M605,122 L658,122" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M658,122 L649.0,126.3 L649.0,117.7 Z" fill="#c0392b"/><text x="380" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Paths: A–B–D = 3 + 2 + 2 = 7 days;  A–C–D = 3 + 4 + 2 = 9 days (critical path, in red)</text><text x="380" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Activity network: the longest path (A–C–D, 9 days) is the critical path</text>
