<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-label="Types of data">
<title>Types of data</title>
<rect width="720" height="275" fill="#ffffff"/>
<rect x="20" y="20" width="210" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="125" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Structured</text><rect x="255" y="20" width="210" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Semi-structured</text><rect x="490" y="20" width="210" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="595" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Unstructured</text><rect x="30" y="70" width="63" height="26" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="61" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">ID</text><rect x="93" y="70" width="63" height="26" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="124" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Name</text><rect x="156" y="70" width="63" height="26" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="187" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Dept</text><rect x="30" y="96" width="63" height="26" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="61" y="114" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">101</text><rect x="93" y="96" width="63" height="26" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="124" y="114" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Rina</text><rect x="156" y="96" width="63" height="26" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="187" y="114" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">CSE</text><rect x="30" y="122" width="63" height="26" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="61" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">102</text><rect x="93" y="122" width="63" height="26" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="124" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Karim</text><rect x="156" y="122" width="63" height="26" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="187" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">EEE</text><text x="125" y="175" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">fixed schema, rows and columns</text><text x="270" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">{ "id": 101,</text><text x="270" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">  "name": "Rina",</text><text x="270" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">  "skills": ["C", "SQL"] }</text><rect x="260" y="70" width="200" height="80" rx="4" fill="none" stroke="#17292d" stroke-width="2" stroke-dasharray="4 3"/><text x="360" y="175" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">tags or keys, flexible schema</text><rect x="500" y="70" width="90" height="80" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><polyline points="505,140 530,105 550,125 570,95 585,140" fill="none" stroke="#08595a" stroke-width="2"/><text x="545" y="165" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">image</text><rect x="605" y="70" width="90" height="80" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><line x1="615" y1="85" x2="685" y2="85" stroke="#4b6166" stroke-width="3"/><line x1="615" y1="101" x2="665" y2="101" stroke="#4b6166" stroke-width="3"/><line x1="615" y1="117" x2="685" y2="117" stroke="#4b6166" stroke-width="3"/><line x1="615" y1="133" x2="665" y2="133" stroke="#4b6166" stroke-width="3"/><text x="650" y="165" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">free text</text><text x="600" y="190" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">no predefined model</text><path d="M40,215 L690,215" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M690,215 L681.0,219.3 L681.0,210.7 Z" fill="#4b6166"/><text x="365" y="235" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">less organised, more flexible, harder to query</text><text x="360" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Structured, semi-structured and unstructured data</text>
</svg>
