<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Cloud deployment models">
<title>Cloud deployment models</title>
<rect width="720" height="420" fill="#ffffff"/>
<text x="180" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">1. Public cloud</text><ellipse cx="180" cy="70" rx="110" ry="34" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="180" y="75" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Provider's cloud</text><rect x="25" y="130" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="64" y="145" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Org A</text><line x1="64" y1="128" x2="180" y2="104" stroke="#4b6166" stroke-width="2"/><rect x="107" y="130" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="146" y="145" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Person</text><line x1="146" y1="128" x2="180" y2="104" stroke="#4b6166" stroke-width="2"/><rect x="189" y="130" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="228" y="145" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Org B</text><line x1="228" y1="128" x2="180" y2="104" stroke="#4b6166" stroke-width="2"/><rect x="271" y="130" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="310" y="145" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Org C</text><line x1="310" y1="128" x2="180" y2="104" stroke="#4b6166" stroke-width="2"/><text x="180" y="182" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">open to the general public; pay per use</text><text x="540" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">2. Private cloud</text><rect x="415" y="32" width="270" height="150" rx="10" fill="#f7fbfa" stroke="#17292d" stroke-width="2" stroke-dasharray="6 4"/><text x="640" y="50" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">one organization</text><ellipse cx="540" cy="90" rx="95" ry="34" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="540" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Private cloud</text><rect x="430" y="135" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="469" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Dept 1</text><line x1="469" y1="133" x2="540" y2="124" stroke="#4b6166" stroke-width="2"/><rect x="512" y="135" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="551" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Dept 2</text><line x1="551" y1="133" x2="540" y2="124" stroke="#4b6166" stroke-width="2"/><rect x="594" y="135" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="633" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Dept 3</text><line x1="633" y1="133" x2="540" y2="124" stroke="#4b6166" stroke-width="2"/><text x="180" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">3. Community cloud</text><ellipse cx="180" cy="270" rx="110" ry="34" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="180" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Community cloud</text><rect x="60" y="330" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="99" y="345" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bank A</text><line x1="99" y1="328" x2="180" y2="304" stroke="#4b6166" stroke-width="2"/><rect x="142" y="330" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="181" y="345" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bank B</text><line x1="181" y1="328" x2="180" y2="304" stroke="#4b6166" stroke-width="2"/><rect x="224" y="330" width="78" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="263" y="345" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bank C</text><line x1="263" y1="328" x2="180" y2="304" stroke="#4b6166" stroke-width="2"/><text x="180" y="382" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">shared by organizations with common concerns</text><text x="540" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">4. Hybrid cloud</text><ellipse cx="450" cy="285" rx="75" ry="34" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="450" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Private</text><ellipse cx="630" cy="285" rx="75" ry="34" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="630" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Public</text><path d="M527,278 L553,278" fill="none" stroke="#17292d" stroke-width="2"/><path d="M553,278 L544.0,282.3 L544.0,273.7 Z" fill="#17292d"/><path d="M553,292 L527,292" fill="none" stroke="#17292d" stroke-width="2"/><path d="M527,292 L536.0,287.7 L536.0,296.3 Z" fill="#17292d"/><text x="540" y="340" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">bound together: data and app portability</text><text x="540" y="356" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">(e.g. cloud bursting at peak load)</text><text x="360" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The four cloud deployment models</text>
</svg>
