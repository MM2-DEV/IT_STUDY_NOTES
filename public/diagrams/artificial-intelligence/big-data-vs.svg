<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="V's of big data">
<title>V's of big data</title>
<rect width="720" height="420" fill="#ffffff"/>
<circle cx="360" cy="200" r="62" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Big data</text><text x="360" y="214" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">6 V's</text><line x1="360" y1="136" x2="360" y2="84" stroke="#4b6166" stroke-width="2"/><rect x="285" y="18" width="150" height="64" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="360" y="35" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Volume</text><text x="360" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">huge amount</text><text x="360" y="65" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(TB, PB, EB)</text><line x1="415.42562584220406" y1="168" x2="498.56406460551017" y2="142" stroke="#4b6166" stroke-width="2"/><rect x="484.18584287042086" y="93" width="150" height="64" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="559.1858428704209" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Velocity</text><text x="559.1858428704209" y="125" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">speed of</text><text x="559.1858428704209" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">generation</text><line x1="415.42562584220406" y1="232" x2="498.56406460551017" y2="258" stroke="#4b6166" stroke-width="2"/><rect x="484.18584287042086" y="243" width="150" height="64" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="559.1858428704209" y="260" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Variety</text><text x="559.1858428704209" y="275" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">structured, semi-,</text><text x="559.1858428704209" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">unstructured</text><line x1="360" y1="264" x2="360" y2="316" stroke="#4b6166" stroke-width="2"/><rect x="285" y="318" width="150" height="64" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="360" y="335" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Veracity</text><text x="360" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">quality and</text><text x="360" y="365" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">trustworthiness</text><line x1="304.57437415779594" y1="232.00000000000003" x2="221.43593539448983" y2="258.00000000000006" stroke="#4b6166" stroke-width="2"/><rect x="85.81415712957914" y="243.00000000000006" width="150" height="64" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="160.81415712957914" y="267.50000000000006" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Value</text><text x="160.81415712957914" y="282.50000000000006" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">useful insights</text><line x1="304.57437415779594" y1="168" x2="221.43593539448983" y2="142" stroke="#4b6166" stroke-width="2"/><rect x="85.81415712957912" y="92.99999999999999" width="150" height="64" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="160.81415712957912" y="109.99999999999999" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Variability</text><text x="160.81415712957912" y="124.99999999999999" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">changing meaning</text><text x="160.81415712957912" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">and flow rate</text><text x="360" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The V's of big data: the original 3 V's (teal), Veracity and Value (5 V's), and Variability (6 V's)</text>
</svg>
