<svg xmlns="http://www.w3.org/2000/svg" width="730" height="185" viewBox="0 0 730 185" role="img" aria-label="Computer vision pipeline">
<title>Computer vision pipeline</title>
<rect width="730" height="185" fill="#ffffff"/>
<rect x="15" y="40" width="118" height="56" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="74" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Image</text><text x="74" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">acquisition</text><text x="74" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">camera, sensor</text><rect x="157" y="40" width="118" height="56" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="216" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Pre-</text><text x="216" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">processing</text><text x="216" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">noise removal,</text><text x="216" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">contrast</text><path d="M135,68 L155,68" fill="none" stroke="#17292d" stroke-width="2"/><path d="M155,68 L146.0,72.3 L146.0,63.7 Z" fill="#17292d"/><rect x="299" y="40" width="118" height="56" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="358" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Feature</text><text x="358" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">extraction</text><text x="358" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">edges, shapes,</text><text x="358" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">textures</text><path d="M277,68 L297,68" fill="none" stroke="#17292d" stroke-width="2"/><path d="M297,68 L288.0,72.3 L288.0,63.7 Z" fill="#17292d"/><rect x="441" y="40" width="118" height="56" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="500" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Recognition /</text><text x="500" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">classification</text><text x="500" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">ML or CNN</text><text x="500" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">model</text><path d="M419,68 L439,68" fill="none" stroke="#17292d" stroke-width="2"/><path d="M439,68 L430.0,72.3 L430.0,63.7 Z" fill="#17292d"/><rect x="583" y="40" width="118" height="56" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="642" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Decision</text><text x="642" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">or action</text><text x="642" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">label, alarm,</text><text x="642" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">steering</text><path d="M561,68 L581,68" fill="none" stroke="#17292d" stroke-width="2"/><path d="M581,68 L572.0,72.3 L572.0,63.7 Z" fill="#17292d"/><text x="365" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Steps of a computer vision system</text>
</svg>
