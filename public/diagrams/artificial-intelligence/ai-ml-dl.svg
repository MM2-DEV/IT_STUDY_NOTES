<svg xmlns="http://www.w3.org/2000/svg" width="820" height="345" viewBox="0 0 820 345" role="img" aria-label="AI, ML and DL">
<title>AI, ML and DL</title>
<rect width="820" height="345" fill="#ffffff"/>
<ellipse cx="300" cy="170" rx="280" ry="150" fill="#69c6ca" fill-opacity="0.35" stroke="#17292d" stroke-width="2"/><ellipse cx="350" cy="195" rx="200" ry="110" fill="#dbda65" fill-opacity="0.55" stroke="#17292d" stroke-width="2"/><ellipse cx="395" cy="220" rx="120" ry="65" fill="#cbadd1" fill-opacity="0.8" stroke="#17292d" stroke-width="2"/><text x="120" y="75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Artificial intelligence</text><text x="120" y="95" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">machines that act intelligently</text><text x="220" y="125" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Machine learning</text><text x="220" y="143" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">learns patterns from data</text><text x="395" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Deep learning</text><text x="395" y="233" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">many-layer neural networks</text><text x="610" y="120" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Examples outside ML:</text><text x="610" y="138" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">rule-based expert systems,</text><text x="610" y="154" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">search and planning</text><text x="410" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Deep learning is part of machine learning, which is part of artificial intelligence</text>
</svg>
