<svg xmlns="http://www.w3.org/2000/svg" width="700" height="370" viewBox="0 0 700 370" role="img" aria-label="Perceptron">
<title>Perceptron</title>
<rect width="700" height="370" fill="#ffffff"/>
<circle cx="70" cy="70" r="22" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="70" y="71" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">x₁</text><circle cx="70" cy="170" r="22" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="70" y="171" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">x₂</text><circle cx="70" cy="270" r="22" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="70" y="271" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="330" cy="170" r="42" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="330" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Σ</text><text x="330" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">net</text><path d="M92,76 L290,155" fill="none" stroke="#17292d" stroke-width="2"/><path d="M290,155 L280.0,155.7 L283.2,147.6 Z" fill="#17292d"/><text x="191" y="101.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">w₁</text><path d="M94,170 L286,170" fill="none" stroke="#17292d" stroke-width="2"/><path d="M286,170 L277.0,174.3 L277.0,165.7 Z" fill="#17292d"/><text x="190" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">w₂</text><path d="M92,262 L290,186" fill="none" stroke="#17292d" stroke-width="2"/><path d="M290,186 L283.2,193.3 L280.0,185.2 Z" fill="#17292d"/><text x="191" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">b (bias)</text><rect x="420" y="145" width="120" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="480" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Step</text><text x="480" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">function</text><path d="M372,170 L418,170" fill="none" stroke="#17292d" stroke-width="2"/><path d="M418,170 L409.0,174.3 L409.0,165.7 Z" fill="#17292d"/><path d="M540,170 L600,170" fill="none" stroke="#17292d" stroke-width="2"/><path d="M600,170 L591.0,174.3 L591.0,165.7 Z" fill="#17292d"/><text x="640" y="175" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">y</text><text x="330" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">net = w₁x₁ + w₂x₂ + b;   y = 1 if net > 0, otherwise 0</text><text x="350" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">A perceptron with two inputs</text>
</svg>
