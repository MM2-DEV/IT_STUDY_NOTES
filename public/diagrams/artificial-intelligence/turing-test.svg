<svg xmlns="http://www.w3.org/2000/svg" width="660" height="315" viewBox="0 0 660 315" role="img" aria-label="Turing test">
<title>Turing test</title>
<rect width="660" height="315" fill="#ffffff"/>
<rect x="20" y="30" width="230" height="200" rx="8" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="135" y="22" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hidden from the interrogator</text><rect x="60" y="55" width="150" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="135" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A: Computer</text><rect x="60" y="155" width="150" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="135" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B: Human</text><line x1="300" y1="30" x2="300" y2="230" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5"/><text x="300" y="245" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">wall</text><rect x="400" y="105" width="160" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="480" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C: Human</text><text x="480" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">interrogator</text><path d="M400,120 L212,80" fill="none" stroke="#08595a" stroke-width="2"/><path d="M212,80 L221.7,77.6 L219.9,86.1 Z" fill="#08595a"/><text x="306" y="88" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">typed questions</text><path d="M400,140 L212,180" fill="none" stroke="#08595a" stroke-width="2"/><path d="M212,180 L219.9,173.9 L221.7,182.4 Z" fill="#08595a"/><text x="330" y="275" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">If the interrogator cannot reliably tell which of A and B is the machine, the machine passes.</text><text x="330" y="303" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The Turing test (imitation game)</text>
</svg>
