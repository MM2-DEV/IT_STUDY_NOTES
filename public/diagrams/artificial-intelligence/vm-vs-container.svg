<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="VMs vs containers">
<title>VMs vs containers</title>
<rect width="720" height="320" fill="#ffffff"/>
<text x="160" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Virtual machines</text><rect x="20" y="40" width="88" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="64" y="57" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">App A</text><rect x="116" y="40" width="88" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="160" y="57" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">App B</text><rect x="212" y="40" width="88" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="256" y="57" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">App C</text><rect x="20" y="80" width="88" height="34" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="64" y="97" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bins/libs</text><rect x="116" y="80" width="88" height="34" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="160" y="97" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bins/libs</text><rect x="212" y="80" width="88" height="34" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="256" y="97" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bins/libs</text><rect x="20" y="120" width="88" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="64" y="137" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Guest OS</text><rect x="116" y="120" width="88" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="160" y="137" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Guest OS</text><rect x="212" y="120" width="88" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="256" y="137" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Guest OS</text><rect x="20" y="160" width="280" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="160" y="177" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hypervisor</text><rect x="20" y="200" width="280" height="34" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="160" y="217" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host OS (type 2) or none (type 1)</text><rect x="20" y="240" width="280" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="160" y="257" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hardware</text><text x="540" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Containers</text><rect x="400" y="40" width="88" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="444" y="57" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">App A</text><rect x="496" y="40" width="88" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="57" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">App B</text><rect x="592" y="40" width="88" height="34" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="636" y="57" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">App C</text><rect x="400" y="80" width="88" height="34" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="444" y="97" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bins/libs</text><rect x="496" y="80" width="88" height="34" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="540" y="97" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bins/libs</text><rect x="592" y="80" width="88" height="34" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="636" y="97" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Bins/libs</text><rect x="400" y="120" width="280" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="540" y="137" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Container engine (Docker)</text><rect x="400" y="160" width="280" height="34" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="540" y="177" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Host operating system (shared kernel)</text><rect x="400" y="200" width="280" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="540" y="217" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hardware</text><text x="360" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Each VM carries a full guest OS; containers share the host OS kernel</text>
</svg>
