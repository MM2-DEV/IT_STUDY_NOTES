<rect x="20" y="15" width="340" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="190" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Key–value store</text><rect x="20" y="55" width="340" height="120" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="190" y="193" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Redis, Memcached, Amazon DynamoDB</text><rect x="45" y="70" width="110" height="26" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="100" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">user:101</text><path d="M157,83 L190,83" fill="none" stroke="#17292d" stroke-width="2"/><path d="M190,83 L181.0,87.3 L181.0,78.7 Z" fill="#17292d"/><text x="195" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">"Rina"</text><rect x="45" y="102" width="110" height="26" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="100" y="120" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">cart:101</text><path d="M157,115 L190,115" fill="none" stroke="#17292d" stroke-width="2"/><path d="M190,115 L181.0,119.3 L181.0,110.7 Z" fill="#17292d"/><text x="195" y="120" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">["pen", "book"]</text><rect x="45" y="134" width="110" height="26" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="100" y="152" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">session:9f</text><path d="M157,147 L190,147" fill="none" stroke="#17292d" stroke-width="2"/><path d="M190,147 L181.0,151.3 L181.0,142.7 Z" fill="#17292d"/><text x="195" y="152" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">{…}</text><rect x="380" y="15" width="340" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="550" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Document store</text><rect x="380" y="55" width="340" height="120" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="550" y="193" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">MongoDB, CouchDB, Firestore</text><text x="400" y="78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">{ "_id": 101,</text><text x="400" y="102" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">  "name": "Rina",</text><text x="400" y="126" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">  "address": { "city": "Dhaka" },</text><text x="400" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">  "orders": [5, 9] }</text><rect x="20" y="215" width="340" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="190" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Column-family (wide-column) store</text><rect x="20" y="255" width="340" height="120" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="190" y="393" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Apache Cassandra, HBase, Google Bigtable</text><rect x="55" y="270" width="90" height="30" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="100" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">row key</text><rect x="145" y="270" width="90" height="30" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="190" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">name</text><rect x="235" y="270" width="90" height="30" rx="0" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="280" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">city</text><rect x="55" y="300" width="90" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="100" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">101</text><rect x="145" y="300" width="90" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="190" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Rina</text><rect x="235" y="300" width="90" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="280" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Dhaka</text><rect x="55" y="330" width="90" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="100" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">102</text><rect x="145" y="330" width="90" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="190" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Karim</text><rect x="235" y="330" width="90" height="30" rx="0" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="280" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">—</text><rect x="380" y="215" width="340" height="34" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="550" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Graph database</text><rect x="380" y="255" width="340" height="120" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="550" y="393" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Neo4j, Amazon Neptune</text><circle cx="440" cy="300" r="26" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="440" y="301" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Rina</text><circle cx="560" cy="270" r="26" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="560" y="271" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Karim</text><circle cx="640" cy="330" r="26" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="640" y=