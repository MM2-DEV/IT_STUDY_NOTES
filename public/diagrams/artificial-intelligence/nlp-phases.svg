<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-label="Phases of NLP">
<title>Phases of NLP</title>
<rect width="640" height="500" fill="#ffffff"/>
<rect x="20" y="20" width="120" height="50" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="80" y="37.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Input text</text><text x="80" y="52.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">or speech</text><rect x="200" y="95" width="230" height="48" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="315" y="111.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Lexical and</text><text x="315" y="126.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">morphological analysis</text><text x="450" y="115" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">words, morphemes</text><rect x="200" y="157" width="230" height="48" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="315" y="173.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Syntactic analysis</text><text x="315" y="188.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(parsing)</text><text x="450" y="177" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">grammar, structure</text><path d="M315,143 L315,156" fill="none" stroke="#17292d" stroke-width="2"/><path d="M315,156 L310.7,147.0 L319.3,147.0 Z" fill="#17292d"/><rect x="200" y="219" width="230" height="48" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="315" y="235.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Semantic</text><text x="315" y="250.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">analysis</text><text x="450" y="239" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">literal meaning</text><path d="M315,205 L315,218" fill="none" stroke="#17292d" stroke-width="2"/><path d="M315,218 L310.7,209.0 L319.3,209.0 Z" fill="#17292d"/><rect x="200" y="281" width="230" height="48" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="315" y="297.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Discourse</text><text x="315" y="312.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">integration</text><text x="450" y="301" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">meaning from nearby</text><text x="450" y="315" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">sentences</text><path d="M315,267 L315,280" fill="none" stroke="#17292d" stroke-width="2"/><path d="M315,280 L310.7,271.0 L319.3,271.0 Z" fill="#17292d"/><rect x="200" y="343" width="230" height="48" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="315" y="359.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5. Pragmatic</text><text x="315" y="374.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">analysis</text><text x="450" y="363" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">intended meaning</text><text x="450" y="377" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">(real-world knowledge)</text><path d="M315,329 L315,342" fill="none" stroke="#17292d" stroke-width="2"/><path d="M315,342 L310.7,333.0 L319.3,333.0 Z" fill="#17292d"/><line x1="80" y1="70" x2="80" y2="119" stroke="#17292d" stroke-width="2"/><path d="M80,119 L198,119" fill="none" stroke="#17292d" stroke-width="2"/><path d="M198,119 L189.0,123.3 L189.0,114.7 Z" fill="#17292d"/><rect x="200" y="420" width="230" height="40" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="315" y="440" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Meaning / response</text><path d="M315,405 L315,418" fill="none" stroke="#17292d" stroke-width="2"/><path d="M315,418 L310.7,409.0 L319.3,409.0 Z" fill="#17292d"/><text x="320" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The five phases of natural language processing</text>
</svg>
