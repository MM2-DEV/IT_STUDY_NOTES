iddle" dominant-baseline="middle">3</text><line x1="400" y1="50" x2="560" y2="120" stroke="#4b6166" stroke-width="2"/><circle cx="480" cy="85" r="11" fill="#fff"/><text x="480" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">6</text><circle cx="70" cy="160" r="22" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="70" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><circle cx="220" cy="80" r="22" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="220" y="81" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="220" cy="250" r="22" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="220" y="251" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><circle cx="400" cy="50" r="22" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="400" y="51" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">D</text><circle cx="400" cy="190" r="22" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="400" y="191" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><circle cx="560" cy="120" r="22" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="560" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">G</text><text x="70" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">h=7</text><text x="220" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">h=6</text><text x="220" y="288" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">h=4</text><text x="400" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">h=2</text><text x="400" y="18" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">h=5</text><text x="560" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">h=0</text><text x="560" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">S = start, G = goal</text><text x="560" y="218" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">edge label = step cost</text><text x="560" y="236" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">h = estimated cost to G</text><text x="560" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">red path: optimal (cost 8)</text><text x="340" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Example search graph with step costs and heuristic values</text>
</svg>
