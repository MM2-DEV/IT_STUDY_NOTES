<svg xmlns="http://www.w3.org/2000/svg" width="720" height="445" viewBox="0 0 720 445" role="img" aria-label="Search strategies">
<title>Search strategies</title>
<rect width="720" height="445" fill="#ffffff"/>
<rect x="250" y="15" width="220" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Search strategies</text><rect x="40" y="100" width="280" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="180" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Uninformed (blind) search</text><rect x="400" y="100" width="280" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="540" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Informed (heuristic) search</text><path d="M330,55 L180,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M180,98 L187.5,91.3 L189.9,99.7 Z" fill="#17292d"/><path d="M390,55 L540,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M540,98 L530.1,99.7 L532.5,91.3 Z" fill="#17292d"/><rect x="70" y="160" width="220" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Breadth-first search</text><rect x="70" y="198" width="220" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="213" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Depth-first search</text><rect x="70" y="236" width="220" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="251" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Depth-limited search</text><rect x="70" y="274" width="220" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="289" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Iterative deepening DFS</text><rect x="70" y="312" width="220" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="327" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5. Uniform-cost search</text><rect x="70" y="350" width="220" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="365" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">6. Bidirectional search</text><rect x="410" y="160" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Greedy best-first search</text><rect x="410" y="198" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="213" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. A* search</text><rect x="410" y="236" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="251" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Hill climbing (local search)</text><rect x="410" y="274" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="289" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Simulated annealing (local search)</text><rect x="410" y="312" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="327" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5. Local beam search (local search)</text><text x="180" y="405" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">use only the problem definition</text><text x="540" y="375" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">use a heuristic h(n) or objective function</text><text x="360" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Classification of search strategies</text>
</svg>
