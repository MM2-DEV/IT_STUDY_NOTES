<svg xmlns="http://www.w3.org/2000/svg" width="690" height="290" viewBox="0 0 690 290" role="img" aria-label="Agent and environment">
<title>Agent and environment</title>
<rect width="690" height="290" fill="#ffffff"/>
<rect x="20" y="30" width="330" height="200" rx="10" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="185" y="22" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Agent</text><rect x="40" y="60" width="110" height="44" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="95" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sensors</text><rect x="40" y="160" width="110" height="44" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="95" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Actuators</text><rect x="190" y="100" width="140" height="64" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="260" y="117" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Agent program</text><text x="260" y="132" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(maps percepts</text><text x="260" y="147" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">to actions)</text><path d="M150,82 L205,110" fill="none" stroke="#17292d" stroke-width="2"/><path d="M205,110 L195.0,109.8 L198.9,102.0 Z" fill="#17292d"/><path d="M205,155 L150,180" fill="none" stroke="#17292d" stroke-width="2"/><path d="M150,180 L156.4,172.3 L160.0,180.2 Z" fill="#17292d"/><rect x="470" y="30" width="200" height="200" rx="10" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="570" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Environment</text><path d="M468,82 L152,82" fill="none" stroke="#17292d" stroke-width="2"/><path d="M152,82 L161.0,77.7 L161.0,86.3 Z" fill="#17292d"/><text x="310" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">percepts</text><path d="M152,182 L468,182" fill="none" stroke="#17292d" stroke-width="2"/><path d="M468,182 L459.0,186.3 L459.0,177.7 Z" fill="#17292d"/><text x="310" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">actions</text><text x="345" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Agent = architecture + agent program</text><text x="345" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">An agent perceives its environment through sensors and acts on it through actuators</text>
</svg>
