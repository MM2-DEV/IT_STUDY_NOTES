<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="Learning methods">
<title>Learning methods</title>
<rect width="720" height="390" fill="#ffffff"/>
<rect x="250" y="15" width="220" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Learning in AI</text><rect x="30" y="95" width="300" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="180" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Symbolic learning</text><text x="180" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(knowledge as symbols, rules, logic)</text><rect x="390" y="95" width="300" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="540" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Non-symbolic (sub-symbolic) learning</text><text x="540" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(knowledge as numbers, weights)</text><path d="M330,55 L180,93" fill="none" stroke="#17292d" stroke-width="2"/><path d="M180,93 L187.7,86.6 L189.8,95.0 Z" fill="#17292d"/><path d="M390,55 L540,93" fill="none" stroke="#17292d" stroke-width="2"/><path d="M540,93 L530.2,95.0 L532.3,86.6 Z" fill="#17292d"/><rect x="60" y="165" width="240" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Rote learning</text><rect x="60" y="203" width="240" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="218" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Learning by taking advice</text><rect x="60" y="241" width="240" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="256" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Learning by induction (examples)</text><rect x="60" y="279" width="240" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="294" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Explanation-based learning</text><rect x="60" y="317" width="240" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5. Learning by analogy</text><rect x="420" y="165" width="240" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Neural network learning</text><rect x="420" y="203" width="240" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="218" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Genetic (evolutionary) learning</text><rect x="420" y="241" width="240" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="256" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Statistical learning</text><text x="540" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Supervised, unsupervised and</text><text x="540" y="316" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">reinforcement learning can be</text><text x="540" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">used with either representation</text><text x="360" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Learning methods grouped by the representation of the learned knowledge</text>
</svg>
