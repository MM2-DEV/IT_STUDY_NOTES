<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Types of agents">
<title>Types of agents</title>
<rect width="720" height="360" fill="#ffffff"/>
<text x="160" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">1. Simple reflex agent</text><rect x="30" y="38" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="160" y="53" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Current percept</text><rect x="30" y="78" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="160" y="93" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Condition–action rule (if … then)</text><path d="M160,68 L160,77" fill="none" stroke="#17292d" stroke-width="2"/><path d="M160,77 L155.7,68.0 L164.3,68.0 Z" fill="#17292d"/><rect x="30" y="118" width="260" height="30" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="160" y="133" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Action</text><path d="M160,108 L160,117" fill="none" stroke="#17292d" stroke-width="2"/><path d="M160,117 L155.7,108.0 L164.3,108.0 Z" fill="#17292d"/><text x="520" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">2. Model-based reflex agent</text><rect x="390" y="38" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="520" y="53" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Percept + internal state (model)</text><rect x="390" y="78" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="520" y="93" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Condition–action rule</text><path d="M520,68 L520,77" fill="none" stroke="#17292d" stroke-width="2"/><path d="M520,77 L515.7,68.0 L524.3,68.0 Z" fill="#17292d"/><rect x="390" y="118" width="260" height="30" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="520" y="133" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Action</text><path d="M520,108 L520,117" fill="none" stroke="#17292d" stroke-width="2"/><path d="M520,117 L515.7,108.0 L524.3,108.0 Z" fill="#17292d"/><text x="160" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">3. Goal-based agent</text><rect x="30" y="213" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="160" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">State + model</text><rect x="30" y="253" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="160" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">What will happen if I do action A?</text><path d="M160,243 L160,252" fill="none" stroke="#17292d" stroke-width="2"/><path d="M160,252 L155.7,243.0 L164.3,243.0 Z" fill="#17292d"/><rect x="30" y="293" width="260" height="30" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="160" y="308" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Does it reach the goal? → Action</text><path d="M160,283 L160,292" fill="none" stroke="#17292d" stroke-width="2"/><path d="M160,292 L155.7,283.0 L164.3,283.0 Z" fill="#17292d"/><text x="520" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">4. Utility-based agent</text><rect x="390" y="213" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="520" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">State + model</text><rect x="390" y="253" width="260" height="30" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="520" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">What will happen if I do action A?</text><path d="M520,243 L520,252" fill="none" stroke="#17292d" stroke-width="2"/><path d="M520,252 L515.7,243.0 L524.3,243.0 Z" fill="#17292d"/><rect x="390" y="293" width="260" height="30" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="520" y="308" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">How happy (utility)? → Best action</text><path d="M520,283 L520,292" fill="none" stroke="#17292d" stroke-width="2"/><path d="M520,292 L515.7,283.0 L524.3,283.0 Z" fill="#17292d"/><text x="360" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">How the four basic types of agents choose an action</text>
</svg>
