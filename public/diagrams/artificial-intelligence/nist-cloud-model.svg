<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340" role="img" aria-label="NIST cloud model">
<title>NIST cloud model</title>
<rect width="740" height="340" fill="#ffffff"/>
<rect x="15" y="20" width="250" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="140" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5 essential characteristics</text><rect x="25" y="75" width="230" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="140" y="94" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">On-demand self-service</text><rect x="25" y="121" width="230" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="140" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Broad network access</text><rect x="25" y="167" width="230" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="140" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Resource pooling</text><rect x="25" y="213" width="230" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="140" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Rapid elasticity</text><rect x="25" y="259" width="230" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="140" y="278" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Measured service</text><rect x="285" y="20" width="210" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="390" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3 service models</text><rect x="295" y="75" width="190" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="390" y="94" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">SaaS (software)</text><rect x="295" y="121" width="190" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="390" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">PaaS (platform)</text><rect x="295" y="167" width="190" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="390" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">IaaS (infrastructure)</text><rect x="515" y="20" width="210" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="620" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4 deployment models</text><rect x="525" y="75" width="190" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="620" y="94" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Public cloud</text><rect x="525" y="121" width="190" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="620" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Private cloud</text><rect x="525" y="167" width="190" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="620" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Community cloud</text><rect x="525" y="213" width="190" height="38" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="620" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hybrid cloud</text><text x="370" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The NIST cloud model: 5 essential characteristics, 3 service models and 4 deployment models</text>
</svg>
