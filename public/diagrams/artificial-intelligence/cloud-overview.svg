<svg xmlns="http://www.w3.org/2000/svg" width="720" height="345" viewBox="0 0 720 345" role="img" aria-label="Cloud computing overview">
<title>Cloud computing overview</title>
<rect width="720" height="345" fill="#ffffff"/>
<path d="M250 150 C 210 150 200 100 245 92 C 250 50 320 40 345 75 C 370 35 450 40 455 85 C 510 80 520 150 470 150 Z" fill="#69c6ca" fill-opacity="0.5" stroke="#17292d" stroke-width="2"/><text x="360" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Cloud provider's data centres</text><text x="360" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">shared pool: servers, storage,</text><text x="360" y="131" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">networks, platforms, applications</text><rect x="5" y="250" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="60" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Laptop</text><path d="M60,248 L285,175" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M285,175 L277.8,181.9 L275.1,173.6 Z" fill="#4b6166"/><rect x="155" y="250" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="210" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Mobile phone</text><path d="M210,248 L322.5,175" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M322.5,175 L317.3,183.6 L312.6,176.3 Z" fill="#4b6166"/><rect x="305" y="250" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="360" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Office PC</text><path d="M360,248 L360,175" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M360,175 L364.3,184.0 L355.7,184.0 Z" fill="#4b6166"/><rect x="455" y="250" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="510" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Tablet</text><path d="M510,248 L397.5,175" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M397.5,175 L407.4,176.3 L402.7,183.6 Z" fill="#4b6166"/><rect x="585" y="250" width="110" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="640" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">IoT device</text><path d="M640,248 L430,175" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M430,175 L439.9,173.8 L437.1,182.1 Z" fill="#4b6166"/><rect x="270" y="175" width="180" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Internet</text><text x="360" y="310" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Users rent resources on demand over the network and pay for what they use</text><text x="360" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Cloud computing: on-demand access to a shared pool of remote resources</text>
</svg>
