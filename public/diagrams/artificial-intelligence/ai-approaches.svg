<svg xmlns="http://www.w3.org/2000/svg" width="640" height="255" viewBox="0 0 640 255" role="img" aria-label="Approaches to AI">
<title>Approaches to AI</title>
<rect width="640" height="255" fill="#ffffff"/>
<text x="300" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Human-like</text><text x="520" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Rational (ideal)</text><text x="110" y="85" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">Thinking</text><text x="110" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="end" dominant-baseline="middle">Acting</text><rect x="190" y="40" width="210" height="85" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="295" y="73" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Thinking humanly</text><text x="295" y="95" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">cognitive modelling</text><rect x="410" y="40" width="210" height="85" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="515" y="73" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Thinking rationally</text><text x="515" y="95" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">laws of thought (logic)</text><rect x="190" y="135" width="210" height="85" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="295" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Acting humanly</text><text x="295" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Turing test approach</text><rect x="410" y="135" width="210" height="85" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="515" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Acting rationally</text><text x="515" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">rational agent approach</text><text x="320" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The four approaches to defining AI (Russell and Norvig)</text>
