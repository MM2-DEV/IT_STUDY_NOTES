<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Types of data analytics">
<title>Types of data analytics</title>
<rect width="720" height="320" fill="#ffffff"/>
<rect x="30" y="200" width="150" height="66" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="105" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Descriptive</text><text x="105" y="241" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">What happened?</text><text x="105" y="282" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">reports, dashboards</text><rect x="200" y="140" width="150" height="66" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="275" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Diagnostic</text><text x="275" y="181" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Why did it happen?</text><text x="275" y="222" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">drill-down, data mining</text><rect x="370" y="80" width="150" height="66" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="445" y="105" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Predictive</text><text x="445" y="121" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">What will happen?</text><text x="445" y="162" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">ML, forecasting</text><rect x="540" y="20" width="150" height="66" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="615" y="45" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Prescriptive</text><text x="615" y="61" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">What should we do?</text><text x="615" y="102" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">optimisation, AI</text><text x="360" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The four types of data analytics, from looking back (descriptive) to recommending actions (prescriptive)</text>
</svg>
