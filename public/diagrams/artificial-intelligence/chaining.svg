<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-label="Forward and backward chaining">
<title>Forward and backward chaining</title>
<rect width="680" height="340" fill="#ffffff"/>
<text x="170" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Forward chaining (data-driven)</text><text x="510" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Backward chaining (goal-driven)</text><rect x="80" y="40" width="180" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="170" y="60" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Facts: A, B, E</text><rect x="80" y="102" width="180" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="170" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R1: A ∧ B → C  ⇒  C</text><path d="M170,80 L170,100" fill="none" stroke="#17292d" stroke-width="2"/><path d="M170,100 L165.7,91.0 L174.3,91.0 Z" fill="#17292d"/><rect x="80" y="164" width="180" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="170" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R2: C → D  ⇒  D</text><path d="M170,142 L170,162" fill="none" stroke="#17292d" stroke-width="2"/><path d="M170,162 L165.7,153.0 L174.3,153.0 Z" fill="#17292d"/><rect x="80" y="226" width="180" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="170" y="246" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R3: D ∧ E → F  ⇒  F (goal)</text><path d="M170,204 L170,224" fill="none" stroke="#17292d" stroke-width="2"/><path d="M170,224 L165.7,215.0 L174.3,215.0 Z" fill="#17292d"/><rect x="420" y="40" width="180" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="510" y="60" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Goal: F</text><rect x="420" y="102" width="180" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="510" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R3: need D and E (E known)</text><path d="M510,80 L510,100" fill="none" stroke="#17292d" stroke-width="2"/><path d="M510,100 L505.7,91.0 L514.3,91.0 Z" fill="#17292d"/><rect x="420" y="164" width="180" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="510" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R2: need C</text><path d="M510,142 L510,162" fill="none" stroke="#17292d" stroke-width="2"/><path d="M510,162 L505.7,153.0 L514.3,153.0 Z" fill="#17292d"/><rect x="420" y="226" width="180" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="510" y="246" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R1: need A and B (known) ✓</text><path d="M510,204 L510,224" fill="none" stroke="#17292d" stroke-width="2"/><path d="M510,224 L505.7,215.0 L514.3,215.0 Z" fill="#17292d"/><text x="170" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">start from known facts, fire rules, add new facts</text><text x="510" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">start from the goal, find rules that prove it</text><text x="340" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Forward and backward chaining on the same rules</text>
</svg>
