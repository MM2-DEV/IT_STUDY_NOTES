<svg xmlns="http://www.w3.org/2000/svg" width="720" height="345" viewBox="0 0 720 345" role="img" aria-label="Cloud, fog and edge">
<title>Cloud, fog and edge</title>
<rect width="720" height="345" fill="#ffffff"/>
<rect x="170" y="20" width="380" height="60" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="360" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Cloud layer — central data centres</text><text x="360" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">large storage, heavy analytics, long-term data</text><text x="640" y="45" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">far: higher latency</text><text x="640" y="60" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">farthest from devices</text><rect x="110" y="140" width="140" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="180" y="157.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Fog node</text><text x="180" y="172.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(gateway, router)</text><path d="M180,138 L360,82" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M360,82 L352.7,88.8 L350.1,80.5 Z" fill="#4b6166"/><rect x="290" y="140" width="140" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="157.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Fog node</text><text x="360" y="172.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(base station)</text><path d="M360,138 L360,82" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M360,82 L364.3,91.0 L355.7,91.0 Z" fill="#4b6166"/><rect x="470" y="140" width="140" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="540" y="157.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Fog node</text><text x="540" y="172.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(local micro-DC)</text><path d="M540,138 L360,82" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M360,82 L369.9,80.5 L367.3,88.8 Z" fill="#4b6166"/><text x="655" y="112" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">fog layer: filter, aggregate,</text><text x="655" y="127" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">local analytics</text><rect x="60" y="250" width="90" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="105" y="267" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Sensor</text><path d="M105,248 L180,192" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M180,192 L175.4,200.9 L170.2,193.9 Z" fill="#4b6166"/><rect x="162" y="250" width="90" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="207" y="267" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Camera</text><path d="M207,248 L180,192" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M180,192 L187.8,198.2 L180.0,202.0 Z" fill="#4b6166"/><rect x="264" y="250" width="90" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="309" y="267" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Phone</text><path d="M309,248 L360,192" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M360,192 L357.2,201.6 L350.7,195.7 Z" fill="#4b6166"/><rect x="366" y="250" width="90" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="411" y="267" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Smart meter</text><path d="M411,248 L360,192" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M360,192 L369.3,195.7 L362.8,201.6 Z" fill="#4b6166"/><rect x="468" y="250" width="90" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="513" y="267" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Vehicle</text><path d="M513,248 L540,192" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M540,192 L540.0,202.0 L532.2,198.2 Z" fill="#4b6166"/><rect x="570" y="250" width="90" height="34" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="615" y="267" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Wearable</text><path d="M615,248 L540,192" fill="none" stroke="#4b6166" stroke-width="2"/><path d="M540,192 L549.8,193.9 L544.6,200.9 Z" fill="#4b6166"/><text x="360" y="310" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Edge layer: devices that produce data and process some of it on the spot (lowest latency)</text><text x="360" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Edge, fog and cloud layers</text>
</svg>
