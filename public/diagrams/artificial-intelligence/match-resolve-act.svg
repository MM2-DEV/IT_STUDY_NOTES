<svg xmlns="http://www.w3.org/2000/svg" width="720" height="345" viewBox="0 0 720 345" role="img" aria-label="Match-resolve-act cycle">
<title>Match-resolve-act cycle</title>
<rect width="720" height="345" fill="#ffffff"/>
<rect x="30" y="40" width="180" height="60" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="120" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Working memory</text><text x="120" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(facts)</text><rect x="30" y="160" width="180" height="60" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="120" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Rule base</text><text x="120" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(IF … THEN rules)</text><rect x="290" y="100" width="150" height="60" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="365" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Match</text><rect x="510" y="100" width="180" height="60" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="600" y="121.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. Conflict</text><text x="600" y="138.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">resolution</text><rect x="510" y="230" width="180" height="60" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="600" y="251.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Act</text><text x="600" y="268.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(fire one rule)</text><path d="M212,70 L288,115" fill="none" stroke="#17292d" stroke-width="2"/><path d="M288,115 L278.0,114.2 L282.5,106.7 Z" fill="#17292d"/><path d="M212,190 L288,145" fill="none" stroke="#17292d" stroke-width="2"/><path d="M288,145 L282.5,153.3 L278.0,145.8 Z" fill="#17292d"/><path d="M442,130 L508,130" fill="none" stroke="#17292d" stroke-width="2"/><path d="M508,130 L499.0,134.3 L499.0,125.7 Z" fill="#17292d"/><text x="475" y="118" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">conflict set</text><path d="M600,162 L600,228" fill="none" stroke="#17292d" stroke-width="2"/><path d="M600,228 L595.7,219.0 L604.3,219.0 Z" fill="#17292d"/><text x="650" y="195" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">selected rule</text><line x1="508" y1="275" x2="12" y2="275" stroke="#17292d" stroke-width="2"/><line x1="12" y1="275" x2="12" y2="70" stroke="#17292d" stroke-width="2"/><path d="M12,70 L28,70" fill="none" stroke="#17292d" stroke-width="2"/><path d="M28,70 L19.0,74.3 L19.0,65.7 Z" fill="#17292d"/><text x="260" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">actions add or delete facts</text><text x="360" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The match–resolve–act cycle of a rule-based (production) system</text>
</svg>
