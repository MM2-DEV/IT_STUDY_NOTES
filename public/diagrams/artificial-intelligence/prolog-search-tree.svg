<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-label="Prolog search tree">
<title>Prolog search tree</title>
<rect width="720" height="385" fill="#ffffff"/>
<rect x="230" y="15" width="260" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="35" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">?- grandparent(rahim, Z).</text><rect x="200" y="95" width="320" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="360" y="115" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">parent(rahim, Y), parent(Y, Z)</text><path d="M360,55 L360,93" fill="none" stroke="#17292d" stroke-width="2"/><path d="M360,93 L355.7,84.0 L364.3,84.0 Z" fill="#17292d"/><text x="535" y="74" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">rule: grandparent(X,Z) :- parent(X,Y), parent(Y,Z)</text><rect x="80" y="185" width="200" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="180" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">parent(karim, Z)</text><rect x="440" y="185" width="200" height="40" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="540" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">parent(nila, Z)</text><path d="M300,135 L185,183" fill="none" stroke="#17292d" stroke-width="2"/><path d="M185,183 L191.6,175.5 L195.0,183.5 Z" fill="#17292d"/><text x="202.5" y="159" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Y = karim</text><path d="M420,135 L535,183" fill="none" stroke="#17292d" stroke-width="2"/><path d="M535,183 L525.0,183.5 L528.4,175.5 Z" fill="#17292d"/><text x="517.5" y="159" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Y = nila</text><rect x="20" y="275" width="120" height="40" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="80" y="295" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Z = sami ✓</text><rect x="160" y="275" width="120" height="40" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="220" y="295" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Z = rina ✓</text><path d="M150,225 L80,273" fill="none" stroke="#17292d" stroke-width="2"/><path d="M80,273 L85.0,264.3 L89.9,271.5 Z" fill="#17292d"/><path d="M215,225 L220,273" fill="none" stroke="#17292d" stroke-width="2"/><path d="M220,273 L214.7,264.5 L223.4,263.6 Z" fill="#17292d"/><rect x="470" y="275" width="140" height="40" rx="6" fill="#f6d5d5" stroke="#17292d" stroke-width="2"/><text x="540" y="295" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">no fact: fail ✗</text><path d="M540,225 L540,273" fill="none" stroke="#c0392b" stroke-width="2"/><path d="M540,273 L535.7,264.0 L544.3,264.0 Z" fill="#c0392b"/><text x="360" y="345" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Prolog searches depth-first, left to right; after each answer or failure it backtracks to the last choice point.</text><text x="360" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Search tree of a Prolog query with backtracking</text>
</svg>
