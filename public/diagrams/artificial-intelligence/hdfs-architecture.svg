<svg xmlns="http://www.w3.org/2000/svg" width="720" height="345" viewBox="0 0 720 345" role="img" aria-label="HDFS architecture">
<title>HDFS architecture</title>
<rect width="720" height="345" fill="#ffffff"/>
<rect x="270" y="20" width="180" height="60" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="360" y="35" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">NameNode (master)</text><text x="360" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">metadata: file → blocks</text><text x="360" y="65" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">→ DataNodes</text><rect x="520" y="20" width="180" height="60" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="610" y="35" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Secondary NameNode</text><text x="610" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(checkpoints of</text><text x="610" y="65" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">metadata)</text><path d="M452,50 L518,50" fill="none" stroke="#17292d" stroke-width="2" stroke-dasharray="5 4"/><path d="M518,50 L509.0,54.3 L509.0,45.7 Z" fill="#17292d"/><rect x="20" y="30" width="160" height="50" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="100" y="55" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Client</text><path d="M182,50 L268,50" fill="none" stroke="#17292d" stroke-width="2"/><path d="M268,50 L259.0,54.3 L259.0,45.7 Z" fill="#17292d"/><text x="225" y="40" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">metadata ops</text><rect x="30" y="170" width="150" height="110" rx="8" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="105" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DataNode 1</text><rect x="40" y="210" width="40" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="60" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B1</text><rect x="85" y="210" width="40" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="105" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B2</text><rect x="130" y="210" width="40" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="150" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B4</text><path d="M105,168 L360,82" fill="none" stroke="#4b6166" stroke-width="2" stroke-dasharray="4 3"/><path d="M360,82 L352.9,89.0 L350.1,80.8 Z" fill="#4b6166"/><rect x="202" y="170" width="150" height="110" rx="8" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="277" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DataNode 2</text><rect x="212" y="210" width="40" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="232" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B1</text><rect x="257" y="210" width="40" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="277" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B3</text><rect x="302" y="210" width="40" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="322" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B4</text><path d="M277,168 L360,82" fill="none" stroke="#4b6166" stroke-width="2" stroke-dasharray="4 3"/><path d="M360,82 L356.9,91.5 L350.6,85.5 Z" fill="#4b6166"/><rect x="374" y="170" width="150" height="110" rx="8" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="449" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DataNode 3</text><rect x="384" y="210" width="40" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="404" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B2</text><rect x="429" y="210" width="40" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="449" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B3</text><rect x="474" y="210" width="40" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="494" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B4</text><path d="M449,168 L360,82" fill="none" stroke="#4b6166" stroke-width="2" stroke-dasharray="4 3"/><path d="M360,82 L369.5,85.1 L363.5,91.4 Z" fill="#4b6166"/><rect x="546" y="170" width="150" height="110" rx="8" fill="#f7fbfa" stroke="#17292d" stroke-width="2"/><text x="621" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">DataNode 4</text><rect x="556" y="210" width="40" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="576" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B1</text><rect x="601" y="210" width="40" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="621" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B2</text><rect x="646" y="210" width="40" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="666" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B3</text><path d="M621,168 L360,82" fill="none" stroke="#4b6166" stroke-width="2" stroke-dasharray="4 3"/><path d="M360,82 L369.9,80.7 L367.2,88.9 Z" fill="#4b6166"/><line x1="100" y1="82" x2="100" y2="140" stroke="#08595a" stroke-width="2"/><path d="M100,140 L105,168" fill="none" stroke="#08595a" stroke-width="2"/><path d="M105,168 L99.1,159.9 L107.7,158.4 Z" fill="#08595a"/><text x="92" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#08595a" text-anchor="end" dominant-baseline="middle">read / write data</text><text x="560" y="112" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">heartbeats and block reports</text><text x="360" y="305" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">A 500 MB file = 4 blocks (128 + 128 + 128 + 116 MB); each block is stored on 3 DataNodes (replication factor 3)</text><text x="360" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">HDFS master–slave architecture</text>
</svg>
