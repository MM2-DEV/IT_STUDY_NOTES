vetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">CLK</text><polyline points="205,65 240,65 240,65 280,65" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="205,175 240,175 240,185 280,185" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="400" y1="65" x2="520" y2="65" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="528" y="65" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Q</text><circle cx="460" cy="65" r="3" fill="#17292d"/><line x1="400" y1="185" x2="520" y2="185" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="528" y="185" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Q′</text><circle cx="470" cy="185" r="3" fill="#17292d"/><polyline points="460,65 460,15 110,15 110,165 150,165" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="27" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Q fed back to the K-side AND gate</text><polyline points="470,185 470,235 125,235 125,75 150,75" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="223" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Q′ fed back to the J-side AND gate</text><text x="300" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">JK flip-flop: an SR flip-flop with S = JQ′ and R = KQ</text>
