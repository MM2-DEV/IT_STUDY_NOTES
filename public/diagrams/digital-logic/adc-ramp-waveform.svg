<svg xmlns="http://www.w3.org/2000/svg" width="540" height="270" viewBox="0 0 540 270" role="img" aria-label="Digital ramp waveform">
<title>Digital ramp waveform</title>
<rect width="540" height="270" fill="#ffffff"/>
<line x1="60" y1="220" x2="470" y2="220" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="60" y1="220" x2="60" y2="30" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="470" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">time (clock pulses)</text><text x="55" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">voltage</text><polyline points="60,220 60,220 60,198 100,198 100,198 100,176 140,176 140,176 140,154 180,154 180,154 180,132 220,132 220,132 220,110 260,110 260,110 260,88 300,88" fill="none" stroke="#08595a" stroke-width="2.5"/><line x1="60" y1="101.19999999999999" x2="460" y2="101.19999999999999" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/><text x="465" y="101.19999999999999" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" font-style="italic" fill="#c2410c" text-anchor="start" dominant-baseline="middle">Vi</text><text x="272" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#08595a" text-anchor="start" dominant-baseline="middle">Va (DAC output)</text><line x1="260" y1="220" x2="260" y2="78" stroke="#7a8a8d" stroke-dasharray="3 3"/><text x="266" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">Va ≥ Vi: clock stops, count = 6</text><text x="270" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Staircase (digital ramp) voltage of a counter type ADC</text>
</svg>
