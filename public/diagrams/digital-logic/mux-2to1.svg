<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="2×1 multiplexer">
<title>2×1 multiplexer</title>
<rect width="580" height="200" fill="#ffffff"/>
<path d="M200,25 H230 A25,25 0 0 1 230,75 H200 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M200,115 H230 A25,25 0 0 1 230,165 H200 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M100,75 L142,95 L100,115 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><circle cx="147" cy="95" r="5" fill="#fff" stroke="#17292d" stroke-width="2"/><path d="M320,65 Q338,90 320,115 Q362,115 382,90 Q362,65 320,65 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><line x1="40" y1="40" x2="200" y2="40" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="26" y="40" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">I0</text><line x1="40" y1="150" x2="200" y2="150" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="26" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">I1</text><line x1="40" y1="95" x2="100" y2="95" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="26" y="95" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">S</text><circle cx="70" cy="95" r="3" fill="#17292d"/><polyline points="152,95 175,95 175,60 200,60" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="165" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">S′</text><polyline points="70,95 70,130 200,130" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="255,50 290,50 290,80 327.56,80" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="255,140 290,140 290,100 327.56,100" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="382" y1="90" x2="420" y2="90" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="428" y="90" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Y = S′I0 + SI1</text><text x="290" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">2×1 multiplexer: S = 0 selects I0, S = 1 selects I1</text>
</svg>
