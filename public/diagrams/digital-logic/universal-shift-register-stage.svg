<svg xmlns="http://www.w3.org/2000/svg" width="660" height="270" viewBox="0 0 660 270" role="img" aria-label="Universal shift register stage">
<title>Universal shift register stage</title>
<rect width="660" height="270" fill="#ffffff"/>
<rect x="270" y="30" width="90" height="140" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="315" y="90" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4×1</text><text x="315" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">MUX</text><text x="276" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">0</text><text x="276" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">1</text><text x="276" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">2</text><text x="276" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">3</text><text x="354" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Y</text><text x="295" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">S1</text><text x="335" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">S0</text><rect x="420" y="65" width="70" height="70" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="455" y="100" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">FFi</text><text x="426" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">D</text><text x="484" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">Q</text><path d="M420,108 L430,115 L420,122" fill="none" stroke="#17292d" stroke-width="1.6"/><line x1="360" y1="85" x2="420" y2="85" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="220" y1="80" x2="270" y2="80" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="214" y="80" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="end" dominant-baseline="middle">Q of previous stage (shift right)</text><line x1="220" y1="110" x2="270" y2="110" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="214" y="110" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="end" dominant-baseline="middle">Q of next stage (shift left)</text><line x1="220" y1="140" x2="270" y2="140" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="214" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="end" dominant-baseline="middle">parallel input Ii (load)</text><line x1="490" y1="85" x2="570" y2="85" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="578" y="85" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Qi</text><circle cx="530" cy="85" r="3" fill="#17292d"/><polyline points="530,85 530,8 240,8 240,50 270,50" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="522" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">own output Qi fed back to input 0 (hold)</text><line x1="295" y1="170" x2="295" y2="190" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="335" y1="170" x2="335" y2="190" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="315" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">S1 S0 (shared by all stages)</text><polyline points="410,230 405,230 405,115 420,115" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="380" y1="230" x2="410" y2="230" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="360" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">CLK</text><text x="330" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">One stage of a universal shift register: a 4×1 MUX selects the D input of each flip-flop</text>
</svg>
