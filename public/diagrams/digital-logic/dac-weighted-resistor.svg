ht="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">4R</text><line x1="160" y1="160" x2="230" y2="160" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="230" y1="40" x2="230" y2="160" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><circle cx="230" cy="100" r="3" fill="#17292d"/><polyline points="230,140 300,140" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="230" cy="140" r="3" fill="#17292d"/><path d="M300,120 L380,160 L300,200 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="312" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">−</text><text x="312" y="180" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">+</text><polyline points="300,180 285,180 285,195" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="273" y1="195" x2="297" y2="195" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="278" y1="200" x2="292" y2="200" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="282" y1="205" x2="288" y2="205" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><circle cx="260" cy="140" r="3" fill="#17292d"/><polyline points="260,140 260,240 320,240" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="320,240 325,233 333,247 341,233 349,247 355,233 360,240" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="340" y="223" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Rf</text><polyline points="360,240 420,240 420,160" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="420" cy="160" r="3" fill="#17292d"/><line x1="380" y1="160" x2="470" y2="160" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="478" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">V0</text><text x="40" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">each bit input is 0 V (bit 0) or −VR (bit 1)</text><text x="280" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">3-bit binary weighted resistor DAC: resistors R, 2R, 4R feed an inverting adder</text>
