<svg xmlns="http://www.w3.org/2000/svg" width="640" height="248" viewBox="0 0 640 248" role="img" aria-label="Majority circuit">
<title>Majority circuit</title>
<rect width="640" height="248" fill="#ffffff"/>
<path d="M170,20 H200 A25,25 0 0 1 200,70 H170 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M170,90 H200 A25,25 0 0 1 200,140 H170 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M170,160 H200 A25,25 0 0 1 200,210 H170 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M320,85 Q338,115 320,145 Q362,145 382,115 Q362,85 320,85 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="50" y="12" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><text x="75" y="12" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text><text x="100" y="12" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C</text><line x1="50" y1="22" x2="50" y2="175" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="75" y1="22" x2="75" y2="105" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="100" y1="22" x2="100" y2="195" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><circle cx="50" cy="35" r="3" fill="#17292d"/><line x1="50" y1="35" x2="170" y2="35" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="50" y1="175" x2="170" y2="175" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><circle cx="75" cy="55" r="3" fill="#17292d"/><line x1="75" y1="55" x2="170" y2="55" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="75" y1="105" x2="170" y2="105" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><circle cx="100" cy="125" r="3" fill="#17292d"/><line x1="100" y1="125" x2="170" y2="125" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="100" y1="195" x2="170" y2="195" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><polyline points="225,45 290,45 290,97 325.76,97" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="255" y="33" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">AB</text><line x1="225" y1="115" x2="329" y2="115" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="255" y="103" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">BC</text><polyline points="225,185 290,185 290,133 325.76,133" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="255" y="173" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">CA</text><line x1="382" y1="115" x2="420" y2="115" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="428" y="115" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">F = AB + BC + CA</text><text x="320" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Majority circuit: output 1 when two or more inputs are 1</text>
</svg>
