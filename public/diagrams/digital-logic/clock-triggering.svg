<svg xmlns="http://www.w3.org/2000/svg" width="500" height="165" viewBox="0 0 500 165" role="img" aria-label="Clock signal triggering">
<title>Clock signal triggering</title>
<rect width="500" height="165" fill="#ffffff"/>
<polyline points="40,110 100,110 100,40 200,40 200,110 300,110 300,40 400,40 400,110 460,110" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M100,80 l-6,10 h12 Z" fill="#08595a"/><text x="100" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">positive (rising) edge</text><path d="M200,70 l-6,-10 h12 Z" fill="#c2410c"/><text x="220" y="25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">negative (falling) edge</text><text x="350" y="25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">high level (1)</text><text x="250" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">low level (0)</text><text x="250" y="152" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Clock signal: levels and edges used to trigger flip-flops</text>
</svg>
