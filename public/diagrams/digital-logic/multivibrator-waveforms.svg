<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" role="img" aria-label="Multivibrator waveforms">
<title>Multivibrator waveforms</title>
<rect width="620" height="320" fill="#ffffff"/>
<text x="20" y="50" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Astable output</text><polyline points="130,60 170,60 170,34 230,34 230,60 290,60 290,34 350,34 350,60 410,60 410,34 470,34 470,60 530,60 530,34 590,34 590,60 600,60" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="20" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Trigger pulses</text><line x1="130" y1="130" x2="600" y2="130" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><polyline points="177,130 180,104 183,130" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="337,130 340,104 343,130" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="497,130 500,104 503,130" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="20" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Monostable output</text><polyline points="130,200 180,200 180,174 250,174 250,200 340,200 340,174 410,174 410,200 500,200 500,174 570,174 570,200 600,200" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="180" y1="158" x2="250" y2="158" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="180" y1="153" x2="180" y2="163" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><line x1="250" y1="153" x2="250" y2="163" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="215" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">width T (set by RC)</text><text x="20" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Bistable output</text><polyline points="130,270 180,270 180,244 340,244 340,270 500,270 500,244 600,244" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="180" y1="100" x2="180" y2="280" stroke="#9aa9ab" stroke-width="1" stroke-dasharray="4 4"/><line x1="340" y1="100" x2="340" y2="280" stroke="#9aa9ab" stroke-width="1" stroke-dasharray="4 4"/><line x1="500" y1="100" x2="500" y2="280" stroke="#9aa9ab" stroke-width="1" stroke-dasharray="4 4"/><text x="310" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Outputs of the astable, monostable and bistable multivibrators</text>
