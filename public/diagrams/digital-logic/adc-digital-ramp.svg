l, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">enable</text><line x1="0" y1="155" x2="40" y2="155" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><path d="M40,155 l-9,-5 v10 Z" fill="#17292d"/><text x="18" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">start</text><text x="250" y="315" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Digital ramp (counter type) ADC</text>
