<svg xmlns="http://www.w3.org/2000/svg" width="500" height="205" viewBox="0 0 500 205" role="img" aria-label="Op-amp comparator">
<title>Op-amp comparator</title>
<rect width="500" height="205" fill="#ffffff"/>
<path d="M200,40 L280,80 L200,120 Z" fill="#fff" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="212" y="60" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">+</text><text x="212" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">−</text><line x1="80" y1="60" x2="200" y2="60" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="64" y="60" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Vi</text><line x1="80" y1="100" x2="200" y2="100" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="56" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Vref</text><line x1="280" y1="80" x2="360" y2="80" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><text x="368" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Vo</text><text x="310" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">Vi > Vref → Vo = +Vsat</text><text x="310" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">Vi &lt; Vref → Vo = −Vsat</text><text x="250" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Non-inverting comparator: input at +, reference at −</text>
</svg>
