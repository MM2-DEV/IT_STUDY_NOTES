<svg xmlns="http://www.w3.org/2000/svg" width="500" height="315" viewBox="0 0 500 315" role="img" aria-label="Asynchronous sequential circuit model">
<title>Asynchronous sequential circuit model</title>
<rect width="500" height="315" fill="#ffffff"/>
<rect x="160" y="40" width="180" height="140" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="250" y="100" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Combinational</text><text x="250" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">circuit</text><line x1="60" y1="60" x2="160" y2="60" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><path d="M160,60 l-9,-5 v10 Z" fill="#17292d"/><text x="46" y="60" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">x1</text><line x1="60" y1="100" x2="160" y2="100" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><path d="M160,100 l-9,-5 v10 Z" fill="#17292d"/><text x="46" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">xn</text><text x="110" y="82" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">⋮</text><text x="90" y="30" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">inputs</text><line x1="340" y1="60" x2="440" y2="60" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><path d="M440,60 l-9,-5 v10 Z" fill="#17292d"/><text x="456" y="60" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">z1</text><line x1="340" y1="100" x2="440" y2="100" stroke="#17292d" stroke-width="2" stroke-linecap="round"/><path d="M440,100 l-9,-5 v10 Z" fill="#17292d"/><text x="456" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#17292d" text-anchor="middle" dominant-baseline="middle">zm</text><text x="410" y="30" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">outputs</text><polyline points="340,150 420,150 420,230 310,230" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Y</text><rect x="250" y="212" width="60" height="36" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="280" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Δ</text><polyline points="250,230 110,230 110,150 160,150" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M160,150 l-9,-5 v10 Z" fill="#17292d"/><text x="180" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">y</text><text x="250" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Y = next state, y = present state, Δ = delay in the feedback path</text><text x="250" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Model of an asynchronous (fundamental mode) sequential circuit</text>
</svg>
