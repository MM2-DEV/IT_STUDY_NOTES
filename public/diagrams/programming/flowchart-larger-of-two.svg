<rect x="190" y="20" width="120" height="40" rx="20" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="250" y="40" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Start</text><polyline points="250,60 250,95" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M250,95 L254.3496553411123,85.99552897647322 L245.6503446588877,85.99552897647322 Z" fill="#17292d"/><path d="M181,98 H351 L319,142 H149 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="250" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Read a, b</text><polyline points="250,142 250,180" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M250,180 L254.3496553411123,170.99552897647322 L245.6503446588877,170.99552897647322 Z" fill="#17292d"/><path d="M250,180 L325,220 L250,260 L175,220 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="250" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Is a > b ?</text><polyline points="175,220 110,220 110,285" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M110,285 L114.34965534111231,275.9955289764732 L105.6503446588877,275.9955289764732 Z" fill="#17292d"/><text x="135" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Yes</text><path d="M61,288 H191 L159,332 H29 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="110" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Print a</text><polyline points="325,220 390,220 390,285" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M390,285 L394.3496553411123,275.9955289764732 L385.6503446588877,275.9955289764732 Z" fill="#17292d"/><text x="333" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">No</text><path d="M341,288 H471 L439,332 H309 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="390" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Print b</text><polyline points="110,332 110,380 250,380 250,405" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M250,405 L254.3496553411123,395.9955289764732 L245.6503446588877,395.9955289764732 Z" fill="#17292d"/><polyline points="390,332 390,380 252,380" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M252,380 L261.0044710235268,384.3496553411123 L261.0044710235268,375.6503446588877 Z" fill="#17292d"/><rect x="190" y="405" width="120" height="40" rx="20" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="250" y="425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Stop</text><text x="250" y="475" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Decision: printing the larger of two numbers</text>
