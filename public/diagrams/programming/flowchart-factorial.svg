<svg xmlns="http://www.w3.org/2000/svg" width="460" height="680" viewBox="0 0 460 680" role="img" aria-label="Flowchart: factorial">
<title>Flowchart: factorial</title>
<rect width="460" height="680" fill="#ffffff"/>
<rect x="160" y="20" width="120" height="40" rx="20" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="220" y="40" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Start</text><polyline points="220,60 220,95" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M220,95 L224.3496553411123,85.99552897647322 L215.6503446588877,85.99552897647322 Z" fill="#17292d"/><path d="M151,98 H321 L289,142 H119 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="220" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Read n</text><polyline points="220,142 220,177" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M220,177 L224.3496553411123,167.99552897647322 L215.6503446588877,167.99552897647322 Z" fill="#17292d"/><rect x="135" y="178" width="170" height="44" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="220" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">fact = 1, i = 1</text><polyline points="220,222 220,260" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M220,260 L224.3496553411123,250.99552897647322 L215.6503446588877,250.99552897647322 Z" fill="#17292d"/><path d="M220,260 L295,300 L220,340 L145,300 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="220" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Is i ≤ n ?</text><polyline points="220,340 220,380" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M220,380 L224.3496553411123,370.9955289764732 L215.6503446588877,370.9955289764732 Z" fill="#17292d"/><text x="228" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Yes</text><rect x="135" y="380" width="170" height="44" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="220" y="402" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">fact = fact × i</text><polyline points="220,424 220,459" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M220,459 L224.3496553411123,449.9955289764732 L215.6503446588877,449.9955289764732 Z" fill="#17292d"/><rect x="135" y="460" width="170" height="44" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="220" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">i = i + 1</text><polyline points="135,482 60,482 60,300 145,300" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M145,300 L135.99552897647322,295.6503446588877 L135.99552897647322,304.3496553411123 Z" fill="#17292d"/><polyline points="295,300 400,300 400,540 290,540" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M290,540 L299.0044710235268,544.3496553411123 L299.0044710235268,535.6503446588877 Z" fill="#17292d"/><text x="303" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">No</text><path d="M171,518 H301 L269,562 H139 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="220" y="540" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Print fact</text><polyline points="220,562 220,597" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M220,597 L224.3496553411123,587.9955289764732 L215.6503446588877,587.9955289764732 Z" fill="#17292d"/><rect x="160" y="597" width="120" height="40" rx="20" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="220" y="617" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Stop</text><text x="230" y="665" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Loop: factorial of n (n! = 1 × 2 × … × n)</text>
</svg>
