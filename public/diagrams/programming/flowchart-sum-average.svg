<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-label="Flowchart: sum and average">
<title>Flowchart: sum and average</title>
<rect width="400" height="500" fill="#ffffff"/>
<rect x="140" y="20" width="120" height="40" rx="20" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="200" y="40" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Start</text><polyline points="200,60 200,95" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M200,95 L204.3496553411123,85.99552897647322 L195.6503446588877,85.99552897647322 Z" fill="#17292d"/><path d="M131,98 H301 L269,142 H99 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="200" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Read a, b, c</text><polyline points="200,142 200,177" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M200,177 L204.3496553411123,167.99552897647322 L195.6503446588877,167.99552897647322 Z" fill="#17292d"/><rect x="115" y="178" width="170" height="44" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="200" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">sum = a + b + c</text><polyline points="200,222 200,257" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M200,257 L204.3496553411123,247.99552897647322 L195.6503446588877,247.99552897647322 Z" fill="#17292d"/><rect x="115" y="258" width="170" height="44" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="200" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">avg = sum / 3</text><polyline points="200,302 200,337" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M200,337 L204.3496553411123,327.9955289764732 L195.6503446588877,327.9955289764732 Z" fill="#17292d"/><path d="M131,338 H301 L269,382 H99 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="200" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Print sum, avg</text><polyline points="200,382 200,417" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M200,417 L204.3496553411123,407.9955289764732 L195.6503446588877,407.9955289764732 Z" fill="#17292d"/><rect x="140" y="420" width="120" height="40" rx="20" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="200" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Stop</text><text x="200" y="485" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Sequence: sum and average of three numbers</text>
</svg>
