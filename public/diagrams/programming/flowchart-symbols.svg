<svg xmlns="http://www.w3.org/2000/svg" width="800" height="782" viewBox="0 0 800 782" role="img" aria-label="Flowchart symbols">
<title>Flowchart symbols</title>
<rect width="800" height="782" fill="#ffffff"/>
<text x="110" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Symbol</text><text x="250" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Name</text><text x="430" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">Meaning</text><g transform="translate(0 68)"><rect x="50" y="-20" width="120" height="40" rx="20" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="110" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Start / Stop</text></g><text x="250" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Terminal</text><text x="430" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Start or end of the flowchart (oval)</text><line x1="10" y1="107" x2="790" y2="107" stroke="#d5e0e0" stroke-width="1"/><g transform="translate(0 146)"><path d="M56,-22 H196 L164,22 H24 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="110" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Read / Print</text></g><text x="250" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Input / Output</text><text x="430" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Reading data or printing results (parallelogram)</text><line x1="10" y1="185" x2="790" y2="185" stroke="#d5e0e0" stroke-width="1"/><g transform="translate(0 224)"><rect x="35" y="-22" width="150" height="44" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="110" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">sum = a + b</text></g><text x="250" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Process</text><text x="430" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Calculation or assignment (rectangle)</text><line x1="10" y1="263" x2="790" y2="263" stroke="#d5e0e0" stroke-width="1"/><g transform="translate(0 302)"><path d="M110,-32 L170,0 L110,32 L50,0 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="110" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">a > b ?</text></g><text x="250" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Decision</text><text x="430" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Question with Yes/No (True/False) exits (diamond)</text><line x1="10" y1="341" x2="790" y2="341" stroke="#d5e0e0" stroke-width="1"/><g transform="translate(0 380)"><polyline points="60,0 160,0" fill="none" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><path d="M160,0 L150.99552897647322,-4.349655341112302 L150.99552897647322,4.349655341112302 Z" fill="#17292d"/></g><text x="250" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Flow line</text><text x="430" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Direction of flow (arrow)</text><line x1="10" y1="419" x2="790" y2="419" stroke="#d5e0e0" stroke-width="1"/><g transform="translate(0 458)"><circle cx="110" cy="0" r="16" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="110" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text></g><text x="250" y="458" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">On-page connector</text><text x="430" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Joins parts on the same page (small circle)</text><line x1="10" y1="497" x2="790" y2="497" stroke="#d5e0e0" stroke-width="1"/><g transform="translate(0 536)"><path d="M92,-18 H128 V6 L110,20 L92,6 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="110" y="-2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">B</text></g><text x="250" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Off-page connector</text><text x="430" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">Continues on another page (pentagon)</text><line x1="10" y1="575" x2="790" y2="575" stroke="#d5e0e0" stroke-width="1"/><g transform="translate(0 614)"><rect x="35" y="-22" width="150" height="44" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="110" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Find average</text><line x1="47" y1="-22" x2="47" y2="22" stroke="#17292d" stroke-width="2"/><line x1="173" y1="-22" x2="173" y2="22" stroke="#17292d" stroke-width="2"/></g><text x="250" y="614" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Predefined process</text><text x="430" y="614" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">A sub-program (module) defined elsewhere</text><line x1="10" y1="653" x2="790" y2="653" stroke="#d5e0e0" stroke-width="1"/><g transform="translate(0 692)"><path d="M45,-25 H175 V17 Q142.5,3 110,17 T45,17 Z" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-linejoin="round"/><text x="110" y="-4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Report</text></g><text x="250" y="692" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Document</text><text x="430" y="692" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="start" dominant-baseline="middle">A printed document or report</text><line x1="10" y1="731" x2="790" y2="731" stroke="#d5e0e0" stroke-width="1"/><text x="400" y="768" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Standard flowchart symbols</text>
</svg>
