<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" role="img" aria-label="JDK, JRE and JVM">
<title>JDK, JRE and JVM</title>
<rect width="660" height="360" fill="#ffffff"/>
<rect x="20" y="20" width="620" height="300" rx="10" fill="#f4f0f6" stroke="#17292d" stroke-width="2"/><text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">JDK (Java Development Kit)</text><text x="40" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">= JRE + development tools</text><rect x="40" y="90" width="380" height="210" rx="10" fill="#e2f3f3" stroke="#17292d" stroke-width="2"/><text x="58" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="start" dominant-baseline="middle">JRE (Java Runtime Environment)</text><text x="58" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">= JVM + class libraries + supporting files</text><rect x="60" y="156" width="200" height="124" rx="10" fill="#ffffff" stroke="#17292d" stroke-width="2"/><text x="160" y="178" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">JVM</text><text x="160" y="204.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">class loader</text><text x="160" y="221.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">runtime data areas</text><text x="160" y="238.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">execution engine</text><text x="160" y="255.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(interpreter + JIT + GC)</text><rect x="272" y="156" width="132" height="124" rx="10" fill="#ffffff" stroke="#17292d" stroke-width="2"/><text x="338" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">class libraries</text><text x="338" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(java.lang,</text><text x="338" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">java.util, java.io …)</text><rect x="440" y="90" width="180" height="210" rx="10" fill="#ffffff" stroke="#17292d" stroke-width="2"/><text x="530" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Development tools</text><text x="530" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">javac (compiler)</text><text x="530" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">java (launcher)</text><text x="530" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">jdb (debugger)</text><text x="530" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">jar (archiver)</text><text x="530" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">javadoc (docs)</text><text x="330" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">The JDK contains the JRE, and the JRE contains the JVM</text>
</svg>
