<svg xmlns="http://www.w3.org/2000/svg" width="790" height="360" viewBox="0 0 790 360" role="img" aria-label="Process state diagram">
<title>Process state diagram</title>
<rect width="790" height="360" fill="#ffffff"/>
<ellipse cx="80" cy="70" rx="68" ry="28" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="80" y="71" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">New</text><ellipse cx="260" cy="170" rx="68" ry="28" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="260" y="171" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Ready</text><ellipse cx="520" cy="170" rx="68" ry="28" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="520" y="171" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Running</text><ellipse cx="700" cy="70" rx="68" ry="28" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="700" y="71" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Terminated</text><ellipse cx="390" cy="300" rx="68" ry="28" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="390" y="301" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Waiting</text><path d="M125,92 L205,148" fill="none" stroke="#17292d" stroke-width="2"/><path d="M205,148 L195.1,146.4 L200.1,139.3 Z" fill="#17292d"/><text x="137" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">admitted</text><path d="M320,155 Q390,135 460,155" fill="none" stroke="#17292d" stroke-width="2"/><path d="M460,155 L450.1,156.7 L452.5,148.3 Z" fill="#17292d"/><text x="390" y="133" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">scheduler dispatch</text><path d="M460,185 Q390,205 320,185" fill="none" stroke="#17292d" stroke-width="2"/><path d="M320,185 L329.9,183.3 L327.5,191.7 Z" fill="#17292d"/><text x="390" y="207" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">interrupt (time slice over)</text><path d="M570,150 L660,92" fill="none" stroke="#17292d" stroke-width="2"/><path d="M660,92 L654.8,100.5 L650.1,93.2 Z" fill="#17292d"/><text x="637" y="121" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">exit</text><path d="M500,197 L430,274" fill="none" stroke="#17292d" stroke-width="2"/><path d="M430,274 L432.8,264.4 L439.3,270.3 Z" fill="#17292d"/><text x="527" y="235.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">I/O or event wait</text><path d="M350,274 L280,197" fill="none" stroke="#17292d" stroke-width="2"/><path d="M280,197 L289.3,200.7 L282.8,206.6 Z" fill="#17292d"/><text x="237" y="235.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">I/O or event completion</text><text x="395" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Five-state process model</text>
</svg>
