<svg xmlns="http://www.w3.org/2000/svg" width="780" height="455" viewBox="0 0 780 455" role="img" aria-label="Context switch">
<title>Context switch</title>
<rect width="780" height="455" fill="#ffffff"/>
<text x="110" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Process P0</text><text x="390" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Operating system</text><text x="670" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Process P1</text><rect x="100" y="50" width="20" height="60" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="135" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">executing</text><path d="M120,110 L290,125" fill="none" stroke="#17292d" stroke-width="2"/><path d="M290,125 L280.6,128.5 L281.4,119.9 Z" fill="#17292d"/><text x="205" y="107.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">interrupt or system call</text><rect x="290" y="115" width="200" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="390" y="132" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">save state into PCB0</text><rect x="290" y="165" width="200" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="390" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">reload state from PCB1</text><path d="M490,199 L660,215" fill="none" stroke="#17292d" stroke-width="2"/><path d="M660,215 L650.6,218.5 L651.4,209.8 Z" fill="#17292d"/><line x1="110" y1="110" x2="110" y2="230" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 5"/><text x="95" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">idle</text><rect x="660" y="215" width="20" height="60" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="695" y="245" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">executing</text><path d="M660,275 L490,290" fill="none" stroke="#17292d" stroke-width="2"/><path d="M490,290 L498.6,284.9 L499.4,293.5 Z" fill="#17292d"/><text x="575" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">interrupt or system call</text><rect x="290" y="280" width="200" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="390" y="297" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">save state into PCB1</text><rect x="290" y="330" width="200" height="34" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="390" y="347" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">reload state from PCB0</text><line x1="670" y1="60" x2="670" y2="215" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 5"/><line x1="670" y1="275" x2="670" y2="390" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 5"/><text x="685" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">idle</text><path d="M290,364 L120,380" fill="none" stroke="#17292d" stroke-width="2"/><path d="M120,380 L128.6,374.8 L129.4,383.5 Z" fill="#17292d"/><rect x="100" y="380" width="20" height="40" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="135" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">executing</text><text x="390" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Context switch from process P0 to P1 and back; the CPU does no useful work during the switch</text>
</svg>
