<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-label="Layered file system">
<title>Layered file system</title>
<rect width="600" height="370" fill="#ffffff"/>
<rect x="60" y="20" width="480" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="300" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Application programs</text><path d="M300,60 L300,74" fill="none" stroke="#17292d" stroke-width="2"/><path d="M300,74 L295.7,65.0 L304.3,65.0 Z" fill="#17292d"/><rect x="60" y="74" width="480" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="300" y="94" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Logical file system (metadata, FCBs, directories)</text><path d="M300,114 L300,128" fill="none" stroke="#17292d" stroke-width="2"/><path d="M300,128 L295.7,119.0 L304.3,119.0 Z" fill="#17292d"/><rect x="60" y="128" width="480" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="300" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">File-organization module (logical → physical blocks, free space)</text><path d="M300,168 L300,182" fill="none" stroke="#17292d" stroke-width="2"/><path d="M300,182 L295.7,173.0 L304.3,173.0 Z" fill="#17292d"/><rect x="60" y="182" width="480" height="40" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="300" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Basic file system (buffers, caches, generic block I/O)</text><path d="M300,222 L300,236" fill="none" stroke="#17292d" stroke-width="2"/><path d="M300,236 L295.7,227.0 L304.3,227.0 Z" fill="#17292d"/><rect x="60" y="236" width="480" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="300" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">I/O control (device drivers, interrupt handlers)</text><path d="M300,276 L300,290" fill="none" stroke="#17292d" stroke-width="2"/><path d="M300,290 L295.7,281.0 L304.3,281.0 Z" fill="#17292d"/><rect x="60" y="290" width="480" height="40" rx="6" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><text x="300" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Devices (disks, SSDs)</text><text x="300" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Layered file system</text>
</svg>
