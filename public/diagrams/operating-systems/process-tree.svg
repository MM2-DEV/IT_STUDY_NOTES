<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" aria-label="Process tree">
<title>Process tree</title>
<rect width="660" height="420" fill="#ffffff"/>
<line x1="320" y1="40" x2="320" y2="120" stroke="#17292d" stroke-width="2"/><line x1="320" y1="120" x2="320" y2="200" stroke="#17292d" stroke-width="2"/><line x1="320" y1="200" x2="210" y2="290" stroke="#17292d" stroke-width="2"/><line x1="320" y1="200" x2="430" y2="290" stroke="#17292d" stroke-width="2"/><line x1="210" y1="290" x2="210" y2="375" stroke="#17292d" stroke-width="2"/><rect x="260" y="20" width="120" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="320" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">init (PID 1)</text><rect x="260" y="100" width="120" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="320" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">shell</text><rect x="260" y="180" width="120" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="320" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P</text><rect x="150" y="270" width="120" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="210" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C1</text><rect x="370" y="270" width="120" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="430" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C2</text><rect x="150" y="355" width="120" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="210" y="375" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">C3</text><text x="500" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">both created by</text><text x="500" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">P calling fork() twice</text><text x="330" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Process tree: P's two fork() calls create C1 and C2; C1 runs the second fork() and creates C3</text>
</svg>
