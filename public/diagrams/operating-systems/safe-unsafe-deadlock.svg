<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Safe, unsafe and deadlock states">
<title>Safe, unsafe and deadlock states</title>
<rect width="760" height="300" fill="#ffffff"/>
<g transform="translate(120,0)"><ellipse cx="260" cy="150" rx="230" ry="120" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><ellipse cx="330" cy="160" rx="140" ry="85" fill="#f2b880" stroke="#17292d" stroke-width="2"/><ellipse cx="370" cy="170" rx="65" ry="42" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="120" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">safe</text><text x="250" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">unsafe</text><text x="370" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">deadlock</text></g><text x="380" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Safe, unsafe and deadlocked state spaces: every deadlock is unsafe, but not every unsafe state is a deadlock</text>
</svg>
