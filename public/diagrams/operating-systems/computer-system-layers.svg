<svg xmlns="http://www.w3.org/2000/svg" width="600" height="385" viewBox="0 0 600 385" role="img" aria-label="Layers of a computer system">
<title>Layers of a computer system</title>
<rect width="600" height="385" fill="#ffffff"/>
<circle cx="100" cy="40" r="30" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="100" y="41" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">User 1</text><circle cx="230" cy="40" r="30" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="230" y="41" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">User 2</text><circle cx="360" cy="40" r="30" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="360" y="41" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">User 3</text><circle cx="490" cy="40" r="30" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="490" y="41" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">User 4</text><rect x="40" y="100" width="520" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="300" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Application programs</text><text x="300" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(word processor, browser, games)</text><rect x="40" y="165" width="520" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="300" y="181" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">System programs</text><text x="300" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(compilers, editors, command interpreter)</text><rect x="40" y="230" width="520" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="300" y="255" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Operating system</text><rect x="40" y="295" width="520" height="50" rx="6" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><text x="300" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Computer hardware</text><text x="300" y="329" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(CPU, memory, I/O devices)</text><path d="M100,72 L100,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M100,98 L95.7,89.0 L104.3,89.0 Z" fill="#17292d"/><path d="M230,72 L230,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M230,98 L225.7,89.0 L234.3,89.0 Z" fill="#17292d"/><path d="M360,72 L360,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M360,98 L355.7,89.0 L364.3,89.0 Z" fill="#17292d"/><path d="M490,72 L490,98" fill="none" stroke="#17292d" stroke-width="2"/><path d="M490,98 L485.7,89.0 L494.3,89.0 Z" fill="#17292d"/><text x="300" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Abstract view of a computer system: the OS sits between the programs and the hardware</text>
</svg>
