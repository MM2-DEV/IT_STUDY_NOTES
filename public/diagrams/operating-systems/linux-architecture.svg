<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Linux architecture"><title>Linux architecture</title><rect width="600" height="320" fill="#ffffff"/><clipPath id="c"><rect width="600" height="295"/></clipPath><g clip-path="url(#c)"><circle cx="300" cy="280" r="260" fill="#dbda65" stroke="#17292d" stroke-width="2"/><circle cx="300" cy="280" r="205" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><circle cx="300" cy="280" r="150" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><circle cx="300" cy="280" r="85" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><text x="300" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hardware</text><text x="300" y="155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Kernel</text><text x="300" y="100" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Shell</text><text x="300" y="44" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Applications and utilities</text><text x="300" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">process, memory, files, devices</text><text x="300" y="125" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">bash, sh, csh, ksh, zsh</text><text x="300" y="64" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">ls, cp, vi, gcc, browsers</text></g><text x="300" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Layers of the Linux system</text></svg>
