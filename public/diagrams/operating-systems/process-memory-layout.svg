<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="Process in memory">
<title>Process in memory</title>
<rect width="720" height="370" fill="#ffffff"/>
<text x="138" y="30" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">max</text><text x="138" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">0</text><rect x="150" y="20" width="200" height="60" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="250" y="50" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Stack</text><rect x="150" y="80" width="200" height="120" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><path d="M250,85 L250,120" fill="none" stroke="#17292d" stroke-width="2"/><path d="M250,120 L245.7,111.0 L254.3,111.0 Z" fill="#17292d"/><path d="M250,195 L250,160" fill="none" stroke="#17292d" stroke-width="2"/><path d="M250,160 L254.3,169.0 L245.7,169.0 Z" fill="#17292d"/><text x="250" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">free space</text><rect x="150" y="200" width="200" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="250" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Heap</text><rect x="150" y="250" width="200" height="40" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="250" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data</text><rect x="150" y="290" width="200" height="40" rx="6" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="250" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Text (code)</text><text x="364" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">local variables, function parameters, return addresses</text><text x="364" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">dynamically allocated memory (malloc)</text><text x="364" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">global and static variables</text><text x="364" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">program instructions</text><text x="360" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">A process in memory: the stack and heap grow towards each other</text>
</svg>
