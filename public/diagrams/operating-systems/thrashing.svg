<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Thrashing">
<title>Thrashing</title>
<rect width="600" height="320" fill="#ffffff"/>
<line x1="60" y1="260" x2="560" y2="260" stroke="#17292d" stroke-width="2"/><line x1="60" y1="260" x2="60" y2="30" stroke="#17292d" stroke-width="2"/><path d="M560,260 L575,260" fill="none" stroke="#17292d" stroke-width="2"/><path d="M575,260 L566.0,264.3 L566.0,255.7 Z" fill="#17292d"/><path d="M60,30 L60,18" fill="none" stroke="#17292d" stroke-width="2"/><path d="M60,18 L64.3,27.0 L55.7,27.0 Z" fill="#17292d"/><text x="320" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">degree of multiprogramming</text><text x="25" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4b6166" text-anchor="middle" transform="rotate(-90 25 150)">CPU utilization</text><path d="M60,250 C150,120 230,60 320,60 C380,60 420,120 470,220 L520,245" fill="none" stroke="#08595a" stroke-width="3"/><line x1="400" y1="40" x2="400" y2="260" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/><text x="470" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle" dominant-baseline="middle">thrashing</text><text x="300" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Thrashing: beyond a point, more processes make CPU utilization fall sharply</text>
</svg>
