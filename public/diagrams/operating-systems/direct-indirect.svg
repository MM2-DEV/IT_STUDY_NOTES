<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-label="Direct and indirect communication">
<title>Direct and indirect communication</title>
<rect width="800" height="220" fill="#ffffff"/>
<text x="170" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">(a) Direct communication</text><text x="580" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">(b) Indirect communication</text><circle cx="80" cy="110" r="28" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="80" y="111" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P</text><circle cx="270" cy="110" r="28" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="270" y="111" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Q</text><path d="M108,100 L242,100" fill="none" stroke="#17292d" stroke-width="2"/><path d="M242,100 L233.0,104.3 L233.0,95.7 Z" fill="#17292d"/><text x="175" y="88" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">send(Q, msg)</text><path d="M242,122 L108,122" fill="none" stroke="#17292d" stroke-width="2"/><path d="M108,122 L117.0,117.7 L117.0,126.3 Z" fill="#17292d"/><text x="175" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">receive(P, msg)</text><circle cx="420" cy="70" r="26" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="420" y="71" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P1</text><circle cx="420" cy="160" r="26" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="420" y="161" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P2</text><rect x="520" y="90" width="90" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="565" y="106.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Mailbox</text><text x="565" y="123.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">A</text><circle cx="740" cy="115" r="26" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="740" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P3</text><path d="M446,78 L518,105" fill="none" stroke="#17292d" stroke-width="2"/><path d="M518,105 L508.0,105.9 L511.1,97.8 Z" fill="#17292d"/><text x="494" y="73.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">send(A, m)</text><path d="M446,152 L518,128" fill="none" stroke="#17292d" stroke-width="2"/><path d="M518,128 L510.8,135.0 L508.1,126.7 Z" fill="#17292d"/><text x="494" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">send(A, m)</text><path d="M610,115 L712,115" fill="none" stroke="#17292d" stroke-width="2"/><path d="M712,115 L703.0,119.3 L703.0,110.7 Z" fill="#17292d"/><text x="661" y="99" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">receive(A, m)</text><text x="400" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Direct communication names the process; indirect communication uses a shared mailbox</text>
</svg>
