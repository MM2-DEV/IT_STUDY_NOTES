<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-label="Wait-for graph">
<title>Wait-for graph</title>
<rect width="520" height="270" fill="#ffffff"/>
<circle cx="80" cy="60" r="26" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="80" y="61" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P1</text><circle cx="260" cy="60" r="26" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="260" y="61" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P2</text><circle cx="440" cy="60" r="26" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="440" y="61" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P3</text><circle cx="350" cy="200" r="26" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="350" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P4</text><circle cx="170" cy="200" r="26" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="170" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P5</text><path d="M106,60 L234,60" fill="none" stroke="#17292d" stroke-width="2"/><path d="M234,60 L225.0,64.3 L225.0,55.7 Z" fill="#17292d"/><path d="M286,60 L414,60" fill="none" stroke="#17292d" stroke-width="2"/><path d="M414,60 L405.0,64.3 L405.0,55.7 Z" fill="#17292d"/><path d="M428,84 L368,178" fill="none" stroke="#17292d" stroke-width="2"/><path d="M368,178 L369.2,168.1 L376.5,172.8 Z" fill="#17292d"/><path d="M324,200 L196,200" fill="none" stroke="#17292d" stroke-width="2"/><path d="M196,200 L205.0,195.7 L205.0,204.3 Z" fill="#17292d"/><path d="M160,176 L92,84" fill="none" stroke="#17292d" stroke-width="2"/><path d="M92,84 L100.9,88.7 L93.9,93.8 Z" fill="#17292d"/><path d="M250,86 L182,176" fill="none" stroke="#4b6166" stroke-width="2" stroke-dasharray="5 4"/><path d="M182,176 L184.0,166.2 L190.9,171.4 Z" fill="#4b6166"/><text x="260" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Wait-for graph: the cycle P1 → P2 → P3 → P4 → P5 → P1 means deadlock</text>
