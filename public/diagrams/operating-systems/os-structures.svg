<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Operating system structures">
<title>Operating system structures</title>
<rect width="900" height="290" fill="#ffffff"/>
<text x="140" y="25" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Layered structure</text><rect x="30" y="40" width="220" height="38" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="140" y="59" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Layer N: user interface</text><rect x="30" y="84" width="220" height="38" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="140" y="103" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">…</text><rect x="30" y="128" width="220" height="38" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="140" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Layer 2</text><rect x="30" y="172" width="220" height="38" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="140" y="191" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Layer 1</text><rect x="30" y="216" width="220" height="38" rx="6" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><text x="140" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Layer 0: hardware</text><text x="420" y="25" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Monolithic kernel</text><rect x="300" y="40" width="240" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="420" y="60" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Applications (user mode)</text><rect x="300" y="90" width="240" height="100" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="420" y="116" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Kernel (kernel mode):</text><text x="420" y="132" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">file system, scheduler,</text><text x="420" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">memory manager, IPC,</text><text x="420" y="164" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">device drivers</text><rect x="300" y="200" width="240" height="40" rx="6" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><text x="420" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hardware</text><text x="730" y="25" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">Microkernel</text><rect x="590" y="40" width="88" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="634" y="65" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Application</text><rect x="685" y="40" width="88" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="729" y="57" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">File</text><text x="729" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">server</text><rect x="780" y="40" width="88" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="824" y="57" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Device</text><text x="824" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">driver</text><rect x="590" y="120" width="280" height="70" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="730" y="139" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Microkernel (kernel mode):</text><text x="730" y="155" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">IPC, basic scheduling,</text><text x="730" y="171" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">low-level memory management</text><rect x="590" y="200" width="280" height="40" rx="6" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><text x="730" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Hardware</text><path d="M634,90 L634,120" fill="none" stroke="#17292d" stroke-width="2"/><path d="M634,120 L629.7,111.0 L638.3,111.0 Z" fill="#17292d"/><path d="M729,120 L729,90" fill="none" stroke="#17292d" stroke-width="2"/><path d="M729,90 L733.3,99.0 L724.7,99.0 Z" fill="#17292d"/><path d="M824,90 L824,120" fill="none" stroke="#17292d" stroke-width="2"/><path d="M824,120 L819.7,111.0 L828.3,111.0 Z" fill="#17292d"/><text x="450" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Layered, monolithic and microkernel structures (microkernel services run in user mode and communicate by messages)</text>
</svg>
