s-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">read</text><rect x="390" y="40" width="240" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="510" y="65" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Process A</text><rect x="390" y="180" width="240" height="50" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="510" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Process B</text><rect x="390" y="250" width="240" height="50" rx="6" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><text x="510" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Kernel (message queue)</text><line x1="420" y1="90" x2="420" y2="160" stroke="#17292d" stroke-width="2"/><line x1="420" y1="160" x2="360" y2="160" stroke="#17292d" stroke-width="2"/><line x1="360" y1="160" x2="360" y2="275" stroke="#17292d" stroke-width="2"/><path d="M360,275 L388,275" fill="none" stroke="#17292d" stroke-width="2"/><path d="M388,275 L379.0,279.3 L379.0,270.7 Z" fill="#17292d"/><text x="330" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">send(m)</text><line x1="632" y1="275" x2="660" y2="275" stroke="#17292d" stroke-width="2"/><line x1="660" y1="275" x2="660" y2="205" stroke="#17292d" stroke-width="2"/><path d="M660,205 L632,205" fill="none" stroke="#17292d" stroke-width="2"/><path d="M632,205 L641.0,200.7 L641.0,209.3 Z" fill="#17292d"/><text x="700" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">receive(m)</text><text x="380" 