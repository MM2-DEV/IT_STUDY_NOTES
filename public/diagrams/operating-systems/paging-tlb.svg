<svg xmlns="http://www.w3.org/2000/svg" width="730" height="300" viewBox="0 0 730 300" role="img" aria-label="Paging with TLB">
<title>Paging with TLB</title>
<rect width="730" height="300" fill="#ffffff"/>
<rect x="20" y="60" width="80" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="60" y="85" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">CPU</text><text x="160" y="50" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">p | d</text><path d="M100,85 L200,85" fill="none" stroke="#17292d" stroke-width="2"/><path d="M200,85 L191.0,89.3 L191.0,80.7 Z" fill="#17292d"/><rect x="200" y="40" width="140" height="100" rx="4" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="270" y="60" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">TLB</text><text x="270" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">page | frame</text><text x="270" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">(recent entries)</text><path d="M340,70 L470,70" fill="none" stroke="#17292d" stroke-width="2"/><path d="M470,70 L461.0,74.3 L461.0,65.7 Z" fill="#17292d"/><text x="405" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">TLB hit → f</text><path d="M270,140 L270,210" fill="none" stroke="#17292d" stroke-width="2"/><path d="M270,210 L265.7,201.0 L274.3,201.0 Z" fill="#17292d"/><text x="304" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">TLB miss</text><rect x="200" y="210" width="140" height="60" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="270" y="231.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Page table</text><text x="270" y="248.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(in memory)</text><line x1="340" y1="240" x2="420" y2="240" stroke="#17292d" stroke-width="2"/><line x1="420" y1="240" x2="420" y2="100" stroke="#17292d" stroke-width="2"/><path d="M420,100 L470,100" fill="none" stroke="#17292d" stroke-width="2"/><path d="M470,100 L461.0,104.3 L461.0,95.7 Z" fill="#17292d"/><text x="470" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">f (and update the TLB)</text><rect x="470" y="55" width="110" height="60" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="525" y="85" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">f | d</text><path d="M580,85 L620,85" fill="none" stroke="#17292d" stroke-width="2"/><path d="M620,85 L611.0,89.3 L611.0,80.7 Z" fill="#17292d"/><rect x="620" y="40" width="90" height="90" rx="6" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><text x="665" y="77" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Physical</text><text x="665" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">memory</text><text x="365" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Paging with a TLB: a hit needs one memory access, a miss needs two</text>
</svg>
