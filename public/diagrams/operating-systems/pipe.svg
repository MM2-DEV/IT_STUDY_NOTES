<svg xmlns="http://www.w3.org/2000/svg" width="680" height="195" viewBox="0 0 680 195" role="img" aria-label="Pipe between parent and child">
<title>Pipe between parent and child</title>
<rect width="680" height="195" fill="#ffffff"/>
<rect x="30" y="60" width="160" height="70" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="110" y="86.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Parent process</text><text x="110" y="103.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">write(fd[1], …)</text><rect x="490" y="60" width="160" height="70" rx="6" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="570" y="86.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Child process</text><text x="570" y="103.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">read(fd[0], …)</text><rect x="240" y="75" width="200" height="40" rx="20" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="340" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">pipe (kernel buffer, FIFO)</text><path d="M190,95 L240,95" fill="none" stroke="#17292d" stroke-width="2"/><path d="M240,95 L231.0,99.3 L231.0,90.7 Z" fill="#17292d"/><path d="M440,95 L490,95" fill="none" stroke="#17292d" stroke-width="2"/><path d="M490,95 L481.0,99.3 L481.0,90.7 Z" fill="#17292d"/><text x="215" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">fd[1]</text><text x="465" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">fd[0]</text><text x="340" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">write end → read end (data flows one way only)</text><text x="340" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">A pipe between a parent and its child created with pipe() before fork()</text>
</svg>
