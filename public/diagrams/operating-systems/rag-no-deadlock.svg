<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" role="img" aria-label="Resource allocation graph with a cycle but no deadlock">
<title>Resource allocation graph with a cycle but no deadlock</title>
<rect width="660" height="300" fill="#ffffff"/>
<g transform="translate(80,0)"><circle cx="80" cy="70" r="24" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="80" y="71" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P1</text><circle cx="80" cy="230" r="24" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="80" y="231" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P3</text><circle cx="420" cy="70" r="24" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="420" y="71" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P2</text><circle cx="420" cy="230" r="24" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="420" y="231" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">P4</text><rect x="220" y="48" width="60" height="44" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="250" y="36" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R1</text><circle cx="238" cy="70" r="5" fill="#17292d"/><circle cx="262" cy="70" r="5" fill="#17292d"/><rect x="220" y="208" width="60" height="44" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="250" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">R2</text><circle cx="238" cy="230" r="5" fill="#17292d"/><circle cx="262" cy="230" r="5" fill="#17292d"/><path d="M104,70 L218,70" fill="none" stroke="#17292d" stroke-width="2"/><path d="M218,70 L209.0,74.3 L209.0,65.7 Z" fill="#17292d"/><text x="161" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">request</text><path d="M238,92 L96,212" fill="none" stroke="#17292d" stroke-width="2"/><path d="M96,212 L100.1,202.9 L105.7,209.5 Z" fill="#17292d"/><path d="M262,92 L404,212" fill="none" stroke="#17292d" stroke-width="2"/><path d="M404,212 L394.3,209.5 L399.9,202.9 Z" fill="#17292d"/><path d="M238,208 L96,88" fill="none" stroke="#17292d" stroke-width="2"/><path d="M96,88 L105.7,90.5 L100.1,97.1 Z" fill="#17292d"/><path d="M262,208 L404,88" fill="none" stroke="#17292d" stroke-width="2"/><path d="M404,88 L399.9,97.1 L394.3,90.5 Z" fill="#17292d"/><path d="M104,230 L218,230" fill="none" stroke="#17292d" stroke-width="2"/><path d="M218,230 L209.0,234.3 L209.0,225.7 Z" fill="#17292d"/><text x="161" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">request</text></g><text x="330" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Cycle P1 → R1 → P3 → R2 → P1, but no deadlock: P2 and P4 can finish and release R1 and R2</text>
</svg>
