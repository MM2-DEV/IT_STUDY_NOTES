ht="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">400</text><text x="335" y="142" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#08595a" text-anchor="middle" dominant-baseline="middle">4300</text><text x="245" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1100</text><text x="335" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3200</text><polygon points="470,60 520,95 470,130 420,95" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="470" y="96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">d &lt; limit?</text><path d="M380,95 L420,95" fill="none" stroke="#17292d" stroke-width="2"/><path d="M420,95 L411.0,99.3 L411.0,90.7 Z" fill="#17292d"/><path d="M470,130 L470,175" fill="none" stroke="#17292d" stroke-width="2"/><path d="M470,175 L465.7,166.0 L474.3,166.0 Z" fill="#17292d"/><text x="512" y="152.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">no → trap</text><path d="M520,95 L570,95" fill="none" stroke="#17292d" stroke-width="2"/><path d="M570,95 L561.0,99.3 L561.0,90.7 Z" fill="#17292d"/><text x="545" y="83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">yes</text><rect x="570" y="70" width="120" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="630" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">base + d</text><text x="630" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4300 + 53 = 4353</text><text x="355" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Segmentation hardware: the offset is checked against the limit and added to the base</text>
