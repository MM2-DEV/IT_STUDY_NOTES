<svg xmlns="http://www.w3.org/2000/svg" width="810" height="140" viewBox="0 0 810 140" role="img" aria-label="UNIX file system layout">
<title>UNIX file system layout</title>
<rect width="810" height="140" fill="#ffffff"/>
<rect x="20" y="40" width="110" height="60" rx="0" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="75" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Boot block</text><rect x="130" y="40" width="120" height="60" rx="0" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="190" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Superblock</text><rect x="250" y="40" width="240" height="60" rx="0" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="370" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Inode list (inode table)</text><rect x="490" y="40" width="300" height="60" rx="0" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="640" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Data blocks</text><text x="405" y="125" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Layout of a UNIX file system on a disk partition</text>
</svg>
