<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" aria-label="Interrupt processing">
<title>Interrupt processing</title>
<rect width="680" height="440" fill="#ffffff"/>
<rect x="140" y="20" width="400" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="340" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">1. Device raises an interrupt (IRQ)</text><path d="M340,60 L340,78" fill="none" stroke="#17292d" stroke-width="2"/><path d="M340,78 L335.7,69.0 L344.3,69.0 Z" fill="#17292d"/><rect x="140" y="78" width="400" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="340" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">2. CPU finishes the current instruction</text><path d="M340,118 L340,136" fill="none" stroke="#17292d" stroke-width="2"/><path d="M340,136 L335.7,127.0 L344.3,127.0 Z" fill="#17292d"/><rect x="140" y="136" width="400" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="340" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">3. Save PC, registers and status; switch to kernel mode</text><path d="M340,176 L340,194" fill="none" stroke="#17292d" stroke-width="2"/><path d="M340,194 L335.7,185.0 L344.3,185.0 Z" fill="#17292d"/><rect x="140" y="194" width="400" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="340" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">4. Find the ISR address in the interrupt vector table</text><path d="M340,234 L340,252" fill="none" stroke="#17292d" stroke-width="2"/><path d="M340,252 L335.7,243.0 L344.3,243.0 Z" fill="#17292d"/><rect x="140" y="252" width="400" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="340" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">5. Interrupt service routine (ISR) runs</text><path d="M340,292 L340,310" fill="none" stroke="#17292d" stroke-width="2"/><path d="M340,310 L335.7,301.0 L344.3,301.0 Z" fill="#17292d"/><rect x="140" y="310" width="400" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="340" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">6. Restore the saved state</text><path d="M340,350 L340,368" fill="none" stroke="#17292d" stroke-width="2"/><path d="M340,368 L335.7,359.0 L344.3,359.0 Z" fill="#17292d"/><rect x="140" y="368" width="400" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="340" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">7. Resume the interrupted program (or dispatch another)</text><text x="340" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Steps of interrupt processing</text>
</svg>
