<svg xmlns="http://www.w3.org/2000/svg" width="830" height="330" viewBox="0 0 830 330" role="img" aria-label="Memory hierarchy">
<title>Memory hierarchy</title>
<rect width="830" height="330" fill="#ffffff"/>
<polygon points="255,30 345,30 392.5,82 207.5,82" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="300" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Registers</text><polygon points="207.5,82 392.5,82 440,134 160,134" fill="#cbadd1" stroke="#17292d" stroke-width="2"/><text x="300" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Cache</text><polygon points="160,134 440,134 487.5,186 112.5,186" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="300" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Main memory (RAM)</text><polygon points="112.5,186 487.5,186 535,238 65,238" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="300" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Secondary storage (disk, SSD)</text><polygon points="65,238 535,238 582.5,290 17.5,290" fill="#f2b880" stroke="#17292d" stroke-width="2"/><text x="300" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Tertiary storage (tape, optical)</text><path d="M620,290 L620,40" fill="none" stroke="#17292d" stroke-width="2"/><path d="M620,40 L624.3,49.0 L615.7,49.0 Z" fill="#17292d"/><text x="632" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="start" dominant-baseline="middle">faster, costlier per bit</text><path d="M800,40 L800,290" fill="none" stroke="#17292d" stroke-width="2"/><path d="M800,290 L795.7,281.0 L804.3,281.0 Z" fill="#17292d"/><text x="788" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="end" dominant-baseline="middle">larger capacity</text><text x="415" y="315" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Memory hierarchy: speed and cost per bit increase upwards; capacity increases downwards</text>
</svg>
