<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-label="Page fault handling">
<title>Page fault handling</title>
<rect width="820" height="330" fill="#ffffff"/>
<rect x="20" y="40" width="140" height="50" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="90" y="65" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">load M</text><text x="90" y="26" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">process</text><rect x="240" y="20" width="110" height="150" rx="4" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="295" y="12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">page table</text><rect x="250" y="70" width="90" height="30" rx="0" fill="#e8a0a0" stroke="#17292d" stroke-width="2"/><text x="295" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">i (invalid)</text><rect x="420" y="30" width="150" height="50" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="495" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Operating system</text><rect x="420" y="210" width="150" height="60" rx="6" fill="#d5e0e0" stroke="#17292d" stroke-width="2"/><text x="495" y="231.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Backing store</text><text x="495" y="248.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">(disk)</text><rect x="660" y="60" width="130" height="210" rx="6" fill="#fff" stroke="#17292d" stroke-width="2"/><text x="725" y="85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Physical memory</text><rect x="675" y="175" width="100" height="30" rx="0" fill="#9fd3a8" stroke="#17292d" stroke-width="2"/><text x="725" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#17292d" text-anchor="middle" dominant-baseline="middle">free frame</text><path d="M160,65 L248,82" fill="none" stroke="#17292d" stroke-width="2"/><path d="M248,82 L238.3,84.6 L240.0,76.0 Z" fill="#17292d"/><text x="204" y="59.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">1 reference</text><path d="M340,70 L420,55" fill="none" stroke="#17292d" stroke-width="2"/><path d="M420,55 L412.0,60.9 L410.3,52.4 Z" fill="#17292d"/><text x="380" y="50.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">2 trap</text><path d="M480,80 L480,208" fill="none" stroke="#17292d" stroke-width="2"/><path d="M480,208 L475.7,199.0 L484.3,199.0 Z" fill="#17292d"/><text x="490" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="start" dominant-baseline="middle">3 page is on disk</text><path d="M570,245 L673,200" fill="none" stroke="#17292d" stroke-width="2"/><path d="M673,200 L666.5,207.6 L663.0,199.6 Z" fill="#17292d"/><text x="660" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">4 bring in the missing page</text><line x1="675" y1="185" x2="365" y2="185" stroke="#17292d" stroke-width="2"/><line x1="365" y1="185" x2="365" y2="85" stroke="#17292d" stroke-width="2"/><path d="M365,85 L342,85" fill="none" stroke="#17292d" stroke-width="2"/><path d="M342,85 L351.0,80.7 L351.0,89.3 Z" fill="#17292d"/><text x="600" y="174" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">5 reset page table</text><path d="M250,150 L160,80" fill="none" stroke="#17292d" stroke-width="2"/><path d="M160,80 L169.8,82.1 L164.4,89.0 Z" fill="#17292d"/><text x="135" y="135" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">6 restart instruction</text><text x="410" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Steps in handling a page fault</text>
</svg>
