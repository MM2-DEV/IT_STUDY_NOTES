<svg xmlns="http://www.w3.org/2000/svg" width="680" height="275" viewBox="0 0 680 275" role="img" aria-label="Dual-mode operation">
<title>Dual-mode operation</title>
<rect width="680" height="275" fill="#ffffff"/>
<rect x="20" y="30" width="640" height="90" rx="4" fill="#fff" stroke="#17292d" stroke-width="2" stroke-dasharray="6 5"/><text x="32" y="48" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">User mode (mode bit = 1)</text><rect x="20" y="150" width="640" height="90" rx="4" fill="#eef7f6" stroke="#17292d" stroke-width="2" stroke-dasharray="6 5"/><text x="32" y="168" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#08595a" text-anchor="start" dominant-baseline="middle">Kernel mode (mode bit = 0)</text><rect x="60" y="65" width="160" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="140" y="77" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">User process</text><text x="140" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">executing</text><rect x="260" y="65" width="140" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="330" y="77" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Calls a</text><text x="330" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">system call</text><rect x="460" y="65" width="170" height="40" rx="6" fill="#eef7f6" stroke="#17292d" stroke-width="2"/><text x="545" y="77" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Return from</text><text x="545" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">system call</text><rect x="250" y="185" width="160" height="40" rx="6" fill="#dbda65" stroke="#17292d" stroke-width="2"/><text x="330" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">trap: mode bit = 0</text><rect x="440" y="185" width="200" height="40" rx="6" fill="#69c6ca" stroke="#17292d" stroke-width="2"/><text x="540" y="197" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">Execute system call;</text><text x="540" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#17292d" text-anchor="middle" dominant-baseline="middle">return: mode bit = 1</text><path d="M220,85 L258,85" fill="none" stroke="#17292d" stroke-width="2"/><path d="M258,85 L249.0,89.3 L249.0,80.7 Z" fill="#17292d"/><path d="M330,105 L330,183" fill="none" stroke="#17292d" stroke-width="2"/><path d="M330,183 L325.7,174.0 L334.3,174.0 Z" fill="#17292d"/><path d="M410,205 L438,205" fill="none" stroke="#17292d" stroke-width="2"/><path d="M438,205 L429.0,209.3 L429.0,200.7 Z" fill="#17292d"/><path d="M545,183 L545,107" fill="none" stroke="#17292d" stroke-width="2"/><path d="M545,107 L549.3,116.0 L540.7,116.0 Z" fill="#17292d"/><text x="340" y="260" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4b6166" text-anchor="middle" dominant-baseline="middle">Switching from user mode to kernel mode on a system call (trap) and back</text>
</svg>
